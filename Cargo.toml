[package]
name = "srt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["links", "wayland", "x11"] }
env_logger = "0.11"
glam = { version = "0.34", features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tga", "bmp"] }
log = "0.4"
pollster = "1"
rodio = "0.23"
wgpu = "30"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
fontdb = "0.23"
resvg = { version = "0.48", default-features = false }
