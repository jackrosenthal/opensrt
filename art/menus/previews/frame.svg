<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 191 84" width="191" height="84">
  <!-- Level picture frame: vector remake of the frame of the original
       Ski Resort Tycoon sprites mountain1 and mountain3 to mountain7
       (the same art in instant_action and ChallengeSelect), the
       picture of the chosen resort on the Instant Action and Challenges
       screens.  A rounded black rim, its right and bottom edges cut off
       as the original's are, round a sky that pales from blue to white
       with a lilac foot, darker inside its left edge and lighter inside
       its top and right ones.  Each resort's picture
       (preview_<resort>.svg) is drawn over it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="3" x2="0" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA8DE"/>
      <stop offset="0.05" stop-color="#4A9CD5"/>
      <stop offset="0.07" stop-color="#318BCD"/>
      <stop offset="0.2" stop-color="#4A9CD5"/>
      <stop offset="0.34" stop-color="#6AACDE"/>
      <stop offset="0.47" stop-color="#8BBDE6"/>
      <stop offset="0.6" stop-color="#ACD5EE"/>
      <stop offset="0.72" stop-color="#CDE6F6"/>
      <stop offset="0.81" stop-color="#EEF6FF"/>
      <stop offset="0.86" stop-color="#FFFFFF"/>
      <stop offset="0.92" stop-color="#F6F6FF"/>
      <stop offset="0.95" stop-color="#D9D2F0"/>
      <stop offset="0.99" stop-color="#D2CAEC"/>
      <stop offset="1" stop-color="#BDBDCD"/>
    </linearGradient>
    <clipPath id="inside"><path d="M12.9,3 H177.5 A10.5,10.5 0 0 1 188,13.5 V71.5 A10.5,10.5 0 0 1 177.5,82 H12.9 A10.5,10.5 0 0 1 2.4,71.5 V13.5 A10.5,10.5 0 0 1 12.9,3 Z"/></clipPath>
    <filter id="soft" x="-50%" y="-10%" width="200%" height="120%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>
  <path d="M13.5,0 H178.1 A13.5,13.5 0 0 1 191.6,13.5 V72 A13.5,13.5 0 0 1 178.1,85.5 H13.5 A13.5,13.5 0 0 1 0,72 V13.5 A13.5,13.5 0 0 1 13.5,0 Z" fill="#000000"/>
  <path d="M12.9,3 H177.5 A10.5,10.5 0 0 1 188,13.5 V71.5 A10.5,10.5 0 0 1 177.5,82 H12.9 A10.5,10.5 0 0 1 2.4,71.5 V13.5 A10.5,10.5 0 0 1 12.9,3 Z" fill="url(#sky)"/>
  <g clip-path="url(#inside)" filter="url(#soft)">
    <!-- darker inside the left edge, lighter inside the top and right -->
    <rect x="0" y="0" width="6.2" height="84" fill="#4040B0" fill-opacity="0.4"/>
    <rect x="0" y="0" width="191" height="7" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="183.2" y="0" width="10" height="84" fill="#FFFFFF" fill-opacity="0.5"/>
  </g>
</svg>
