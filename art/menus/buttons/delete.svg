  <g id="normal" class="state">
    <path d="M26.5,4.6 H94.5 A21.9,21.9 0 0 1 116.4,26.5 V26.5 A21.9,21.9 0 0 1 94.5,48.4 H26.5 A21.9,21.9 0 0 1 4.6,26.5 V26.5 A21.9,21.9 0 0 1 26.5,4.6 Z" fill="#000000"/>
    <use href="#face" fill="url(#white)"/>
