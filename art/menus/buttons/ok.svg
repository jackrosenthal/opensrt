<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 123 55" width="123" height="55">
  <!-- OK button of the Settings screen: vector remake of the original
       Ski Resort Tycoon sprites OK_Rollover and OK_Depress of settings
       (the screen's background shows it at rest).  It is the main
       menu's Quit button's pill.  A black rimmed pill, white shading to
       grey at its foot, yellow under the pointer and grey, shaded under
       its rim, when pressed, with its label in black over a soft
       shadow.  One group per state; the game shows one with a
       stylesheet. -->
  <defs>
    <linearGradient id="white" x1="0" y1="8" x2="0" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EAF0"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.74" stop-color="#FFFFFF"/>
      <stop offset="0.86" stop-color="#DCE0E4"/>
      <stop offset="1" stop-color="#BEC2CA"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="8" x2="0" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAEA9A"/>
      <stop offset="0.3" stop-color="#FFF673"/>
      <stop offset="0.74" stop-color="#FFF673"/>
      <stop offset="0.86" stop-color="#DEDA70"/>
      <stop offset="1" stop-color="#C2C072"/>
    </linearGradient>
    <path id="face" d="M25.5,8 H91.5 A17.5,17.5 0 0 1 109,25.5 V25.5 A17.5,17.5 0 0 1 91.5,43 H25.5 A17.5,17.5 0 0 1 8,25.5 V25.5 A17.5,17.5 0 0 1 25.5,8 Z"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.46"/>
    </filter>
    <path id="label" d="M49.96 15C44.34 15 40 19.22 40 24.68C40 30.08 44.39 34.33 49.94 34.33C55.43 34.33 59.67 30.11 59.67 24.68C59.67 19.3 55.36 15 49.96 15ZM49.91 18.34C53.41 18.34 56.15 21.11 56.15 24.7C56.15 28.32 53.49 30.99 49.91 30.99C46.34 30.99 43.53 28.21 43.53 24.68C43.53 21.06 46.29 18.34 49.91 18.34ZM62.43 34H65.93V25.79L71.78 34H76L68.9 24.5L76 15.33H71.78L65.93 23.39V15.33H62.43Z"/>
  </defs>

  <g id="normal" class="state">
    <path d="M25.5,3.6 H91.5 A21.9,21.9 0 0 1 113.4,25.5 V25.5 A21.9,21.9 0 0 1 91.5,47.4 H25.5 A21.9,21.9 0 0 1 3.6,25.5 V25.5 A21.9,21.9 0 0 1 25.5,3.6 Z" fill="#000000"/>
    <use href="#face" fill="url(#white)"/>
  </g>
  <g id="rollover" class="state" display="none">
    <path d="M25.5,3.6 H91.5 A21.9,21.9 0 0 1 113.4,25.5 V25.5 A21.9,21.9 0 0 1 91.5,47.4 H25.5 A21.9,21.9 0 0 1 3.6,25.5 V25.5 A21.9,21.9 0 0 1 25.5,3.6 Z" fill="#000000"/>
    <use href="#face" fill="url(#yellow)"/>
  </g>
  <g id="depress" class="state" display="none">
    <path d="M25.5,3.6 H91.5 A21.9,21.9 0 0 1 113.4,25.5 V25.5 A21.9,21.9 0 0 1 91.5,47.4 H25.5 A21.9,21.9 0 0 1 3.6,25.5 V25.5 A21.9,21.9 0 0 1 25.5,3.6 Z" fill="#000000"/>
    <use href="#face" fill="#BCC2C6"/>
    <g clip-path="url(#faceClip)">
      <use href="#face" transform="translate(-2.5,-3)" fill="none" stroke="#5A6068" stroke-width="5" filter="url(#soft)"/>
    </g>
  </g>
  <!-- the label, the same in every state -->
  <use href="#label" transform="translate(3,3.5)" fill="#4A4A50" fill-opacity="0.65" filter="url(#soft)"/>
  <use href="#label" fill="#000000"/>
</svg>
