  <g id="normal" class="state">
    <path d="M25,1.6 H106 A22.4,22.4 0 0 1 128.4,24 V24 A22.4,22.4 0 0 1 106,46.4 H25 A22.4,22.4 0 0 1 2.6,24 V24 A22.4,22.4 0 0 1 25,1.6 Z" fill="#000000"/>
