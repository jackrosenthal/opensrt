<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127 58" width="127" height="58">
  <!-- Quit button of the main menu: vector remake of the original Ski
       Resort Tycoon sprites main_quit_*.  A black rimmed pill, white
       shading to grey at its foot, yellow under the pointer and grey,
       shaded under its rim, when pressed, with its label in black over
       a soft shadow.  One group per state; the game shows one with a
       stylesheet. -->
  <defs>
    <linearGradient id="white" x1="0" y1="11" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EAF0"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.74" stop-color="#FFFFFF"/>
      <stop offset="0.86" stop-color="#DCE0E4"/>
      <stop offset="1" stop-color="#BEC2CA"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="11" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAEA9A"/>
      <stop offset="0.3" stop-color="#FFF673"/>
      <stop offset="0.74" stop-color="#FFF673"/>
      <stop offset="0.86" stop-color="#DEDA70"/>
      <stop offset="1" stop-color="#C2C072"/>
    </linearGradient>
    <path id="face" d="M29.5,11 H95.5 A17.5,17.5 0 0 1 113,28.5 V28.5 A17.5,17.5 0 0 1 95.5,46 H29.5 A17.5,17.5 0 0 1 12,28.5 V28.5 A17.5,17.5 0 0 1 29.5,11 Z"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.46"/>
    </filter>
