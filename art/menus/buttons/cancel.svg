<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 52" width="135" height="52">
  <!-- Cancel button: vector remake of the original Ski Resort Tycoon
       sprites Load_cancel_* and challenge_cancel_* (the same art), on
       the Instant Action, Challenges, and Map Editor screens.  A black
       rimmed pill, white shading to grey at its foot, yellow under the
       pointer and grey, shaded under its rim, when pressed, with its
       label in black over a soft shadow.  One group per state; the game
       shows one with a stylesheet. -->
  <defs>
    <linearGradient id="white" x1="0" y1="8" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EAF0"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.74" stop-color="#FFFFFF"/>
      <stop offset="0.86" stop-color="#DCE0E4"/>
      <stop offset="1" stop-color="#BEC2CA"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="8" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAEA9A"/>
      <stop offset="0.3" stop-color="#FFF673"/>
      <stop offset="0.74" stop-color="#FFF673"/>
      <stop offset="0.86" stop-color="#DEDA70"/>
      <stop offset="1" stop-color="#C2C072"/>
    </linearGradient>
    <path id="face" d="M27,8 H109 A18,18 0 0 1 127,26 V26 A18,18 0 0 1 109,44 H27 A18,18 0 0 1 9,26 V26 A18,18 0 0 1 27,8 Z"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.49"/>
    </filter>
