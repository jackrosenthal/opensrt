  <g id="normal" class="state">
    <path d="M27,3.6 H109 A22.4,22.4 0 0 1 131.4,26 V26 A22.4,22.4 0 0 1 109,48.4 H27 A22.4,22.4 0 0 1 4.6,26 V26 A22.4,22.4 0 0 1 27,3.6 Z" fill="#000000"/>
