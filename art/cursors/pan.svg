<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 43 38" width="43" height="38">
  <!-- Pan cursor (Cursor2): vector remake of the original Ski Resort Tycoon sprite.
       Translucent green ground tile with a red raise/lower arrow; hotspot near (21, 18). -->
  <defs>
    <clipPath id="tile">
      <path d="M0.6 18.5 L22 9 L43 18.5 L21.5 28.5 Z"/>
    </clipPath>
    <clipPath id="headUp">
      <path d="M21.5 1 L27.25 7 L15.75 7 Z"/>
    </clipPath>
    <clipPath id="headDown">
      <path d="M15.75 32 L27.25 32 L21.5 38 Z"/>
    </clipPath>
    <linearGradient id="shaft" gradientUnits="userSpaceOnUse" x1="19" y1="0" x2="24" y2="0">
      <stop offset="0" stop-color="#ff8080"/>
      <stop offset="0.2" stop-color="#ff7070"/>
      <stop offset="0.22" stop-color="#ff1010"/>
      <stop offset="0.4" stop-color="#ff0000"/>
      <stop offset="0.78" stop-color="#ff0000"/>
      <stop offset="0.82" stop-color="#bd0000"/>
      <stop offset="1" stop-color="#bd0000"/>
    </linearGradient>
    <linearGradient id="shaftLow" gradientUnits="userSpaceOnUse" x1="19" y1="0" x2="24" y2="0">
      <stop offset="0" stop-color="#ff6060"/>
      <stop offset="0.2" stop-color="#ff5a5a"/>
      <stop offset="0.22" stop-color="#ff2020"/>
      <stop offset="0.4" stop-color="#ff0000"/>
      <stop offset="0.78" stop-color="#ff0000"/>
      <stop offset="0.82" stop-color="#cd0000"/>
      <stop offset="1" stop-color="#cd0000"/>
    </linearGradient>
  </defs>

  <!-- Ground tile: uniform ~51% alpha, darker green rim, pale green face. -->
  <g opacity="0.514">
    <path d="M0.6 18.5 L22 9 L43 18.5 L21.5 28.5 Z" fill="#8bee83"/>
    <path d="M0.6 18.5 L22 9 L43 18.5 L21.5 28.5 Z" fill="none"
          stroke="#39cd29" stroke-width="2" stroke-linejoin="miter" clip-path="url(#tile)"/>
  </g>

  <!-- Upper arrow (raise). -->
  <path d="M21.5 1 L27.25 7 L15.75 7 Z" fill="#ff0000"/>
  <g clip-path="url(#headUp)">
    <path d="M21.5 1 L15.75 7" stroke="#ff9c9c" stroke-width="1.4" fill="none"/>
    <rect x="22.5" y="6" width="5" height="1" fill="#d00000"/>
  </g>
  <rect x="19" y="7" width="5" height="10" fill="url(#shaft)"/>
  <rect x="19" y="16" width="5" height="1" fill="#bd0000"/>
  <rect x="19" y="16" width="1" height="1" fill="#f65252"/>

  <!-- Lower arrow (lower). -->
  <rect x="19" y="28" width="5" height="4" fill="url(#shaftLow)"/>
  <path d="M15.75 32 L27.25 32 L21.5 38 Z" fill="#ff0000"/>
  <g clip-path="url(#headDown)">
    <path d="M15.75 32 L21.5 38 L27.25 32" stroke="#cd0000" stroke-width="1.4" fill="none"/>
    <rect x="15.5" y="32" width="4.5" height="1" fill="#ff9494"/>
    <rect x="23" y="32" width="4.5" height="1" fill="#f63838"/>
  </g>
</svg>
