<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 367" width="570" height="367">
  <!-- Bob's message window: vector remake of the chrome of the original
       Ski Resort Tycoon sprites bobHappy_background, bobNormal_background,
       bobPointing_background and bobUnhappy_background (the same window
       round four portraits).  A black rimmed slab with rounded corners,
       sky blue at the top, white across the middle and sky blue again at
       the foot, holding the sunken white box the portrait and message go
       in, with two snowflakes standing out in the bottom right corner.
       The portrait itself stays the original painting, which the game
       draws into the box over this; so does the OK button, which the
       original also paints into the window, under the button. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="4" x2="0" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0.01" stop-color="#C5CDF6"/>
      <stop offset="0.05" stop-color="#9CB4E6"/>
      <stop offset="0.12" stop-color="#ACC5EE"/>
      <stop offset="0.27" stop-color="#F6F6FF"/>
      <stop offset="0.29" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#EEEEFF"/>
      <stop offset="0.6" stop-color="#D5DEF6"/>
      <stop offset="0.77" stop-color="#B4C5EE"/>
      <stop offset="0.93" stop-color="#A4B4E6"/>
      <stop offset="1" stop-color="#94A4D5"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="560" y1="0" x2="565" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A6A8B" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A525A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="footShade" x1="0" y1="358" x2="0" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A5A84" stop-opacity="0"/>
      <stop offset="1" stop-color="#313952" stop-opacity="0.8"/>
    </linearGradient>
    <path id="inside" d="M15,4 H554 A11,11 0 0 1 565,15 V351 A11,11 0 0 1 554,362 H15 A11,11 0 0 1 4,351 V15 A11,11 0 0 1 15,4 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <filter id="flakeBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.05"/>
    </filter>
    <!-- A snowflake, radius 1: six spokes, each with two pairs of
         branches. -->
    <path id="arm" d="M0,0 V-1 M0,-0.45 L-0.28,-0.66 M0,-0.45 L0.28,-0.66 M0,-0.72 L-0.17,-0.86 M0,-0.72 L0.17,-0.86"/>
    <g id="flake">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
    </g>
    <!-- The box, on the line of its black edge. -->
    <rect id="box" x="16.8" y="51.8" width="533.6" height="258.6" rx="10"/>
    <clipPath id="boxClip"><use href="#box"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- the rim and the slab -->
  <rect x="0.4" y="0.4" width="568.2" height="365.2" rx="15" fill="#000000"/>
  <use href="#inside" fill="url(#sky)"/>
  <g clip-path="url(#insideClip)">
    <!-- a pale line inside the rim at the top and left, and the shade
         down the right and along the foot -->
    <path d="M4.8,362 V15 A10.2,10.2 0 0 1 15,4.8 H565" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6"/>
    <rect x="560" y="0" width="5" height="367" fill="url(#rightShade)"/>
    <rect x="0" y="358" width="570" height="4" fill="url(#footShade)"/>
  </g>

  <!-- two snowflakes, standing out a little -->
  <g fill="none" stroke-linecap="round">
    <g transform="translate(489,331) scale(13)">
      <use href="#flake" transform="translate(0.07,0.07)" stroke="#7B8BB4" stroke-opacity="0.6" stroke-width="0.17" filter="url(#flakeBlur)"/>
      <use href="#flake" stroke="#F4F6FF" stroke-opacity="0.9" stroke-width="0.11"/>
    </g>
    <g transform="translate(530,337) scale(17)">
      <use href="#flake" transform="translate(0.06,0.06)" stroke="#7B8BB4" stroke-opacity="0.6" stroke-width="0.14" filter="url(#flakeBlur)"/>
      <use href="#flake" stroke="#F4F6FF" stroke-opacity="0.9" stroke-width="0.09"/>
    </g>
  </g>

  <!-- the box, sunk into the window: shaded round its top and left
       outside, and along its bottom and right inside -->
  <use href="#box" transform="translate(-1.8,-1.6)" fill="none" stroke="#283040" stroke-opacity="0.7" stroke-width="3" filter="url(#soft)"/>
  <use href="#box" fill="#FFFFFF"/>
  <g clip-path="url(#boxClip)">
    <use href="#box" transform="translate(-2.6,-2.6)" fill="none" stroke="#9C9C9C" stroke-width="4" filter="url(#soft)"/>
  </g>
  <use href="#box" fill="none" stroke="#000000" stroke-width="1.6"/>
</svg>
