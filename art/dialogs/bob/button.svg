<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 51" width="52" height="51">
  <!-- Bob button: vector remake of the original Ski Resort Tycoon sprites
       bob_normal, BOB_rollover and BOB_depress, the button a challenge
       shows to bring Bob's last message back.  Bob's face, bald and
       jowly, with grey hair at his temples, steel glasses and a cigar in
       the corner of his mouth, on a square with rounded corners in a
       heavy black frame: white, pale yellow when the pointer is over it,
       and grey when pressed.  One group per state; the game shows one
       with a stylesheet. -->
  <defs>
    <radialGradient id="skin" cx="25" cy="17" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6C583"/>
      <stop offset="0.55" stop-color="#E6AC73"/>
      <stop offset="1" stop-color="#A4734A"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <g id="face">
      <!-- the head: a broad dome over heavy jowls -->
      <path d="M25.6,6.6 C35.6,6.6 41.6,12.4 42,20.4 C42.6,22.4 43.6,25.6 43,30 C42.2,36.6 35.6,43.4 25.6,43.4 C15.6,43.4 9,36.6 8.2,30 C7.6,25.6 8.6,22.4 9.2,20.4 C9.6,12.4 15.6,6.6 25.6,6.6 Z" fill="url(#skin)"/>
      <!-- grey hair at the temples -->
      <path d="M9.4,24 C8.6,19 9.6,15.4 12.6,13.4 C12.4,16.6 12.8,20 13.6,22.6 Z" fill="#7B7B7B"/>
      <path d="M41.8,24 C42.6,19 41.6,15.4 38.6,13.4 C38.8,16.6 38.4,20 37.6,22.6 Z" fill="#7B7B7B"/>
      <!-- brows, frowning a little, and the creases of the jowls -->
      <path d="M13.6,17.6 C16,15.8 19.6,15.8 22.4,17.6 M28.8,17.6 C31.6,15.8 35.2,15.8 37.6,17.6" fill="none" stroke="#7B5231" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M15.8,29.6 C16.6,33.6 18.8,35.6 21,36.6 M35.4,29.6 C34.6,33.6 32.4,35.6 30.2,36.6" fill="none" stroke="#A4734A" stroke-width="0.9" stroke-linecap="round"/>
      <!-- the nose -->
      <path d="M23.4,22.6 C23,25.6 22.2,27.4 23.4,28.4 C24.6,29.2 26.6,29.2 27.8,28.4 C29,27.4 28.2,25.6 27.8,22.6" fill="#E6AC73" stroke="#A4734A" stroke-width="0.7" stroke-linecap="round"/>
      <!-- the glasses and the eyes behind them -->
      <g fill="none" stroke="#3A3A42" stroke-width="1.1">
        <rect x="13.2" y="18.2" width="9.6" height="6" rx="2"/>
        <rect x="28.4" y="18.2" width="9.6" height="6" rx="2"/>
        <path d="M22.8,20.4 C24.2,19.6 27,19.6 28.4,20.4 M13.2,20.4 H8.8 M38,20.4 H42.4"/>
      </g>
      <circle cx="18" cy="21.2" r="1.5" fill="#21216A"/>
      <circle cx="33.2" cy="21.2" r="1.5" fill="#21216A"/>
      <!-- the mouth, and the cigar in its corner -->
      <path d="M20.4,32.6 C23.4,31.8 28,31.8 31.2,32.8" fill="none" stroke="#7B4A29" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M21.6,32.4 L12.6,38.2" stroke="#2A1A10" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M20.6,32.4 L13.4,37" stroke="#6A4A31" stroke-width="1" stroke-linecap="round"/>
    </g>
    <path id="square" d="M10.5,1.5 H41.5 A9,9 0 0 1 50.5,10.5 V40.5 A9,9 0 0 1 41.5,49.5 H10.5 A9,9 0 0 1 1.5,40.5 V10.5 A9,9 0 0 1 10.5,1.5 Z"/>
  </defs>

  <g id="normal" class="state">
    <use href="#square" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <use href="#face"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#square" fill="#F6EE9C" stroke="#000000" stroke-width="3"/>
    <use href="#face"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#square" fill="#CDCDCD" stroke="#000000" stroke-width="3"/>
    <use href="#face" transform="translate(0.6,0.6)"/>
  </g>
</svg>
