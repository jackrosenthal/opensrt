<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 95 95" width="23" height="23">
  <!-- No power marker: vector remake of the original Ski Resort Tycoon
       sprites electric_2X0000 to electric_2X0009 (Zoom2), shown over a
       building that has no electricity, one of four sizes (11, 23, 47
       and 95 pixels; the same drawing, laid out at the largest).  A
       glossy blue ring with a yellow lightning bolt in it, rimmed and
       sided in blue, that spins round on its upright: ten frames, a
       tenth of a turn apart (f0 to f9), its face darkening as it turns
       from the light.  One group per frame; the game shows one with a
       stylesheet. -->
  <defs>
    <radialGradient id="tube" cx="47.5" cy="47.5" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0.78" stop-color="#0010A4"/>
      <stop offset="0.88" stop-color="#3060FF"/>
      <stop offset="1" stop-color="#0008B4"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <!-- the ring, lit along its top left and glinting at its foot -->
  <circle cx="47.5" cy="47.5" r="40.2" fill="none" stroke="url(#tube)" stroke-width="10.4"/>
  <path d="M14,34 A36,36 0 0 1 61,13" fill="none" stroke="#8CA4FF" stroke-width="2.4" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M30,85 A39,39 0 0 0 76,76" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9" filter="url(#soft)"/>
