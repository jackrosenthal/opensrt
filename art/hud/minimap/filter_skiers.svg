<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 29" width="32" height="29">
  <!-- Mini-map skiers filter's picture: vector remake of the original
       Ski Resort Tycoon sprites Filter_skiers_*, drawn over the filter
       button frame.  A skier crouched over his skis heading down to the
       right: navy cap, blue jacket, red trousers and tan skis and poles.
       The same in every state. -->
  <g transform="translate(17,15.4) scale(0.85) translate(-17,-15.4)">
    <g fill="none" stroke-linecap="round">
      <!-- skis and poles -->
      <path d="M8.6,22.6 L25.4,17.6 M10.6,24 L26.4,19.4" stroke="#C5A46A" stroke-width="1.3"/>
      <path d="M20,13.6 L25.6,17.6 M13.4,13.4 L17.4,22" stroke="#B48B52" stroke-width="0.8"/>
    </g>
    <!-- trousers, jacket, arms, head -->
    <path d="M13.8,14.4 H19.4 L19.8,19.2 L18,21.4 L16.8,19 L15.6,21.6 L13.4,19.4 Z" fill="#B41818"/>
    <path d="M13.6,9.4 C14.6,8.4 18.6,8.2 20.4,9.4 L21,13 L19.6,14.8 H13.8 L12.6,12.6 Z" fill="#2A6AE6"/>
    <path d="M20.4,9.6 L22.4,12.6 L20.8,13.6 M12.8,10.6 L11.8,13 L13.4,13.8" fill="#2A6AE6"/>
    <circle cx="16.4" cy="7.2" r="1.9" fill="#101873"/>
    <path d="M15.6,21.4 L14.8,22.6 M18,21.4 L18.6,22.4" stroke="#101873" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
