<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 15" width="15" height="15">
  <!-- Thought icon: vector remake of the original Ski Resort Tycoon
       sprite Cold, shown over a guest who is cold: a red thermometer, low, on an icy blue disc with its scale beside it, rimmed in
       black and lit at its top left. -->
  <defs>
    <radialGradient id="disc" cx="6" cy="5.4" r="8.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6FFFF"/>
      <stop offset="0.6" stop-color="#BDF6F6"/>
      <stop offset="1" stop-color="#6AB4A4"/>
    </radialGradient>
  </defs>
  <circle cx="7.5" cy="7.5" r="6.8" fill="url(#disc)" stroke="#000000" stroke-width="0.8"/>
  <!-- the scale -->
  <path d="M8.6,4.6 H10.6 M8.6,6.6 H10 M8.6,8.6 H10.6" stroke="#000000" stroke-width="0.8"/>
  <!-- the thermometer: its tube and bulb, red to low on its scale -->
  <path d="M6,2.6 C6,1.9 7.6,1.9 7.6,2.6 V10.2 C8.4,10.6 8.6,11.4 8.4,12 C8,13 5.6,13 5.2,12 C5,11.4 5.2,10.6 6,10.2 Z" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M6.4,4 H7.2 V10.8 C7.8,11 7.9,11.6 7.6,12 C7.2,12.4 6.4,12.4 6,12 C5.7,11.6 5.8,11 6.4,10.8 Z" fill="#F60000"/>
</svg>
