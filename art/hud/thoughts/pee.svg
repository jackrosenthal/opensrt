<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 15" width="15" height="15">
  <!-- Thought icon: vector remake of the original Ski Resort Tycoon
       sprite Needs2piss, shown over a guest who is in need of a toilet: a yellow face with wide eyes and its mouth open in an O, rimmed in
       black and lit at its top left. -->
  <defs>
    <radialGradient id="disc" cx="6" cy="5.4" r="8.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFF9C"/>
      <stop offset="0.6" stop-color="#F6E641"/>
      <stop offset="1" stop-color="#C5AC10"/>
    </radialGradient>
  </defs>
  <circle cx="7.5" cy="7.5" r="6.8" fill="url(#disc)" stroke="#000000" stroke-width="0.8"/>
  <rect x="5" y="3.8" width="1.3" height="3" rx="0.6" fill="#000000"/>
  <rect x="8.7" y="3.8" width="1.3" height="3" rx="0.6" fill="#000000"/>
  <ellipse cx="7.5" cy="10.2" rx="1.6" ry="1.9" fill="none" stroke="#000000" stroke-width="1"/>
</svg>
