<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 15" width="15" height="15">
  <!-- Thought icon: vector remake of the original Ski Resort Tycoon
       sprite Hungry, shown over a guest who is hungry: a black fork and knife on a white disc, rimmed in
       black and lit at its top left. -->
  <defs>
    <radialGradient id="disc" cx="6" cy="5.4" r="8.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E6E6E6"/>
      <stop offset="1" stop-color="#ACACAC"/>
    </radialGradient>
  </defs>
  <circle cx="7.5" cy="7.5" r="6.8" fill="url(#disc)" stroke="#000000" stroke-width="0.8"/>
  <!-- the fork, its tines and handle, and the knife's blade and handle -->
  <path d="M3.9,3.6 V6.4 C3.9,7.6 4.6,8.2 5.4,8.4 V12.2 H6.6 V8.4 C7.4,8.2 8.1,7.6 8.1,6.4 V3.6 H7.3 V6.2 H6.5 V3.6 H5.5 V6.2 H4.7 V3.6 Z" fill="#000000"/>
  <path d="M11.4,3 C10,3.6 9.6,5.6 9.8,8 H10.6 V12.2 H11.8 V3 Z" fill="#000000"/>
</svg>
