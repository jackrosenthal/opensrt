<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 45 57" width="45" height="57">
  <!-- Staff menu log: vector remake of the original Ski Resort Tycoon
       sprites LogStaff_Normal/_Rollover/_Depress.  This log has no
       tray, so it has no open state.  One group per state; the game
       shows one with a stylesheet. -->
  <defs>
    <!-- The log, shared by every top bar and menu log: a black rimmed
         disc whose face is shaded inside its rim. -->
    <circle id="face" cx="23" cy="33" r="18"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- Lit: a shadow along the lower-right inside of the rim. -->
    <g id="faceNormal">
      <use href="#face" fill="#FFFFFF"/>
      <g clip-path="url(#faceClip)">
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#8A8A8E" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="faceRollover">
      <use href="#face" fill="#FFFF73"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25" cy="35" r="19.4" fill="none" stroke="#FFFFD8" stroke-width="3" filter="url(#inset)"/>
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#9C9C66" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <use href="#face" fill="#C5C5C5"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25.4" cy="35.4" r="20.4" fill="none" stroke="#3C3C3C" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="rim">
      <circle cx="23" cy="33" r="18" fill="none" stroke="#5A5A5E" stroke-width="0.9" stroke-opacity="0.7"/>
      <circle cx="23" cy="33" r="19.55" fill="none" stroke="#000000" stroke-width="3"/>
    </g>

    <!-- The stem the log hangs from the one above by, reaching up into
         its rim (the drawing starts 2 px above the sprite). -->
    <rect id="stem" x="21" y="-2" width="4" height="16" fill="#000000"/>

    <!-- Gradients for the two faces, lit from the upper left. -->
    <radialGradient id="hatDome" gradientUnits="userSpaceOnUse" cx="15" cy="21.5" r="11.5">
      <stop offset="0" stop-color="#FFF2CC"/>
      <stop offset="0.4" stop-color="#F4CE6E"/>
      <stop offset="0.75" stop-color="#E2A622"/>
      <stop offset="1" stop-color="#8B6210"/>
    </radialGradient>
    <linearGradient id="hatBrim" gradientUnits="userSpaceOnUse" x1="0" y1="25.2" x2="0" y2="28.2">
      <stop offset="0" stop-color="#E6AC29"/>
      <stop offset="0.3" stop-color="#FFDE7B"/>
      <stop offset="0.65" stop-color="#FFF4C4"/>
      <stop offset="1" stop-color="#C8A47A"/>
    </linearGradient>
    <radialGradient id="beard" gradientUnits="userSpaceOnUse" cx="13" cy="33" r="11">
      <stop offset="0" stop-color="#A47A52"/>
      <stop offset="0.5" stop-color="#7B5231"/>
      <stop offset="1" stop-color="#3A1E0E"/>
    </radialGradient>
    <radialGradient id="skinA" gradientUnits="userSpaceOnUse" cx="15" cy="31" r="8">
      <stop offset="0" stop-color="#FFE6D2"/>
      <stop offset="0.5" stop-color="#EEAC8B"/>
      <stop offset="1" stop-color="#B47A5A"/>
    </radialGradient>
    <radialGradient id="capDome" gradientUnits="userSpaceOnUse" cx="27" cy="28" r="9.5">
      <stop offset="0" stop-color="#F08A90"/>
      <stop offset="0.3" stop-color="#E6414A"/>
      <stop offset="0.65" stop-color="#D00C1A"/>
      <stop offset="1" stop-color="#6E0008"/>
    </radialGradient>
    <linearGradient id="lens" gradientUnits="userSpaceOnUse" x1="0" y1="34.8" x2="0" y2="37">
      <stop offset="0" stop-color="#8FC0C0"/>
      <stop offset="0.5" stop-color="#4A8A8A"/>
      <stop offset="1" stop-color="#1E4242"/>
    </linearGradient>
    <radialGradient id="skinB" gradientUnits="userSpaceOnUse" cx="25.5" cy="39.5" r="10">
      <stop offset="0" stop-color="#FFDEBD"/>
      <stop offset="0.35" stop-color="#EEA483"/>
      <stop offset="0.7" stop-color="#CE865E"/>
      <stop offset="1" stop-color="#6A4A31"/>
    </radialGradient>

    <g id="icon">
      <!-- The bearded worker: his head, brown with hair and beard. -->
      <path d="M10,28 L24.8,28 L24.8,34 C24.5,37.5 23,40.5 20.5,42 L16.5,42 C13.5,41 11.2,38.5 10.6,35 Z" fill="url(#beard)"/>
      <!-- His ear, just under the brim. -->
      <ellipse cx="9.2" cy="28.6" rx="0.9" ry="1" fill="#DE9673"/>
      <!-- His face above the beard. -->
      <path d="M11.8,28.4 L23.6,28.4 L23.4,33.6 C21,34.6 13.8,34.6 12,33.6 Z" fill="url(#skinA)"/>
      <!-- His glasses: two gray lenses in a dark frame, under dark brows. -->
      <path d="M11.2,28.2 L24.4,28.2" fill="none" stroke="#2A1610" stroke-width="1.1"/>
      <rect x="11.8" y="28.6" width="4.6" height="3.8" rx="0.9" fill="#8B837B" fill-opacity="0.55" stroke="#4A2C1C" stroke-width="0.65"/>
      <rect x="18.4" y="28.6" width="4.6" height="3.8" rx="0.9" fill="#8B837B" fill-opacity="0.55" stroke="#4A2C1C" stroke-width="0.65"/>
      <circle cx="13.8" cy="31.2" r="0.6" fill="#3A2418"/>
      <circle cx="21" cy="31.2" r="0.6" fill="#3A2418"/>
      <!-- His nose, lit down its left. -->
      <path d="M17,29.6 L18,29.6 L18.6,33.4 L16.4,33.4 Z" fill="#FFE6CC"/>
      <path d="M16.2,33.6 C17,34.1 18,34.1 18.8,33.6" fill="none" stroke="#B4836A" stroke-width="0.6"/>
      <!-- His mustache, dark over the mouth. -->
      <path d="M14.4,35.2 C15.5,34 19.5,34 20.6,35.2 C19.5,35.8 15.5,35.8 14.4,35.2 Z" fill="#412010"/>
      <!-- His grin: teeth over a pink lower lip. -->
      <path d="M15.2,36.9 C16.5,38.4 18.8,38.4 19.9,36.9 Z" fill="#DE8B6A"/>
      <rect x="15.9" y="35.9" width="3.6" height="1.2" rx="0.4" fill="#DED5DE"/>
      <!-- The yellow hard hat's dome. -->
      <path d="M9.6,26 C9.6,21.2 12.8,17.8 18,17.8 C23.4,17.8 26,21.6 26,26 Z" fill="url(#hatDome)"/>
      <!-- Its center ridge: a highlight left of a dark groove. -->
      <path d="M16.6,18.6 C16.4,20.6 16.4,23 16.7,25.4" fill="none" stroke="#FFF8DE" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M18.6,18.4 C18.9,20.6 18.9,23 18.6,25.4" fill="none" stroke="#9C6A08" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Its brim. -->
      <path d="M8,26.5 C8,25.6 8.8,25.2 10,25.2 L25.6,25.2 C26.6,25.3 27,25.9 26.8,26.7 L25.8,27.7 C25,28.2 23.5,28.1 22.5,28.1 L10.5,28.1 C8.8,28.1 8,27.6 8,26.5 Z" fill="url(#hatBrim)"/>

      <!-- The worker in the red cap: his face. -->
      <path d="M23.6,34.8 L35,34.8 L34.9,43.6 C34,45.8 31.8,47.4 29.6,47.9 L26.6,47.9 C24.8,47 23.2,45 22.6,42.6 L22.6,37 Z" fill="url(#skinB)"/>
      <!-- His rosy cheeks. -->
      <ellipse cx="24.8" cy="38.6" rx="1.3" ry="0.8" fill="#FF5A4A" fill-opacity="0.7"/>
      <ellipse cx="31" cy="38.6" rx="1.3" ry="0.8" fill="#FF6A73" fill-opacity="0.7"/>
      <!-- His nose, with a shine on top and a shadow under it. -->
      <path d="M27.2,38 L29.2,38 L29.4,40.4 C28.6,41 27.6,41 26.8,40.4 Z" fill="#EEAC8B"/>
      <ellipse cx="28.3" cy="38.6" rx="0.6" ry="0.5" fill="#F6F6F6"/>
      <path d="M26.8,40.8 C27.6,41.3 28.8,41.3 29.6,40.8" fill="none" stroke="#5A3420" stroke-width="0.6"/>
      <!-- His grin: teeth in a dark mouth over a lit lower lip. -->
      <path d="M24.2,42 C25.8,43 29,43 31,42 C30,43.6 25.6,43.8 24.2,42 Z" fill="#312020"/>
      <path d="M25.6,42.3 L28.8,42.4 C28.4,42.9 26.4,43 25.6,42.3 Z" fill="#D5CDCD"/>
      <path d="M25.2,44 C26.5,44.7 29,44.7 30.2,44" fill="none" stroke="#F0B090" stroke-width="0.7" stroke-linecap="round"/>
      <!-- His sunglasses: teal lenses in a red frame. -->
      <path d="M23.4,37.3 L32.4,37.3" fill="none" stroke="#C81020" stroke-width="0.7"/>
      <rect x="23.8" y="34.8" width="3.4" height="2.4" rx="0.6" fill="url(#lens)" stroke="#BD1829" stroke-width="0.6"/>
      <rect x="28.2" y="34.8" width="3.6" height="2.4" rx="0.6" fill="url(#lens)" stroke="#BD1829" stroke-width="0.6"/>
      <!-- The red cap's crown. -->
      <path d="M24.6,34 L24.7,27.6 C24.8,25.6 26.6,24.9 29.4,24.9 C33,25 35.6,27.6 35.6,31 L35.6,34.2 Z" fill="url(#capDome)"/>
      <!-- Its bill, seen head on and in shade. -->
      <path d="M24,33.2 L35.8,33.2 L35.6,35 L24.2,35 Z" fill="#8B2920"/>
      <path d="M24.2,34.4 L35.6,34.4" fill="none" stroke="#94414A" stroke-width="0.8"/>
    </g>
  </defs>

  <use href="#stem"/>
  <g id="normal" class="state">
    <use href="#faceNormal"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#faceRollover"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
