<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 81 55" width="81" height="55">
  <!-- Long tray piece: vector remake of the original Ski Resort Tycoon
       sprite LogButton_C. What a menu log stretches into while its tray
       is open: the log's place, with the start of the strip the tray's
       buttons sit on. -->
  <defs>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- The tray's strip: a black edge round a white inside, with a pale
         band along the top and a grey one along the bottom. -->
    <clipPath id="inside"><path d="M23,15 H121 V51 H23 Z"/></clipPath>
  </defs>

  <!-- The log's place, covered by the log while its tray is open. -->
  <circle cx="23" cy="33" r="21" fill="#000000"/>
  <path d="M23,12 H81 V54 H23 Z" fill="#000000"/>
  <g clip-path="url(#inside)">
    <rect x="-40" y="15" width="161" height="36" fill="#FFFFFF"/>
    <rect x="-40" y="15" width="161" height="3" fill="#F6EEF6"/>
    <rect x="-40" y="48" width="161" height="3" fill="#C5C5C5"/>
  </g>
  <circle cx="23" cy="33" r="18" fill="#C5C5C5"/>
  <clipPath id="face"><circle cx="23" cy="33" r="18"/></clipPath>
  <g clip-path="url(#face)">
    <circle cx="25.4" cy="35.4" r="20.4" fill="none" stroke="#3C3C3C" stroke-width="5" filter="url(#inset)"/>
  </g>
</svg>
