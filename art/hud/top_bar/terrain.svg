<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 55" width="45" height="55">
  <!-- Terrain button: vector remake of the original Ski Resort Tycoon
       sprites LogEditTerrain_Normal/_Rollover/_Depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The log, shared by every top bar and menu log: a black rimmed
         disc whose face is shaded inside its rim. -->
    <circle id="face" cx="23" cy="33" r="18"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- Lit: a shadow along the lower-right inside of the rim. -->
    <g id="faceNormal">
      <use href="#face" fill="#FFFFFF"/>
      <g clip-path="url(#faceClip)">
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#8A8A8E" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="faceRollover">
      <use href="#face" fill="#FFFF73"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25" cy="35" r="19.4" fill="none" stroke="#FFFFD8" stroke-width="3" filter="url(#inset)"/>
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#9C9C66" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <use href="#face" fill="#C5C5C5"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25.4" cy="35.4" r="20.4" fill="none" stroke="#3C3C3C" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="rim">
      <circle cx="23" cy="33" r="18" fill="none" stroke="#5A5A5E" stroke-width="0.9" stroke-opacity="0.7"/>
      <circle cx="23" cy="33" r="19.55" fill="none" stroke="#000000" stroke-width="3"/>
    </g>

    <!-- The mountain: a snowy peak lit from the upper left, its lower
         right face and a central gully in bare rock. -->
    <linearGradient id="snowFill" x1="16" y1="22" x2="28" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#ECECEC"/>
      <stop offset="1" stop-color="#ADA8A8"/>
    </linearGradient>
    <linearGradient id="rockFill" x1="24" y1="24" x2="33" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A7676"/>
      <stop offset="1" stop-color="#423C3C"/>
    </linearGradient>
    <!-- The pines: green, shading darker toward the foot. -->
    <linearGradient id="pineFill" x1="0" y1="30" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1AA050"/>
      <stop offset="1" stop-color="#0A5A24"/>
    </linearGradient>
    <linearGradient id="pineDark" x1="0" y1="30" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E7A3A"/>
      <stop offset="1" stop-color="#043414"/>
    </linearGradient>
    <g id="icon">
      <!-- the snowy mountain, its foot reaching down behind the trees -->
      <path d="M22.6,18.8 L25.2,21.4 L27.4,24.4 L30.4,27.6 L33.6,31 L35.2,35.4 L33.6,39.4 L23,41.4 L12.4,39.4 L10.6,35.2 L13.4,30 L15.6,27.4 L17,25.6 L18.6,23.4 L20.6,21 Z" fill="url(#snowFill)"/>
      <!-- the bare rock of the lower right face -->
      <path d="M27.4,24.4 L30.4,27.6 L33.6,31 L35.2,35.4 L33.6,39.4 L30.6,40.2 L30,35.6 L28.6,31.6 L28.4,28.4 L26.8,26.4 Z" fill="url(#rockFill)"/>
      <!-- the dark gully down the middle -->
      <path d="M22.8,28.6 L23.8,31 L23.8,37.6 L22.6,40.4 L21.4,37.6 L21.8,31.6 Z" fill="#4E4848"/>
      <!-- crags of rock showing through the snow -->
      <path fill="none" stroke="#7A7A7A" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"
            d="M22.6,19.8 L21.6,22.4 L22.4,24.6 M21,22.6 L19.4,24.6 L18.2,27.4 M24.4,21.4 L25.4,24 L24.4,26.6
               M20.2,25.4 L19.6,28.4 M17,26.4 L15.4,29.6 M22,26.2 L22.6,29.4 M25,27 L26.6,26.4 M19.4,29.2 L18.6,31.8
               M25.6,24.6 L26.8,25.6 M15.8,30.6 L15.2,32.6 M13.4,33 L12.6,35.4 M18.4,33 L17.8,35.6"/>
      <!-- a thin row of separate pines along the foot -->
      <path d="M10.8,33.4 L12.1,39.2 L9.6,39.2 Z" fill="url(#pineFill)"/>
      <path d="M10.8,33.4 L10.7,38.7 L9.9,38.7 Z" fill="#3CB466" fill-opacity="0.7"/>
      <path d="M13.6,32.4 L14.8,40.6 L12.3,40.6 Z" fill="url(#pineDark)"/>
      <path d="M13.6,32.4 L13.5,40.1 L12.7,40.1 Z" fill="#3CB466" fill-opacity="0.7"/>
      <path d="M16.4,33.4 L17.6,41.8 L15.1,41.8 Z" fill="url(#pineFill)"/>
      <path d="M16.4,33.4 L16.3,41.3 L15.4,41.3 Z" fill="#3CB466" fill-opacity="0.7"/>
      <path d="M19.2,34.6 L20.4,42.6 L17.9,42.6 Z" fill="url(#pineDark)"/>
      <path d="M19.2,34.6 L19.1,42.1 L18.2,42.1 Z" fill="#3CB466" fill-opacity="0.7"/>
      <path d="M22,35.4 L23.2,43 L20.8,43 Z" fill="url(#pineFill)"/>
      <path d="M22,35.4 L21.9,42.5 L21.1,42.5 Z" fill="#3CB466" fill-opacity="0.7"/>
      <path d="M24.8,35 L26.1,42.6 L23.6,42.6 Z" fill="url(#pineDark)"/>
      <path d="M24.8,35 L24.7,42.1 L23.9,42.1 Z" fill="#3CB466" fill-opacity="0.7"/>
      <path d="M27.6,33.8 L28.9,41.8 L26.4,41.8 Z" fill="url(#pineFill)"/>
      <path d="M27.6,33.8 L27.5,41.3 L26.7,41.3 Z" fill="#3CB466" fill-opacity="0.7"/>
      <path d="M30.4,32.8 L31.6,40.6 L29.1,40.6 Z" fill="url(#pineDark)"/>
      <path d="M30.4,32.8 L30.3,40.1 L29.4,40.1 Z" fill="#3CB466" fill-opacity="0.7"/>
      <path d="M33.2,33.4 L34.5,39.2 L32.0,39.2 Z" fill="url(#pineFill)"/>
      <path d="M33.2,33.4 L33.1,38.7 L32.2,38.7 Z" fill="#3CB466" fill-opacity="0.7"/>
      <!-- their trunks -->
      <path d="M10.5,39.2 h0.6 v0.9 h-0.6 Z M13.3,40.6 h0.6 v0.9 h-0.6 Z M16.1,41.8 h0.6 v0.9 h-0.6 Z M18.9,42.6 h0.6 v0.9 h-0.6 Z M21.7,43 h0.6 v0.9 h-0.6 Z M24.5,42.6 h0.6 v0.9 h-0.6 Z M27.3,41.8 h0.6 v0.9 h-0.6 Z M30.1,40.6 h0.6 v0.9 h-0.6 Z M32.9,39.2 h0.6 v0.9 h-0.6 Z" fill="#7E6448"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#faceNormal"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#faceRollover"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
