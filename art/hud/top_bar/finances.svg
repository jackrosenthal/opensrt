<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 55" width="45" height="55">
  <!-- Finances button: vector remake of the original Ski Resort Tycoon
       sprites LogFinances_normal/_Rollover/_Depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The log, shared by every top bar and menu log: a black rimmed
         disc whose face is shaded inside its rim. -->
    <circle id="face" cx="23" cy="33" r="18"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- Lit: a shadow along the lower-right inside of the rim. -->
    <g id="faceNormal">
      <use href="#face" fill="#FFFFFF"/>
      <g clip-path="url(#faceClip)">
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#8A8A8E" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="faceRollover">
      <use href="#face" fill="#FFFF73"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25" cy="35" r="19.4" fill="none" stroke="#FFFFD8" stroke-width="3" filter="url(#inset)"/>
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#9C9C66" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <use href="#face" fill="#C5C5C5"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25.4" cy="35.4" r="20.4" fill="none" stroke="#3C3C3C" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="rim">
      <circle cx="23" cy="33" r="18" fill="none" stroke="#5A5A5E" stroke-width="0.9" stroke-opacity="0.7"/>
      <circle cx="23" cy="33" r="19.55" fill="none" stroke="#000000" stroke-width="3"/>
    </g>

    <!-- The dollar sign's S, as one outline: a bold, flowing S with
         curved bowls and angled, tapered terminals, starting at the top
         terminal's outer corner. -->
    <path id="dollarS" d="M29.3,23.5 C27.4,22.5 24.4,22.2 21.2,22.2 C15.7,22.2 12.4,24.6 12.4,28
             C12.4,31.6 16.4,32.9 20.4,34.5 C23.4,35.5 25.1,36 25.1,37.2 C25.1,38.4 23.5,39 21.2,39
             C18.8,39 16.8,38.3 15.4,36.7 L12.5,37.3 C12.3,38.9 12.5,40.5 13.1,41.5
             C15,42.5 18,42.8 21.2,42.8 C26.7,42.8 30,40.4 30,37 C30,33.4 26,32.1 22,30.5
             C19,29.5 17.3,29 17.3,27.8 C17.3,26.6 18.9,26 21.2,26 C23.6,26 25.6,26.7 27,28.3
             L29.9,27.7 C30.1,26.1 29.9,24.5 29.3,23.5 Z"/>
    <!-- The vertical stroke, which shows above, below, and through the
         counters. -->
    <rect id="dollarBar" x="19.7" y="19.7" width="3" height="25.9" rx="0.3"/>
    <clipPath id="dollarClip"><use href="#dollarS"/><use href="#dollarBar"/></clipPath>
    <!-- The same, nudged up-left and down-right, to cut the bevel. -->
    <clipPath id="dollarClipLow"><use href="#dollarS" x="0.55" y="0.55"/><use href="#dollarBar" x="0.55" y="0.55"/></clipPath>
    <linearGradient id="goldFill" gradientUnits="userSpaceOnUse" x1="13" y1="22" x2="30" y2="43">
      <stop offset="0" stop-color="#FFD000"/>
      <stop offset="0.4" stop-color="#D48A00"/>
      <stop offset="0.62" stop-color="#F8C400"/>
      <stop offset="1" stop-color="#FFF000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <g id="icon">
      <!-- The gold's dark extruded side, toward the lower right, with a
           thin dark edge all around. -->
      <g fill="#2E2000" stroke="#2E2000" stroke-width="0.6" stroke-linejoin="round">
        <use href="#dollarS" x="1.5" y="1.3"/>
        <use href="#dollarBar" x="1.5" y="1.3"/>
        <use href="#dollarS" x="1" y="0.85"/>
        <use href="#dollarBar" x="1" y="0.85"/>
        <use href="#dollarS" x="0.5" y="0.4"/>
        <use href="#dollarBar" x="0.5" y="0.4"/>
      </g>
      <g fill="#5C4000">
        <use href="#dollarS" x="0.5" y="0.4"/>
        <use href="#dollarBar" x="0.5" y="0.4"/>
      </g>
      <g clip-path="url(#dollarClip)">
        <!-- The bevel: shaded along the lower-right edges... -->
        <rect x="10" y="18" width="24" height="30" fill="#9A6400"/>
        <!-- ...and lit along the upper-left edges. -->
        <use href="#dollarS" x="-0.55" y="-0.55" fill="#FFF470"/>
        <use href="#dollarBar" x="-0.55" y="-0.55" fill="#FFF470"/>
        <!-- The face of the gold, inside the bevel. -->
        <g clip-path="url(#dollarClipLow)">
          <rect x="10" y="18" width="24" height="30" fill="url(#goldFill)"/>
          <!-- Shine and shade on the face, as in the original. -->
          <g filter="url(#glow)">
            <ellipse cx="15.4" cy="29.2" rx="2.6" ry="1.8" fill="#FFF400"/>
            <ellipse cx="26.6" cy="38.6" rx="2.4" ry="3" fill="#FFFF40"/>
            <ellipse cx="22" cy="24" rx="3" ry="1.1" fill="#FFF000"/>
            <ellipse cx="20.6" cy="32.6" rx="3.4" ry="1.2" fill="#A06000"/>
            <ellipse cx="14.8" cy="40" rx="2" ry="1.6" fill="#C88400"/>
            <rect x="20.3" y="18" width="1.2" height="30" fill="#FFF060" opacity="0.6"/>
          </g>
        </g>
      </g>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#faceNormal"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#faceRollover"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
