<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="76">
  <!-- Top bar: vector remake of rows 0..76 of the original Ski Resort
       Tycoon 1024x768 frame art.  The game draws it as wide as the window
       (in layout pixels, at least 1024) by setting the root's width, so
       the left part keeps its layout x, the money tray stays in the
       middle (layout x 418..606 of a 1024-wide bar) and the right part is
       laid out from the right edge.  The logs hang from its hooks, and the
       money and stars are drawn over the tray.

       The bar and the tray share one outline, 2 px wide along the line
       y=21, and one soft shadow inside it, so the tray reads as part of
       the bar.  The middle part redraws the bar across x 340..684 (of a
       1024-wide bar) with the tray in it; outside the tray it draws
       exactly what the bar does, so the two meet without a seam. -->
  <defs>
    <!-- The face of the bar and the tray, sampled down the original: the
         bar's blues to white at y 18, then on down the tray to blue at
         its bottom. -->
    <linearGradient id="face" x1="0" y1="1" x2="0" y2="71" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B4BDE6"/>
      <stop offset="0.015" stop-color="#BDCDF6"/>
      <stop offset="0.044" stop-color="#9CB4E6"/>
      <stop offset="0.073" stop-color="#ACBDEE"/>
      <stop offset="0.114" stop-color="#B4C5EE"/>
      <stop offset="0.157" stop-color="#C5D5F6"/>
      <stop offset="0.2" stop-color="#DEE6FF"/>
      <stop offset="0.243" stop-color="#F6F6FF"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#F6F6FF"/>
      <stop offset="0.52" stop-color="#DEE6FF"/>
      <stop offset="0.67" stop-color="#C5D5F6"/>
      <stop offset="0.8" stop-color="#B4C5EE"/>
      <stop offset="1" stop-color="#9CB4E6"/>
    </linearGradient>
    <!-- The soft shadow along the inside of the outline. -->
    <filter id="inset" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <!-- The same, for the bar's straight run, which is too thin for a
         filter region sized to it. -->
    <filter id="insetBar" filterUnits="userSpaceOnUse" x="-20" y="10" width="110%" height="20">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <!-- The bar's and the tray's shadow on the world below. -->
    <filter id="drop" x="-5%" y="-20%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- The outline's center line through the middle part: along the
         bar, down round the tray, and back along the bar. -->
    <path id="line" d="M300,21 H419 C435,21 442,25 444.5,30 L462.5,66 C464,69 467.5,72 474,72 H550 C556.5,72 560,69 561.5,66 L579.5,30 C582,25 589,21 605,21 H724"/>
    <!-- What lies inside it: the bar's face and the tray's. -->
    <path id="inside" d="M300,1 V21 H419 C435,21 442,25 444.5,30 L462.5,66 C464,69 467.5,72 474,72 H550 C556.5,72 560,69 561.5,66 L579.5,30 C582,25 589,21 605,21 H724 V1 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <clipPath id="barClip"><rect x="0" y="1" width="100%" height="20"/></clipPath>
    <!-- The middle part's share of the bar. -->
    <clipPath id="middle"><rect x="340" y="0" width="344" height="76"/></clipPath>

    <!-- A hook a log hangs from: a black spike under the bar, lit a
         little on its right. -->
    <path id="hook" d="M-8,21 Q-6.2,21.8 -5.8,24 L-0.5,40 H0.5 L5.8,24 Q6.2,21.8 8,21 Z"/>
    <g id="hookLit">
      <use href="#hook" fill="#000000"/>
      <path d="M3.6,24 L0.4,37.5" fill="none" stroke="#6E4234" stroke-width="0.7" stroke-opacity="0.8"/>
    </g>
  </defs>

  <!-- The bar's and the tray's shadow on the world below, as one shape so
       it doesn't darken where they overlap. -->
  <g filter="url(#drop)" fill="#523F31" opacity="0.35" transform="translate(0,1.5)">
    <rect x="0" y="0" width="100%" height="22"/>
    <svg x="50%" y="0" overflow="visible">
      <g transform="translate(-512,0)">
        <use href="#inside"/>
        <use href="#line" fill="none" stroke="#523F31" stroke-width="2"/>
      </g>
    </svg>
  </g>

  <!-- The bar: its face, the soft shadow along the inside of its bottom
       edge, and its outline. -->
  <rect x="0" y="0" width="100%" height="22" fill="#000000"/>
  <rect x="0" y="1" width="100%" height="20" fill="url(#face)"/>
  <g clip-path="url(#barClip)">
    <rect x="-10" y="19.2" width="110%" height="1.4" fill="#2E3450" fill-opacity="0.6" filter="url(#insetBar)"/>
  </g>
  <rect x="0" y="20" width="100%" height="2" fill="#000000"/>

  <!-- Screen edges: a black rim, with a soft shadow inside it, deeper on
       the right. -->
  <linearGradient id="edgeLeft" x1="1" y1="0" x2="4.5" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2E3450" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#2E3450" stop-opacity="0"/>
  </linearGradient>
  <rect x="0" y="0" width="1" height="22" fill="#000000"/>
  <rect x="1" y="1" width="3.5" height="20" fill="url(#edgeLeft)"/>

  <!-- The left logs' hooks: grid, build, terrain, finances. -->
  <use href="#hookLit" x="142"/>
  <use href="#hookLit" x="202"/>
  <use href="#hookLit" x="260"/>
  <use href="#hookLit" x="317"/>

  <!-- Middle: the bar again across layout x 340..684, about the bar's
       middle, with the money tray hanging from it. -->
  <svg x="50%" y="0" overflow="visible">
    <g transform="translate(-512,0)" clip-path="url(#middle)">
      <use href="#inside" fill="url(#face)"/>
      <g clip-path="url(#insideClip)">
        <use href="#line" fill="none" stroke="#2E3450" stroke-width="1.4" stroke-opacity="0.6" transform="translate(0,-1.1)" filter="url(#inset)"/>
      </g>
      <use href="#line" fill="none" stroke="#000000" stroke-width="2"/>
      <!-- The money and star box. -->
      <rect x="464" y="21.2" width="94" height="34.2" rx="7.5" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    </g>
  </svg>

  <!-- Right part, from the right edge: layout x 594..1024 of a 1024-wide bar. -->
  <svg x="100%" y="0" overflow="visible">
    <g transform="translate(-1024,0)">
      <!-- The right logs' hooks: main menu, pause, first person, survey. -->
      <use href="#hookLit" x="707"/>
      <use href="#hookLit" x="766"/>
      <use href="#hookLit" x="824"/>
      <use href="#hookLit" x="882"/>

      <!-- Screen edge -->
      <linearGradient id="edgeRight" x1="1023" y1="0" x2="1018.5" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2E3450" stop-opacity="0.75"/>
        <stop offset="1" stop-color="#2E3450" stop-opacity="0"/>
      </linearGradient>
      <rect x="1018.5" y="1" width="4.5" height="20" fill="url(#edgeRight)"/>
      <rect x="1023" y="0" width="1" height="22" fill="#000000"/>
    </g>
  </svg>
</svg>
