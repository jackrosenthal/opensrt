<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Jumps tray button: vector remake of the original Ski Resort Tycoon
       sprites Tray_Jumps_Normal/_Rollover/_Depress.  One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- The inrun's snow, pale grey and brightest along its right edge. -->
    <linearGradient id="jumpSnow" x1="29" y1="0" x2="38" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C2BBAD"/>
      <stop offset="0.35" stop-color="#C8CDC6"/>
      <stop offset="0.8" stop-color="#C6CBC5"/>
      <stop offset="1" stop-color="#D6D8D6"/>
    </linearGradient>
    <!-- Round timber, lit on the left. -->
    <linearGradient id="jumpPostL" x1="12" y1="0" x2="14" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#857058"/>
      <stop offset="0.45" stop-color="#6A5843"/>
      <stop offset="1" stop-color="#3A2B1E"/>
    </linearGradient>
    <!-- The tall post at the ramp's lip, catching light on its right. -->
    <linearGradient id="jumpPostR" x1="24" y1="0" x2="26" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C2C1F"/>
      <stop offset="0.5" stop-color="#5A4634"/>
      <stop offset="1" stop-color="#A28A62"/>
    </linearGradient>
    <!-- The tower's boards, pinkish tan, brightest at the left. -->
    <linearGradient id="jumpBoards" x1="14" y1="40" x2="24" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCAA88"/>
      <stop offset="0.5" stop-color="#BC8A70"/>
      <stop offset="1" stop-color="#A07660"/>
    </linearGradient>
    <!-- The snow on the deck, white along its lit top. -->
    <linearGradient id="jumpDeck" x1="0" y1="38" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D6CCBA"/>
      <stop offset="0.45" stop-color="#EEEEEE"/>
      <stop offset="1" stop-color="#DCDDDE"/>
    </linearGradient>
    <!-- The timbers of the trestle, lit tan along their upper faces. -->
    <linearGradient id="jumpBeam" x1="26" y1="0" x2="37" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6D8BE"/>
      <stop offset="0.5" stop-color="#D6B698"/>
      <stop offset="1" stop-color="#B49A80"/>
    </linearGradient>
    <!-- The snow on the ground, warming to tan in the tower's shadow. -->
    <linearGradient id="jumpGround" x1="6" y1="0" x2="22.5" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C5C5C3"/>
      <stop offset="0.4" stop-color="#D2DADA"/>
      <stop offset="0.65" stop-color="#C8BDB0"/>
      <stop offset="1" stop-color="#B0927A"/>
    </linearGradient>
    <!-- The jumper's magenta suit, lit at the upper left. -->
    <linearGradient id="jumpSuit" x1="12" y1="23.5" x2="18.5" y2="28.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4CFF"/>
      <stop offset="0.45" stop-color="#F612F6"/>
      <stop offset="1" stop-color="#A0008C"/>
    </linearGradient>
    <!-- The cyan trousers, bright on the near leg. -->
    <linearGradient id="jumpLegs" x1="15" y1="28" x2="20" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AF4FF"/>
      <stop offset="0.5" stop-color="#3EC4D6"/>
      <stop offset="1" stop-color="#1E7A84"/>
    </linearGradient>
    <!-- The blue helmet, with a sheen at the upper left. -->
    <radialGradient id="jumpHelmet" cx="12.7" cy="21.6" r="1.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A72F0"/>
      <stop offset="0.5" stop-color="#3129DE"/>
      <stop offset="1" stop-color="#232C96"/>
    </radialGradient>

    <g id="icon">
      <!-- The inrun, a long snowy curve sweeping down from the upper
           right and flattening out behind the trestle. -->
      <path d="M36,21.1 C36.6,20.9 37.3,21.2 37.6,21.8 L38,22.6 L38,38 L37,38.5 L37,45.5 L28.8,45.5 L28.8,41.3 C31.2,40.1 32.8,37.1 33.8,33.5 C34.7,30 35.5,25.3 36,21.1 Z" fill="url(#jumpSnow)"/>
      <!-- Its lit top edge and a gleam along the right. -->
      <path d="M36,21.1 C36.6,20.9 37.3,21.2 37.6,21.8 L36.9,22 C36.6,21.6 36.3,21.5 36,21.6 Z" fill="#C4B2A0"/>
      <path d="M37.3,22.4 L37.9,23 L37.9,37.6 L37.3,37.2 Z" fill="#E4E6E4" opacity="0.8"/>
      <!-- Distant timbers seen through the snow. -->
      <path d="M31.1,41.4 L32.2,41.2 L32.4,43.6 L31.2,43.8 Z" fill="#7A7268" opacity="0.7"/>

      <!-- The trestle under the inrun, dark timbers in shade. -->
      <path d="M25.6,40.4 L27.6,39.4 L29.6,41.8 L31.6,43 L33.4,43.6 L35.2,44 L36.7,44.6 L36.7,47.2 L25.6,47.2 Z" fill="#3A2C20"/>
      <!-- A cross brace between the trestle's posts, in shade. -->
      <path d="M27.6,46.6 L33,42.9 M28.4,42 L33,46.6" stroke="#5C4A38" stroke-width="0.8" fill="none"/>
      <!-- The trestle's posts, receding to the right, lit on their
           left faces. -->
      <path d="M26.3,40.6 L27.6,40.2 L27.6,47.2 L26.3,47.2 Z" fill="#BC9C7E"/>
      <path d="M29.2,41.4 L30.4,41.9 L30.4,47.2 L29.2,47.2 Z" fill="#9E826A"/>
      <path d="M32.9,43.2 L34,43.6 L34,47.2 L32.9,47.2 Z" fill="#C2A68A"/>
      <path d="M35.3,44 L36.4,44.4 L36.4,47.2 L35.3,47.2 Z" fill="#9C846C"/>
      <!-- Their right sides, in shadow. -->
      <path d="M27.6,40.2 L28.2,40.4 L28.2,47.2 L27.6,47.2 Z M30.4,41.9 L30.9,42.2 L30.9,47.2 L30.4,47.2 Z M34,43.6 L34.5,43.8 L34.5,47.2 L34,47.2 Z" fill="#241A12"/>
      <!-- The beam along the top, carrying the inrun down from the
           tower, its upper face catching the light. -->
      <path d="M25.6,40 L27.4,39.4 L31.4,41.8 L36.7,44 L36.7,45 L31.2,42.8 L27.4,40.5 L25.6,41.1 Z" fill="url(#jumpBeam)"/>
      <path d="M25.6,41.1 L27.4,40.5 L31.2,42.8 L36.7,45 L36.7,45.4 L31.1,43.2 L27.4,41 L25.6,41.6 Z" fill="#5A4636"/>

      <!-- The snow on the ground at the lower left. -->
      <path d="M5.6,48 C5.8,47.3 6.3,47 7,47 L22.4,47 L22.4,48 Z" fill="url(#jumpGround)"/>
      <!-- The dark footing along the bottom, sunk into the snow. -->
      <path d="M22,47 L36.2,47 L35.6,47.6 L35,48 L34.8,49 L34,50 L32,50 L31.6,49 L25,48.9 L25,48 L22,48 Z" fill="#2C2117"/>
      <path d="M25,48 L29,48 L29,48.9 L25,48.9 Z" fill="#6E665C"/>

      <!-- The tower's boards, with a dark X of braces across them. -->
      <path d="M14,40 L24,40 L24,47 L14,47 Z" fill="url(#jumpBoards)"/>
      <path d="M14.3,40.9 L23.7,46.9 M23.7,40.9 L14.3,46.9" stroke="#33261A" stroke-width="1.2" stroke-linecap="square" fill="none"/>
      <!-- A shadow under the deck. -->
      <path d="M14,40 L24,40 L24,40.6 L14,40.6 Z" fill="#8E7462" opacity="0.6"/>
      <!-- The deck on top, white with snow. -->
      <path d="M13.8,38 L24.2,38 L24.2,40 L13.8,40 Z" fill="url(#jumpDeck)"/>
      <!-- The tall post at the lip, with its rounded top. -->
      <path d="M24,34.6 C24,34.1 24.5,33.9 25,33.9 C25.5,33.9 26,34.1 26,34.6 L26,47 L24,47 Z" fill="url(#jumpPostR)"/>
      <path d="M24,34.6 C24,34.1 24.5,33.9 25,33.9 C25.5,33.9 26,34.1 26,34.6 L26,35 L24,35 Z" fill="#D6B884"/>
      <!-- The short post at the back of the tower. -->
      <path d="M12,36.6 C12,36.2 12.5,36 13,36 C13.5,36 14,36.2 14,36.6 L14,47 L12,47 Z" fill="url(#jumpPostL)"/>
      <path d="M12,36.6 C12,36.2 12.5,36 13,36 C13.5,36 14,36.2 14,36.6 L14,37 L12,37 Z" fill="#9A8064"/>

      <!-- The jumper in flight, skis spread in a V with the tails
           together.  The left ski reaches far out to the upper left,
           slim and dark grey, tapering toward the tail, its tip
           curled up. -->
      <path d="M7.5,27.2 L19.1,37.8 L19.7,37.2 L8.1,26.4 C7.8,26.1 7.6,25.9 7.3,25.8 C6.9,26.1 7,26.8 7.5,27.2 Z" fill="#3A3632"/>
      <!-- The thin light edge along its top. -->
      <path d="M7.4,25.9 C7.7,26 7.9,26.2 8.2,26.5 L19.6,37.1" stroke="#CDB98E" stroke-width="0.3" fill="none"/>
      <!-- The right ski, nearly upright, its tip curled to the left. -->
      <path d="M21.1,23.3 L22.9,37.6 L22.1,37.7 L20.1,23.5 C20,23.1 19.9,22.8 20,22.6 C20.4,22.4 21,22.7 21.1,23.3 Z" fill="#3A3632"/>
      <path d="M20.1,22.7 C20.2,23 20.3,23.3 20.3,23.6 L22.2,37.5" stroke="#C6B88E" stroke-width="0.3" fill="none"/>

      <!-- The far leg, darker, bending down to the right ski. -->
      <path d="M17,27.8 L19.2,27.8 C19.8,29.4 20.6,31.2 21.3,32.8 L19.7,33.3 C19.1,31.6 18,29.8 17,27.8 Z" fill="#1E7A84"/>
      <path d="M18.4,28.2 C19,29.8 19.8,31.4 20.5,33" stroke="#52F0FF" stroke-width="0.5" fill="none" opacity="0.8"/>
      <!-- The near leg, bright cyan, reaching down to the left ski. -->
      <path d="M14.8,27.9 L17.5,27.8 C17.8,29.5 18,31.4 17.9,33.4 L16.3,33.6 C16.3,31.6 15.6,29.6 14.8,27.9 Z" fill="url(#jumpLegs)"/>
      <path d="M17.6,28.4 C17.8,30 18,31.6 17.9,33.2" stroke="#0E3E44" stroke-width="0.4" fill="none"/>
      <!-- The boots, clipped to the skis. -->
      <ellipse cx="17.1" cy="34" rx="1" ry="0.65" transform="rotate(40 17.1 34)" fill="#1A1414"/>
      <ellipse cx="20.7" cy="33.5" rx="0.6" ry="0.9" transform="rotate(-10 20.7 33.5)" fill="#1A1414"/>

      <!-- The magenta suit, leaning far forward over the skis. -->
      <path d="M11.3,25.4 C11.2,24.2 12.4,23.5 13.8,23.3 C15.6,23 17.6,23.6 18.6,25 C19.1,25.8 19,27 18.4,27.9 L15,28.4 C13.6,28.3 12,27 11.3,25.4 Z" fill="url(#jumpSuit)"/>
      <!-- The lilac seat of the suit, where it meets the trousers. -->
      <path d="M13.6,27.4 C14.6,27.2 15.8,27.1 17,27.3 L16.8,28.3 L14.6,28.5 Z" fill="#B84CD8" opacity="0.7"/>
      <!-- Folds in the shaded back. -->
      <path d="M15.6,24.8 C16.4,25.2 17,25.8 17.4,26.8" stroke="#5A0052" stroke-width="0.5" fill="none" opacity="0.8"/>
      <!-- The arm hanging down in front, and the bare hand. -->
      <path d="M14,24.6 C13.3,25.4 12.8,26.3 12.6,27.2" stroke="#A2008E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <circle cx="12.5" cy="27.6" r="0.55" fill="#F6C5AC"/>
      <!-- The face and goggles, and the blue helmet. -->
      <ellipse cx="13.5" cy="24.2" rx="0.6" ry="0.7" fill="#EEAC6A"/>
      <path d="M12,23 C12.4,22.8 13.4,22.8 14,23 L13.9,23.8 C13.4,23.6 12.6,23.6 12.1,23.8 Z" fill="#5E6A22"/>
      <ellipse cx="13.1" cy="22.2" rx="1.25" ry="1.1" fill="url(#jumpHelmet)"/>
      <path d="M12.3,21.2 C12.6,21 13,20.9 13.3,21 C12.9,21.2 12.6,21.4 12.4,21.8 Z" fill="#C8B6A0" opacity="0.8"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
