<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Clear Trees tray button: vector remake of the original Ski Resort
       Tycoon sprites Tray_CutTrees_Normal/_Rollover/_Depress. One group
       per state; the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- The bar's steel, across its width (in the bar's own frame):
         bright along the lit upper-left edge, mid grey down the middle,
         darker toward the lower-right edge. -->
    <linearGradient id="barSteel" x1="0" y1="-2.4" x2="0" y2="2.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F6F6"/>
      <stop offset="0.3" stop-color="#B0B0B0"/>
      <stop offset="0.65" stop-color="#8E8E8E"/>
      <stop offset="1" stop-color="#7A7A7A"/>
    </linearGradient>
    <!-- The body's top face: pinkish red, lighter toward the top. -->
    <linearGradient id="bodyTop" x1="17" y1="29" x2="14" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0686A"/>
      <stop offset="0.3" stop-color="#E8525A"/>
      <stop offset="1" stop-color="#E6464E"/>
    </linearGradient>
    <!-- The body's front face: a bright, saturated red. -->
    <linearGradient id="bodyFront" x1="10" y1="38" x2="16" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E80010"/>
      <stop offset="1" stop-color="#CC0810"/>
    </linearGradient>
    <!-- The rear grip: near black, a little lighter at its edges. -->
    <linearGradient id="grip" x1="9" y1="42" x2="13" y2="48.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A3A36"/>
      <stop offset="0.45" stop-color="#0C0E0E"/>
      <stop offset="1" stop-color="#3C3E3A"/>
    </linearGradient>

    <g id="icon">
      <!-- The guide bar, running up and to the right from the body, with
           a dark rim (the chain) and a rounded tip. -->
      <g transform="translate(28.3,25) rotate(-53)">
        <rect x="-8" y="-2.4" width="16" height="4.8" rx="2.4" fill="url(#barSteel)" stroke="#2A2A2A" stroke-width="0.7"/>
        <!-- A bright line along the lit edge. -->
        <path d="M-6.6,-1.4 L6,-1.4" stroke="#FAFAFA" stroke-width="0.6" stroke-linecap="round"/>
      </g>

      <!-- The bail handle arching over the body's top, a dark tube with
           tan highlights on both sides. -->
      <path d="M14.3,30.2 C14.2,27.6 15.6,26.1 17.6,26 C19.6,25.9 21.2,26.7 22.6,28.4"
            fill="none" stroke="#C4A474" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M14.3,30.2 C14.2,27.6 15.6,26.1 17.6,26 C19.6,25.9 21.2,26.7 22.6,28.4"
            fill="none" stroke="#363636" stroke-width="1.1" stroke-linecap="round"/>

      <!-- The body's silhouette, edged in dark red. -->
      <path d="M8.8,36.3 L14.6,29.5 L16,28.9 L21.5,29 L23.2,30.2 L25.1,30.9 L24.9,37.7 L17.4,46.6 L15.6,46.6 L9.4,40.8 Z"
            fill="#E03038" stroke="#A42A22" stroke-width="0.7" stroke-linejoin="round"/>
      <!-- The top face. -->
      <path d="M8.9,36.3 L14.7,29.6 L16,29 L21.4,29.1 L22.5,32.6 L16.6,38.1 L9.4,37.1 Z" fill="url(#bodyTop)"/>
      <!-- A warm highlight along the top face's upper edge. -->
      <path d="M15.6,29.5 L20.6,29.5" stroke="#F59C84" stroke-width="0.8" stroke-linecap="round"/>
      <!-- The front face. -->
      <path d="M9.4,37.1 L16.6,38.1 L16.6,46.5 L15.6,46.5 L9.6,40.6 Z" fill="url(#bodyFront)"/>
      <!-- The shaded right side, darker beyond the chain guard. -->
      <path d="M25,31.2 L24.8,37.6 L18.4,45 L18.7,42.4 L21.2,35.2 Z" fill="#A00A0A"/>
      <!-- The chain guard: a pale cyan line down the right side. -->
      <path d="M24.9,31.2 L21.8,33.6 L20.4,37.5 L18.8,42.6" fill="none" stroke="#A8D8D4" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- A pink highlight along the edges between the top face and the
           two lower faces. -->
      <path d="M21.6,32.8 L16.6,38 L16.6,45.8 M16.6,38 L13.8,37.4" fill="none" stroke="#F8B8BC" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- The dark base of the front handle, where the bar meets the body. -->
      <path d="M22.4,30 L23.6,29.4 L23.6,32.2 L22.4,32.6 Z" fill="#1A1414"/>

      <!-- The air intake on the top face. -->
      <path d="M13.8,34.2 L16,32.6 L17.6,33.3 L15.4,34.9 Z" fill="#163834"/>
      <path d="M14.2,34.6 L15.4,34.9 L17.4,33.5" fill="none" stroke="#5A9494" stroke-width="0.5"/>
      <!-- The vent on the body's left corner. -->
      <path d="M10.6,36.4 L12.6,36.2 L13.2,38.6 L11.4,39.4 L10.4,38.2 Z" fill="#1C3834"/>
      <path d="M11.4,37.2 L12.2,38.4" stroke="#9A9494" stroke-width="0.6" stroke-linecap="round"/>

      <!-- The grey strip down the body's left edge, toward the grip. -->
      <path d="M9.9,38.4 L8.2,45.8" stroke="#6E8282" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M8.5,42.2 L8.3,43.5" stroke="#C5CDCD" stroke-width="0.6" stroke-linecap="round"/>
      <!-- The rear grip at the lower-left end. -->
      <path d="M8.2,41.8 L10.2,40.6 L15.1,45.2 L13.4,47.4 L11.4,48.9 L7.7,48.9 L7.7,45.6 Z" fill="url(#grip)"/>
      <!-- A tan trigger on the grip's top edge. -->
      <path d="M9.4,44 L10.6,44.6" stroke="#A47A5C" stroke-width="0.7" stroke-linecap="round"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
