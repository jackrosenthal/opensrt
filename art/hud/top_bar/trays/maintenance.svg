<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Safety and Maintenance tray button: vector remake of the original Ski Resort Tycoon
       sprites Tray_SafetyMaint_Normal/_Rollover/_Depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- The wrench's outline: an open-end head, its round jaws parted
         by a flat-sided slot, flowing through curved fillets into a
         tapering handle with a rounded tip. -->
    <path id="wrenchShape" d="M8.2,22.6 L10.6,23 A0.6,0.6 0 0 1 11.1,23.7 L10.6,26.4 A0.6,0.6 0 0 1 9.9,26.9 L7.5,26.4 A0.6,0.6 0 0 0 6.9,27.2 A5.2,5.2 0 0 0 13.4,30.1 A1.6,1.6 0 0 1 15,30.4 L31.5,44.7 A1.5,1.5 0 0 0 33.5,42.5 L17.3,27.8 A1.6,1.6 0 0 1 16.8,26.3 A5.2,5.2 0 0 0 7.9,21.7 A0.6,0.6 0 0 0 8.2,22.6 Z"/>
    <clipPath id="wrenchClip">
      <use href="#wrenchShape"/>
    </clipPath>
    <!-- Polished chrome on the head: bright at the upper left, a dark
         band through the middle, and a reflected glow at the lower
         right. -->
    <linearGradient id="wrenchHead" x1="8.4" y1="20.6" x2="16" y2="30.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.22" stop-color="#D2D2D2"/>
      <stop offset="0.46" stop-color="#8E8E8E"/>
      <stop offset="0.6" stop-color="#5E5E5E"/>
      <stop offset="0.8" stop-color="#B6B6B6"/>
      <stop offset="1" stop-color="#6E6E6E"/>
    </linearGradient>
    <!-- Chrome on the handle, banded along its length: a bright streak
         just above the middle, dark along both edges. -->
    <linearGradient id="wrenchShaft" x1="23.2" y1="33.2" x2="21" y2="35.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A5A5A"/>
      <stop offset="0.2" stop-color="#A8A8A8"/>
      <stop offset="0.38" stop-color="#F4F4F4"/>
      <stop offset="0.6" stop-color="#9C9C9C"/>
      <stop offset="0.85" stop-color="#6A6A6A"/>
      <stop offset="1" stop-color="#4A4A4A"/>
    </linearGradient>
    <!-- Fades the handle's chrome in past the neck, so it blends into
         the head's. -->
    <linearGradient id="neckFade" x1="15.2" y1="28.3" x2="17.3" y2="30.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="neckMask" maskUnits="userSpaceOnUse" x="0" y="0" width="41" height="55">
      <rect x="0" y="0" width="41" height="55" fill="url(#neckFade)"/>
    </mask>
    <!-- The radio's body, in its own upright frame: lit along the left
         edge, nearly black toward the right. -->
    <linearGradient id="radioBody" x1="-5.7" y1="0" x2="5.7" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A4A5A"/>
      <stop offset="0.3" stop-color="#181820"/>
      <stop offset="1" stop-color="#000008"/>
    </linearGradient>
    <!-- The speaker grille: black holes in a grey plate. -->
    <pattern id="grille" width="1.7" height="1.7" patternUnits="userSpaceOnUse">
      <rect width="1.7" height="1.7" fill="#6A6A7B"/>
      <circle cx="0.85" cy="0.85" r="0.55" fill="#000008"/>
    </pattern>
    <!-- A shade over the grille, lighter at the upper left. -->
    <linearGradient id="grilleShade" x1="-4.6" y1="-8.2" x2="4.6" y2="-0.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <!-- The radio's two buttons, domed: the left one lit, the right
         one a little in shade. -->
    <radialGradient id="buttonLit" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E6E6EE"/>
      <stop offset="1" stop-color="#9C9CA8"/>
    </radialGradient>
    <radialGradient id="buttonShade" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#E6E6EE"/>
      <stop offset="0.6" stop-color="#B4B4BD"/>
      <stop offset="1" stop-color="#73737F"/>
    </radialGradient>

    <g id="icon">
      <!-- The wrench, behind the radio, its jaws opening to the left
           and its handle running down to the lower right.  First the
           whole wrench in the head's chrome. -->
      <use href="#wrenchShape" fill="url(#wrenchHead)"/>
      <g clip-path="url(#wrenchClip)">
        <!-- The handle's own chrome, faded in past the neck. -->
        <path d="M13.8,30 L33.4,47.3 L36.6,43.7 L17,26.4 Z" fill="url(#wrenchShaft)" mask="url(#neckMask)"/>
        <!-- A soft shadow along the lower-right rim of the head. -->
        <path d="M16.3,26.8 A4.7,4.7 0 0 1 11.7,29.9 A4.7,4.7 0 0 1 8.4,28.5" fill="none" stroke="#3A3A3A" stroke-width="0.7" stroke-opacity="0.4" stroke-linecap="round"/>
        <!-- The flat faces of the slot: the lower jaw's face catches
             the light, the upper jaw's underside and the back are in
             shade. -->
        <path d="M7.3,26.5 L9.4,26.8" fill="none" stroke="#F4F4F4" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M8.8,22.7 L10.6,23 A0.6,0.6 0 0 1 11.1,23.7 L10.7,25.9" fill="none" stroke="#2E2E2E" stroke-width="1.2" stroke-opacity="0.75" stroke-linecap="round"/>
      </g>
      <!-- The crisp dark outline. -->
      <use href="#wrenchShape" fill="none" stroke="#262626" stroke-width="0.45" stroke-linejoin="round"/>
      <!-- A warm specular glint round the top of the head, from the tip
           of the upper jaw to the back. -->
      <path d="M8.9,21.6 A4.6,4.6 0 0 1 15.7,22.9" fill="none" stroke="#FFF1DC" stroke-width="0.6" stroke-linecap="round"/>
      <!-- The bright streak along the handle. -->
      <path d="M17.9,28.9 L31.9,41.6" fill="none" stroke="#FFFFFF" stroke-width="0.45" stroke-linecap="round" stroke-opacity="0.85"/>
      <!-- The hanging hole near the handle's tip, with a lit lower
           rim. -->
      <circle cx="31.5" cy="42.9" r="0.65" fill="#141414"/>
      <path d="M30.9,43.2 A0.65,0.65 0 0 0 32.1,43.3" fill="none" stroke="#E6E6E6" stroke-width="0.3"/>

      <!-- The walkie-talkie, tilted with its antenna to the upper right.
           Drawn upright around its center and rotated into place. -->
      <g transform="translate(18.3,37.9) rotate(36)">
        <!-- The antenna, a thin black rod with a rounded tip. -->
        <path d="M-0.7,-9 L-0.7,-23.8" stroke="#181820" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M-1.3,-11 L-1.3,-23.4" stroke="#6A6A73" stroke-width="0.4" stroke-linecap="round"/>
        <!-- The antenna's collar on top of the case. -->
        <rect x="-2.4" y="-12.4" width="3.4" height="3.6" rx="0.6" fill="#202029"/>
        <rect x="-2" y="-12" width="0.8" height="2.8" rx="0.3" fill="#E6E6EE"/>
        <!-- The case. -->
        <rect x="-5.7" y="-9.3" width="11.4" height="18.6" rx="1.4" fill="url(#radioBody)" stroke="#000008" stroke-width="0.4"/>
        <!-- Light along the left and top edges of the case. -->
        <path d="M-5.2,7.8 L-5.2,-7.9 Q-5.2,-8.8 -4.3,-8.8 L4.6,-8.8" fill="none" stroke="#E6E6EE" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- The speaker grille over the upper half. -->
        <rect x="-4.6" y="-8.2" width="9.2" height="7.6" rx="0.6" fill="url(#grille)"/>
        <rect x="-4.6" y="-8.2" width="9.2" height="7.6" rx="0.6" fill="url(#grilleShade)"/>
        <!-- A pale ridge below the grille. -->
        <path d="M-4.4,0.4 L4.2,0.4" stroke="#DEDEE6" stroke-width="0.6" stroke-linecap="round"/>
        <!-- The two white buttons on the lower half. -->
        <circle cx="-2.9" cy="4" r="1.15" fill="url(#buttonLit)" stroke="#000008" stroke-width="0.25"/>
        <circle cx="2.9" cy="3.7" r="1.15" fill="url(#buttonShade)" stroke="#000008" stroke-width="0.25"/>
        <circle cx="-3.25" cy="3.6" r="0.35" fill="#FFFFFF"/>
      </g>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
