<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Plant Medium tray button: vector remake of the original Ski Resort
       Tycoon sprites Tray_PlantNorm_Normal/_Rollover/_Depress. One group
       per state; the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- The pines' needles: bright where the light falls on the left,
         deep green in the middle, nearly black on the right. -->
    <linearGradient id="needles-l" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="26" y2="0">
      <stop offset="0" stop-color="#34AE48"/>
      <stop offset="0.45" stop-color="#1E6A2E"/>
      <stop offset="1" stop-color="#0E3A1A"/>
    </linearGradient>
    <linearGradient id="needles-r" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="35.5" y2="0">
      <stop offset="0" stop-color="#2E9A40"/>
      <stop offset="0.45" stop-color="#1C622C"/>
      <stop offset="1" stop-color="#0E3A1A"/>
    </linearGradient>
    <!-- The patches of ground: lit tan on top, dark earth below. -->
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C7A52"/>
      <stop offset="0.45" stop-color="#6A4C2C"/>
      <stop offset="1" stop-color="#3C2C1A"/>
    </linearGradient>

    <!-- The left pine's outline: a shaggy cone of branch tips. -->
    <path id="pine-l" d="M17,20.4 L18.2,22.4 L17.5,23.5 L19.4,25.2 L18.6,26.1 L20.4,27.6 L19.7,28.4 L21.6,29.8 L20.7,30.4 L22.4,31.6 L21.5,32.1 L23.2,33.2 L22.6,33.8 L24.6,35 L23.7,35.9 L25.4,37.4 L24.5,38.2 L26.2,39.6 L25,40.3 L26.4,41.6 L24,42.2 L21,42.6 L19,43.4 L16,42.8 L13.8,43.8 L12,42.8 L9.8,43.6 L7.8,42.2 L9.3,40.9 L8.2,40.2 L9.4,39 L8,38.4 L10.1,37.3 L9.6,36.8 L10.7,35.6 L9.2,35 L11.5,34 L11.2,33.6 L12.4,32 L11,31 L13.1,29.6 L12.6,28.8 L14.6,27.6 L14,27 L15.5,25.5 L14.4,24.6 L16.5,23.2 L16,22.5 Z"/>
    <!-- The right pine's outline, a little taller, its lower left hidden
         behind the left pine. -->
    <path id="pine-r" d="M28.7,19.6 L29.4,21.6 L29,22.2 L30.2,23.6 L29.5,24.2 L31.2,25.4 L30.9,26 L33,27.2 L31.9,27.9 L33.2,29.2 L32.4,29.8 L34,31 L33,31.7 L34.4,33 L33.5,33.7 L35,35 L34,35.7 L35.4,37 L34,37.7 L35,39 L34,39.5 L35.4,40.6 L33,41.4 L30,41 L27,41.6 L24.2,41.4 L25.4,39.4 L24.2,38 L25.4,36.4 L24.2,35.4 L25.7,34.1 L24.8,33.4 L25.9,32.1 L24.6,31.4 L26.2,30.1 L25.4,29.4 L26.8,28.1 L25.8,27.4 L27.5,26.2 L26.8,25.6 L28.3,24.2 L27.4,23.4 L28.4,22.2 L28.1,21.6 Z"/>
    <clipPath id="clip-l"><use href="#pine-l"/></clipPath>
    <clipPath id="clip-r"><use href="#pine-r"/></clipPath>

    <g id="icon">
      <!-- The right pine's patch of ground: a low lumpy mound, lit tan on
           top. -->
      <path d="M23.6,44.6 L24.4,43.4 L26.6,43 L28.4,42.6 L31.2,42.8 L33.6,43.6 L33.2,45 L30.6,45.6 L28.8,46.4 L26,46.2 L24.8,45.4 Z" fill="url(#earth)"/>
      <path d="M25,43.8 L26.6,43.3 L28.6,43 L31,43.2 L31.6,43.8 L29.6,44.2 L27.4,44 Z" fill="#BE9C70"/>
      <path d="M29.6,45 L31.6,44.6 L31,45.4 Z M25.8,45.2 L27.4,45 L27,45.8 Z" fill="#3C2A18"/>
      <!-- The right pine's trunk. -->
      <rect x="27.1" y="40.6" width="1.8" height="3.2" fill="#5A3E3E"/>
      <rect x="27.1" y="40.6" width="0.7" height="3.2" fill="#836252"/>

      <!-- The right pine. -->
      <use href="#pine-r" fill="url(#needles-r)"/>
      <g clip-path="url(#clip-r)">
        <!-- Dark clumps in the shade under the boughs. -->
        <path d="M29.8,24.8 L30.6,25.4 M29,27.8 L30.6,28.2 M31,30.4 L32.6,31.2 M28,32.6 L29.4,33 M31.4,34.8 L33.4,35.4 M27.2,36.8 L28.8,37.2 M30.4,37.4 L31.2,37.8 M31.2,38.8 L33.8,39.4 M26,40.4 L32,40.8 M29.6,35.6 L30.2,36.2"
              stroke="#0C3416" stroke-width="0.8" stroke-linecap="round"/>
        <!-- Lit needles down the left side. -->
        <path d="M28.2,22.8 L27.9,23.6 M27.6,25.6 L27.2,26.6 M27,28.8 L26.6,29.8 M26.6,32.4 L26.1,33.4 M26.4,35.8 L25.8,36.8 M25.9,39 L25.5,40"
              stroke="#3CBA50" stroke-width="1" stroke-linecap="round"/>
        <path d="M28.6,26.6 L28.9,27.2 M27.8,30.4 L28.2,31.2 M31.4,32.8 L31.8,33.4 M27.4,34.4 L27.8,35.2 M32,36.8 L32.4,37.4 M30.2,29 L30.6,29.6"
              stroke="#2A8A3A" stroke-width="0.8" stroke-linecap="round"/>
      </g>
      <!-- Pale tan tips where the light catches the right pine. -->
      <path d="M27.6,23.2 L27.8,22.6 M26.1,27.3 L26.4,26.6 M24.9,31.3 L25.2,30.6 M33,27.2 L32.6,26.6 M34.4,33 L34,32.4 M35.4,40.5 L35,39.9"
            stroke="#C4B87A" stroke-width="0.6" stroke-linecap="round"/>

      <!-- The left pine's patch of ground, larger and nearer. -->
      <path d="M10.8,46.8 L11.6,45.8 L13,45.2 L15,44.6 L17.6,44.8 L20,44.4 L23.6,44.6 L25,45.6 L24.2,46.6 L22,47.2 L20.6,48.8 L17,48.6 L12.6,48.8 L12.4,47.8 Z" fill="url(#earth)"/>
      <path d="M12.4,46 L14.2,45.2 L16,45 L16.8,45.8 L14.6,46.4 Z" fill="#9C7A52"/>
      <path d="M18.6,45 L20.2,44.7 L23.4,44.9 L23.8,45.5 L21.4,46 L19.4,45.8 Z" fill="#D6B07A"/>
      <path d="M20.2,45 H22.8 L22.4,45.5 H20.6 Z" fill="#E6BE84"/>
      <path d="M15.4,47.4 L17.4,46.8 L19,47.2 L17.6,47.8 Z M12.8,47.6 L14.2,47.2 L14.2,48 Z" fill="#3C2A18"/>
      <!-- The left pine's trunk. -->
      <rect x="16" y="42" width="1.9" height="3.4" fill="#4A3038"/>
      <rect x="16" y="42" width="0.7" height="3.4" fill="#6E4C48"/>

      <!-- The left pine, in front. -->
      <use href="#pine-l" fill="url(#needles-l)"/>
      <g clip-path="url(#clip-l)">
        <!-- Dark clumps in the shade under the boughs. -->
        <path d="M17.6,24.8 L18.2,25.2 M17,28 L18.8,28.4 M18,30.6 L19.8,31 M14.4,32.6 L15.6,33 M18.8,33.8 L21,34.2 M12.8,36.4 L14.4,36.8 M18.2,36.8 L19.6,37.2 M20.6,37.4 L22.6,37.8 M11,40 L13.4,40.6 M16.6,40 L19.4,40.4 M20.8,40.6 L24.4,41 M15,38.6 L16,39 M9.6,42.4 L24,42.4"
              stroke="#0A3014" stroke-width="0.8" stroke-linecap="round"/>
        <!-- The trunk glimpsed between the boughs. -->
        <rect x="16.4" y="36.4" width="1.2" height="1.6" fill="#5A3A48"/>
        <!-- Bright needles down the lit left side. -->
        <path d="M16.6,22.8 L16.3,23.6 M15.6,25.8 L15.1,26.8 M14.6,29 L14,30.2 M13.2,32.6 L12.6,33.6 M12.4,35.8 L11.6,37 M10.6,38.8 L10,39.6 M11.4,40.6 L10.6,41.6 M14,34.4 L13.6,35.2"
              stroke="#46D25A" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M16.8,26.8 L16.5,27.6 M16,30.4 L15.6,31.2 M16,34.6 L15.4,35.6 M13.4,38.4 L12.8,39.2 M15,41.2 L14.2,41.8 M12.6,30.8 L12.4,31.4"
              stroke="#2EA444" stroke-width="0.9" stroke-linecap="round"/>
      </g>
      <!-- Pale tan tips where the light catches the left pine. -->
      <path d="M14.5,24.7 L14.9,24.1 M12.7,28.9 L13.1,28.3 M11,31 L11.5,30.5 M9.2,35 L9.7,34.5 M8,38.4 L8.5,37.9 M7.8,42.2 L8.4,41.7 M20.4,27.6 L20,27 M22.4,31.6 L22,31 M26.2,39.6 L25.7,39"
            stroke="#C8B67A" stroke-width="0.6" stroke-linecap="round"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
