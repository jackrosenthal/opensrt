<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Smooth tray button: vector remake of the original Ski Resort Tycoon
       sprites Tray_Smooth_Normal/_Rollover/_Depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- The bumpy terrain's silver, pale at the top and dark grey along
         the bottom. -->
    <linearGradient id="roughSilver" x1="0" y1="25" x2="0" y2="34.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CDDEDE"/>
      <stop offset="0.55" stop-color="#A4B0B0"/>
      <stop offset="1" stop-color="#737B7B"/>
    </linearGradient>
    <!-- A dusky patch low on the right side of the tallest hump. -->
    <radialGradient id="roughDusk" cx="22" cy="33" r="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A6262" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5A6262" stop-opacity="0"/>
    </radialGradient>
    <!-- The low strip's silver, the same light but less deep. -->
    <linearGradient id="flatSilver" x1="0" y1="38" x2="0" y2="43.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5E6E6"/>
      <stop offset="0.5" stop-color="#ACBDBD"/>
      <stop offset="1" stop-color="#8B9C9C"/>
    </linearGradient>
    <!-- A soft edge for the snowy highlights. -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <!-- The outline of the bumpy terrain: three humps, the middle one
         tallest. -->
    <path id="roughShape" d="M7.5,34.5 V30.5 C7.8,28 9.8,25.3 12,25.3 C13.8,25.3 15,26.6 15.8,28 C16.3,25.8 18,23.3 20.6,23.3 C23,23.3 24,25.5 24.6,27.6 C25.3,26.7 26.6,26.2 28,26.2 C30.5,26.2 32.5,28.6 32.5,31 V34.5 Z"/>
    <!-- The outline of the low strip: two small humps and a flat run. -->
    <path id="flatShape" d="M7.5,43.5 V40.5 C7.5,39 8.5,38.2 10,38.2 H13 C14.3,38.2 14.8,39.4 15.8,39.4 C16.6,39.4 17,38.2 18.5,38.2 H23 C24.2,38.2 24.6,39.3 25.8,39.3 H30.5 C31.8,39.3 32.5,40 32.5,41 V43.5 Z"/>

    <g id="icon">
      <!-- The bumpy terrain. -->
      <use href="#roughShape" fill="url(#roughSilver)"/>
      <!-- Shadows in the two valleys between the humps. -->
      <path d="M15.8,28 C16.6,30 16.6,32 15.8,34 L13.6,34 C14.8,32 15.2,30 15.8,28 Z" fill="#6A7373" opacity="0.8" filter="url(#glow)"/>
      <path d="M24.6,27.6 C25.2,29.5 25,31.5 24,34 L26.4,34 C26.4,31.5 25.8,29.5 24.6,27.6 Z" fill="#5A6262" opacity="0.8" filter="url(#glow)"/>
      <rect x="16" y="28" width="12" height="6.5" fill="url(#roughDusk)"/>
      <!-- Snowy highlights on the upper left of each hump. -->
      <ellipse cx="11.2" cy="29.4" rx="2.3" ry="1.9" fill="#FFFFFF" filter="url(#glow)"/>
      <ellipse cx="18.9" cy="27.9" rx="2.6" ry="2.6" fill="#FFFFFF" filter="url(#glow)"/>
      <ellipse cx="27.6" cy="30.6" rx="2.1" ry="1.5" fill="#FFFFFF" filter="url(#glow)"/>
      <use href="#roughShape" fill="none" stroke="#525AF6" stroke-width="1" stroke-linejoin="round"/>

      <!-- The low strip. -->
      <use href="#flatShape" fill="url(#flatSilver)"/>
      <!-- Snowy highlights on its humps and flat run. -->
      <ellipse cx="11" cy="40.2" rx="1.8" ry="1.1" fill="#FFFFFF" filter="url(#glow)"/>
      <ellipse cx="19.6" cy="40.2" rx="2.3" ry="1.1" fill="#FFFFFF" filter="url(#glow)"/>
      <ellipse cx="28" cy="41" rx="1.7" ry="0.9" fill="#FFFFFF" filter="url(#glow)"/>
      <use href="#flatShape" fill="none" stroke="#525AF6" stroke-width="1" stroke-linejoin="round"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <!-- Pressed, the icon sits 1 px right and 1 px down. -->
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
