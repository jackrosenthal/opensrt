<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Objects tray button: vector remake of the original Ski Resort Tycoon
       sprites Tray_Objects_Normal/_Rollover/_Depress.  One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- A backrest slat's face: lit at the left, shaded in the middle,
         and catching the light again toward the right end. -->
    <linearGradient id="slat" x1="14" y1="0" x2="31" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C86A36"/>
      <stop offset="0.35" stop-color="#A4542A"/>
      <stop offset="0.7" stop-color="#D2763F"/>
      <stop offset="1" stop-color="#9C4E24"/>
    </linearGradient>
    <!-- A seat slat's top, lit at the near left end and darker toward
         the right, under the backrest's shadow. -->
    <linearGradient id="seat" x1="10" y1="37" x2="28" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C2622F"/>
      <stop offset="0.5" stop-color="#AE5A2A"/>
      <stop offset="1" stop-color="#8E461E"/>
    </linearGradient>
    <!-- The lit top edge of a slat. -->
    <linearGradient id="litEdge" x1="10" y1="0" x2="31" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8905A"/>
      <stop offset="0.6" stop-color="#E0844C"/>
      <stop offset="1" stop-color="#F0A06A"/>
    </linearGradient>
    <!-- The seat's front edge, pale tan where the light falls on it. -->
    <linearGradient id="edge" x1="10" y1="0" x2="24" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8865A"/>
      <stop offset="0.5" stop-color="#C49460"/>
      <stop offset="1" stop-color="#CE9C62"/>
    </linearGradient>
    <!-- Painted iron, lit along its upper left. -->
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E7480"/>
      <stop offset="0.45" stop-color="#26303A"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
    <!-- The lamp post: dark iron with a warm sheen down its right side. -->
    <linearGradient id="post" x1="24.9" y1="0" x2="27.1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26262C"/>
      <stop offset="0.45" stop-color="#34322F"/>
      <stop offset="0.75" stop-color="#7B6A52"/>
      <stop offset="1" stop-color="#4A4238"/>
    </linearGradient>
    <!-- A lantern's glass, glowing yellow at the bulb near its top and
         olive toward the frame.  In the lantern's own coordinates. -->
    <radialGradient id="glow" cx="0.1" cy="-3.6" r="2.4" fx="0.1" fy="-3.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFF70"/>
      <stop offset="0.2" stop-color="#E6E24E"/>
      <stop offset="0.45" stop-color="#8E8840"/>
      <stop offset="1" stop-color="#4A4A30"/>
    </radialGradient>
    <!-- A lantern's cap, lit tan on its left slope. -->
    <linearGradient id="cap" x1="-2" y1="0" x2="2" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E7C5C"/>
      <stop offset="0.35" stop-color="#4A4438"/>
      <stop offset="0.5" stop-color="#1C1C30"/>
      <stop offset="1" stop-color="#4A4A41"/>
    </linearGradient>

    <!-- One lantern, centered on x=0 and sitting on its arm at y=0: a
         pointed cap with a finial, a tall glass with bowed sides, and a
         short collar below. -->
    <g id="lantern">
      <!-- the dark frame around the glass -->
      <path d="M0,-5.6 C1.1,-5.3 2.1,-4.6 2.2,-3.5 C2.3,-2.2 1.6,-1.2 1,-0.6 L-1,-0.6 C-1.6,-1.2 -2.3,-2.2 -2.2,-3.5 C-2.1,-4.6 -1.1,-5.3 0,-5.6 Z" fill="#202030"/>
      <!-- the glass -->
      <path d="M0,-4.9 C0.9,-4.8 1.7,-4.3 1.8,-3.4 C1.9,-2.4 1.3,-1.6 0.7,-1.1 L-0.7,-1.1 C-1.3,-1.6 -1.9,-2.4 -1.8,-3.4 C-1.7,-4.3 -0.9,-4.8 0,-4.9 Z" fill="url(#glow)"/>
      <!-- the glass's upright frame bars, and a glint on the left pane -->
      <path d="M-0.9,-4.6 C-1.1,-3.4 -1,-2.2 -0.5,-1.1 M0.9,-4.6 C1.1,-3.4 1,-2.2 0.5,-1.1" fill="none" stroke="#3A3828" stroke-width="0.35" opacity="0.7"/>
      <path d="M-1.4,-4 C-1.6,-3.4 -1.5,-2.8 -1.2,-2.3" fill="none" stroke="#FFFFC8" stroke-width="0.35" stroke-linecap="round" opacity="0.8"/>
      <!-- the pointed cap -->
      <path d="M0,-7.1 C0.5,-6.5 1.4,-5.6 2,-4.7 C1.4,-5 0.7,-5.2 0,-5.2 C-0.7,-5.2 -1.4,-5 -2,-4.7 C-1.4,-5.6 -0.5,-6.5 0,-7.1 Z" fill="url(#cap)"/>
      <!-- the finial on top, catching the light -->
      <circle cx="0" cy="-7.2" r="0.35" fill="#83735A"/>
      <!-- the collar under the glass -->
      <path d="M-1.1,-0.7 L1.1,-0.7 L0.8,0.3 L-0.8,0.3 Z" fill="#2A2A30"/>
      <path d="M-1.1,-0.7 L-0.2,-0.7 L-0.3,0.3 L-0.8,0.3 Z" fill="#9C8664"/>
    </g>

    <g id="icon">
      <!-- The street lamp, standing behind the bench.  Its post: -->
      <rect x="24.9" y="25.6" width="2.2" height="8" fill="url(#post)"/>
      <!-- a ball on top of the post, between the lanterns -->
      <circle cx="26" cy="25.4" r="0.85" fill="#2E2E32"/>
      <circle cx="25.7" cy="25.1" r="0.35" fill="#BD9C73"/>
      <!-- The two arms, sweeping out and up from the post to the
           lanterns, with the light along their tops. -->
      <path d="M26,28.8 C24.4,28.8 22.8,28.4 22.6,27.2 M26,28.8 C27.6,28.8 29.2,28.4 29.4,27.2" fill="none" stroke="#2A2A2E" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M25.6,28.2 C24.4,28.2 23.4,27.9 23.1,27.2 M26.4,28.2 C27.6,28.2 28.6,27.9 28.9,27.2" fill="none" stroke="#B49C70" stroke-width="0.35" stroke-linecap="round"/>
      <!-- The two lanterns. -->
      <use href="#lantern" transform="translate(22.4,27.3)"/>
      <use href="#lantern" transform="translate(29.4,27.3)"/>

      <!-- The bench's far right end: the backrest's end post, seen from
           the side, with its lit top. -->
      <path d="M29.8,32.8 L31,33.1 L30.8,39 L29.6,38.8 Z" fill="#6E3A1E"/>
      <path d="M30.4,35.6 L31,35.7 L30.9,38 L30.3,37.9 Z" fill="#D2B47E"/>

      <!-- The backrest: a dark board behind three slats, so the gaps
           between them show as shadow. -->
      <path d="M15.0,31.0 C20.0,30.4 25.4,30.8 30.8,32.9 L30.0,38.8 C24.0,37.2 19.0,36.4 14.2,36.6 Z" fill="#4A200C"/>
      <path d="M15.0,31.0 C20.0,30.4 25.4,30.8 30.8,32.9 L30.6,34.7 C25.0,32.7 19.7,32.2 14.8,32.7 Z" fill="url(#slat)"/>
      <path d="M15.0,31.0 C20.0,30.4 25.4,30.8 30.8,32.9 L30.7,33.4 C25.3,31.3 19.9,30.9 14.9,31.4 Z" fill="url(#litEdge)"/>
      <path d="M14.8,32.3 C19.8,31.8 25.1,32.3 30.6,34.3 L30.6,34.7 C25.0,32.7 19.7,32.2 14.8,32.7 Z" fill="#6E3214" opacity="0.75"/>
      <path d="M14.7,33.0 C19.6,32.5 24.9,33.1 30.5,35.0 L30.3,36.6 C24.5,34.8 19.4,34.1 14.5,34.5 Z" fill="url(#slat)"/>
      <path d="M14.7,33.0 C19.6,32.5 24.9,33.1 30.5,35.0 L30.5,35.5 C24.8,33.6 19.6,33.0 14.7,33.4 Z" fill="url(#litEdge)"/>
      <path d="M14.6,34.1 C19.4,33.8 24.6,34.4 30.4,36.2 L30.3,36.6 C24.5,34.8 19.4,34.1 14.5,34.5 Z" fill="#6E3214" opacity="0.75"/>
      <path d="M14.5,34.8 C19.3,34.5 24.5,35.1 30.3,36.9 L30.1,38.1 C24.2,36.4 19.1,35.7 14.3,35.9 Z" fill="url(#slat)"/>
      <path d="M14.5,34.8 C19.3,34.5 24.5,35.1 30.3,36.9 L30.2,37.4 C24.3,35.6 19.2,34.9 14.4,35.2 Z" fill="url(#litEdge)"/>
      <path d="M14.3,35.6 C19.2,35.3 24.3,36.0 30.1,37.7 L30.1,38.1 C24.2,36.4 19.1,35.7 14.3,35.9 Z" fill="#6E3214" opacity="0.75"/>
      <!-- The left end of the top rail, its lit top. -->
      <path d="M15.0,31.0 C15.5,30.5 16.3,30.3 17.4,30.4 C17.8,30.5 18.0,30.6 18.1,30.8 C17.0,30.7 16.0,30.8 15.0,31.0 Z" fill="#D8AE78"/>
      <!-- A pale glint where the top rail turns toward the far end. -->
      <path d="M22.4,30.7 C23.6,30.7 24.4,30.8 25.0,30.9 L24.9,31.3 C24.1,31.2 23.3,31.1 22.4,31.1 Z" fill="#EBC48A"/>

      <!-- The seat: four slats running along the bench, over a dark
           board for the gaps, and the shadow under the backrest. -->
      <path d="M14.0,36.3 C19.0,36.5 24.0,37.5 28.8,39.0 L23.2,45.2 C18.4,42.6 14.0,40.2 10.0,38.0 Z" fill="#6A2E12"/>
      <path d="M13.6,36.5 C18.5,36.9 23.4,38.0 28.2,39.6 L27.1,40.9 C22.3,39.1 17.4,37.6 12.8,36.8 Z" fill="url(#seat)"/>
      <path d="M13.6,36.5 C18.5,36.9 23.4,38.0 28.2,39.6 L27.8,40.1 C23.0,38.4 18.1,37.1 13.3,36.6 Z" fill="url(#litEdge)"/>
      <path d="M13.0,36.7 C17.7,37.5 22.5,38.8 27.3,40.6 L27.1,40.9 C22.3,39.1 17.4,37.6 12.8,36.8 Z" fill="#6E3214" opacity="0.75"/>
      <path d="M12.6,36.9 C17.2,37.8 22.0,39.3 26.8,41.2 L25.7,42.5 C20.9,40.4 16.2,38.6 11.8,37.3 Z" fill="url(#seat)"/>
      <path d="M12.6,36.9 C17.2,37.8 22.0,39.3 26.8,41.2 L26.4,41.6 C21.6,39.6 16.9,38.1 12.3,37.0 Z" fill="url(#litEdge)"/>
      <path d="M12.0,37.2 C16.4,38.4 21.1,40.1 25.9,42.2 L25.7,42.5 C20.9,40.4 16.2,38.6 11.8,37.3 Z" fill="#6E3214" opacity="0.75"/>
      <path d="M11.6,37.3 C16.0,38.7 20.6,40.6 25.4,42.7 L24.3,44.0 C19.5,41.6 15.0,39.5 10.8,37.7 Z" fill="url(#seat)"/>
      <path d="M11.6,37.3 C16.0,38.7 20.6,40.6 25.4,42.7 L25.0,43.2 C20.2,40.9 15.7,39.0 11.3,37.4 Z" fill="url(#litEdge)"/>
      <path d="M11.0,37.6 C15.2,39.3 19.8,41.3 24.6,43.7 L24.3,44.0 C19.5,41.6 15.0,39.5 10.8,37.7 Z" fill="#6E3214" opacity="0.75"/>
      <path d="M10.6,37.7 C14.8,39.6 19.3,41.8 24.1,44.2 L23.2,45.2 C18.4,42.6 14.0,40.2 10.0,38.0 Z" fill="url(#seat)"/>
      <path d="M10.6,37.7 C14.8,39.6 19.3,41.8 24.1,44.2 L23.7,44.6 C18.9,42.1 14.4,39.9 10.4,37.8 Z" fill="url(#litEdge)"/>
      <path d="M10.2,37.9 C14.2,40.0 18.7,42.3 23.5,44.9 L23.2,45.2 C18.4,42.6 14.0,40.2 10.0,38.0 Z" fill="#6E3214" opacity="0.75"/>
      <!-- The front slat's edge, pale where the light falls on it. -->
      <path d="M10.0,38.0 C14.0,40.2 18.4,42.6 23.2,45.2 L23.4,46.1 C18.6,43.5 14.2,41.1 10.2,38.9 Z" fill="url(#edge)"/>
      <!-- The seat's near left corner, bright orange. -->
      <path d="M10,38 L11.4,37.4 L12,38.1 L10.4,38.9 Z" fill="#E0763A"/>

      <!-- The left end's iron frame.  The armrest, lit along its top and
           curling down at its front: -->
      <path d="M15,34 C13,34.1 10.8,34.4 9.6,34.9 C8.9,35.3 8.8,36.2 9.2,36.8 L10.2,36.8 C10,36.3 10.1,35.9 10.6,35.7 C11.8,35.4 13.4,35.2 15,35.1 Z" fill="url(#iron)"/>
      <path d="M15,34 C13,34.1 10.8,34.4 9.6,34.9 C9.3,35.1 9.1,35.4 9,35.7 C9.6,35.3 10.4,35.1 11.4,34.9 C12.6,34.7 13.8,34.6 15,34.5 Z" fill="#A49C83"/>
      <!-- the armrest's support down to the seat, and the front leg -->
      <path d="M10.8,35.6 L11.8,35.5 L11.8,37.6 L10.8,37.9 Z" fill="#2A323A"/>
      <path d="M10.2,39.2 L11.4,39.8 L11.5,42 L10.3,42 Z" fill="url(#iron)"/>
      <path d="M10.2,40.6 L10.7,40.8 L10.8,42 L10.3,42 Z" fill="#8B7B6A"/>

      <!-- The right end's iron frame: the armrest along the seat's end,
           lit blue-grey at its front ... -->
      <path d="M23,40.6 C24.6,39.7 27.2,39 30.3,38.6 L30.3,39.7 C27.4,40 25.4,40.6 24,41.4 Z" fill="#1E242C"/>
      <path d="M23,40.6 C24.6,39.7 27.2,39 30.3,38.6 L30.3,39 C27.4,39.4 25.2,40 23.6,40.9 Z" fill="#5A7484"/>
      <!-- ... the end of the seat's slats, showing between the legs ... -->
      <path d="M25.4,41 L28.6,40 L28.4,42.6 L25.4,43.6 Z" fill="#B45A28"/>
      <path d="M26,41.2 L28.2,40.5 L28.1,41.4 L26,42 Z" fill="#D86A2C"/>
      <path d="M25.4,43.6 L28.4,42.6 L28.4,43.1 L25.4,44.1 Z" fill="#52240E"/>
      <!-- ... the back leg ... -->
      <path d="M28.4,39.8 L29.6,39.6 L29.4,44.8 L28.4,44.8 Z" fill="url(#iron)"/>
      <path d="M29.2,42.8 L29.8,42.8 L29.7,44 L29.2,44 Z" fill="#CDB483"/>
      <!-- ... and the front leg, nearer to us, down to its foot. -->
      <path d="M24.2,40.8 L25.6,40.4 L24.4,47.8 L22.8,47.8 Z" fill="url(#iron)"/>
      <path d="M24.2,40.8 L24.8,40.6 L23.5,47.8 L22.8,47.8 Z" fill="#6A7B7B"/>
      <path d="M22.6,47.1 L24.6,47.1 L24.5,47.9 L22.5,47.9 Z" fill="#9C8362"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
