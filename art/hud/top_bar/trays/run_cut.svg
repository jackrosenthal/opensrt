<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Cut run tray button: vector remake of the original Ski Resort Tycoon
       sprites Tray_RunSub_Normal/_Rollover/_Depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- The cut's walls, dark at the top and lighter toward the bottom. -->
    <linearGradient id="run-cut-wall" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="0" y2="49">
      <stop offset="0" stop-color="#4A4A48"/>
      <stop offset="0.6" stop-color="#3C3C3C"/>
      <stop offset="1" stop-color="#4A4A48"/>
    </linearGradient>
    <!-- The run's packed snow, bright up top and greyer as it drops. -->
    <linearGradient id="run-cut-snow" gradientUnits="userSpaceOnUse" x1="0" y1="27" x2="0" y2="46">
      <stop offset="0" stop-color="#F6F8F4"/>
      <stop offset="0.45" stop-color="#ECECE8"/>
      <stop offset="0.75" stop-color="#D2D4D0"/>
      <stop offset="1" stop-color="#A8A8A4"/>
    </linearGradient>
    <!-- The rounded underside of the bottom curl. -->
    <linearGradient id="run-cut-belly" gradientUnits="userSpaceOnUse" x1="0" y1="45" x2="0" y2="49">
      <stop offset="0" stop-color="#9C9C98"/>
      <stop offset="0.5" stop-color="#6A6A66"/>
      <stop offset="1" stop-color="#404040"/>
    </linearGradient>
    <!-- The arrow, lit on its left face and shaded on its right. -->
    <linearGradient id="run-cut-arrow" gradientUnits="userSpaceOnUse" x1="16" y1="0" x2="24" y2="0">
      <stop offset="0" stop-color="#F65A52"/>
      <stop offset="0.3" stop-color="#F63A34"/>
      <stop offset="0.55" stop-color="#F41818"/>
      <stop offset="0.75" stop-color="#DC1010"/>
      <stop offset="1" stop-color="#B81C1C"/>
    </linearGradient>

    <g id="icon">
      <!-- The S-shaped cut through the terrain, with a tan rim where it
           meets the snow. -->
      <path d="M28,24 L32,23.8 Q35.5,25 35.4,27.5 Q35,29 32.5,29.5 L29,30 Q26.5,30.6 25.5,31.5 L24,33.5 Q27,33.8 30,35 Q33.6,37 33.8,40 Q33.6,42.5 31.6,43.5 Q27,46.5 20,48.5 Q15.5,50 12,49.2 Q8,48 8,45 Q8,42 10.5,40.8 Q13,39.5 16.5,39.3 L20.5,39.2 Q21.6,38 20.5,37 Q18,35.8 14.5,35.6 Q12,35 12,33 Q12.2,31 15,30 Q19.5,29.5 22.5,28.5 Q25.5,27.5 26.2,26 Q26.8,24.4 28,24 Z"
            fill="url(#run-cut-wall)" stroke="#D5BC94" stroke-width="0.5" stroke-opacity="0.7" stroke-linejoin="round"/>
      <!-- The underside of the bottom curl. -->
      <path d="M8.2,44 Q8,48 12,49 Q16,49.7 20.5,48.3 L24.5,46.8 L22,45.6 L12,45.6 Z" fill="url(#run-cut-belly)"/>
      <!-- The snow surface of the run, winding from the top-right curl
           down to the bottom-left one. -->
      <path d="M28.5,26.8 Q30.5,26.3 31.8,27.6 Q31.8,29.3 30,29.5 L27,30.3 Q25,30.8 24.6,31.8 L23.4,33.5 Q23.4,35.4 25,36.6 Q28,37.8 29.5,38.8 Q31.6,40.2 32.6,41.6 Q32.6,43 31,43.8 Q27,46.2 22.6,47.2 Q17,46.4 12,46 Q9.4,45.6 8.8,43.6 Q9.4,42.3 12,42.2 Q16,42.6 19.5,42.8 Q21.5,42.3 21.6,40.5 Q21.6,38 20.5,37.1 Q18,35.9 14.5,35.6 Q14.2,34 15,33 Q17,32.2 20,31.2 Q21.5,30.3 24,29.6 Q26.5,29 27.8,28 Z"
            fill="url(#run-cut-snow)"/>
      <!-- A bright patch where the bottom curl turns up toward the light. -->
      <ellipse cx="11.6" cy="43.8" rx="2.6" ry="1.5" fill="#F4F6F2"/>
      <!-- Deep shadows along the cut's far walls. -->
      <path d="M10.6,41.4 Q15,40.1 21.2,40.8" fill="none" stroke="#1C1C1C" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M26.5,36.2 Q30,37 31.8,39.6" fill="none" stroke="#222222" stroke-width="1" stroke-linecap="round"/>
      <path d="M28.5,25 Q32.5,25 33.8,27.8" fill="none" stroke="#202020" stroke-width="1" stroke-linecap="round"/>
      <path d="M13,32.6 Q14,31.2 17,30.8" fill="none" stroke="#303030" stroke-width="1" stroke-linecap="round"/>
      <path d="M20.8,46.6 L22.2,45.8" fill="none" stroke="#1C1C1C" stroke-width="1" stroke-linecap="round"/>

      <!-- The red arrow pointing down into the run. -->
      <path d="M18,20.2 L20.5,19 L22.4,19 L22.4,23 L24.6,22.9 L24.2,26 L22,29.8 L19.8,34 L17.8,31 L17,29.5 L17,28.2 L15,26.8 L15,26 L17,25.6 L17,21 Z"
            fill="url(#run-cut-arrow)" stroke-linejoin="round"/>
      <!-- A warm highlight on the arrow's top. -->
      <path d="M18.6,20.4 L20.6,19.3 L21.4,19.3 L19.4,20.8 Z" fill="#F29A6A" opacity="0.85"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
