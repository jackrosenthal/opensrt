<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Peak tray button: vector remake of the original Ski Resort Tycoon
       sprites Tray_SlopeSharp_Normal/_Rollover/_Depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- The arrow, bright at the left and deep red at the right. -->
    <linearGradient id="arrowRed" x1="16" y1="0" x2="25" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F65252"/>
      <stop offset="0.45" stop-color="#F62424"/>
      <stop offset="0.7" stop-color="#F20808"/>
      <stop offset="1" stop-color="#B40808"/>
    </linearGradient>
    <!-- The peak's silver body: white on the lit left face, darkening
         to gunmetal on the shaded right face. -->
    <linearGradient id="peakSilver" x1="16" y1="42" x2="25" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FFFF"/>
      <stop offset="0.35" stop-color="#F2FFFF"/>
      <stop offset="0.55" stop-color="#B4C2C2"/>
      <stop offset="0.75" stop-color="#7B8383"/>
      <stop offset="0.9" stop-color="#5A5A5A"/>
    </linearGradient>
    <!-- Light gathering toward the foot of the peak. -->
    <linearGradient id="peakFoot" x1="0" y1="38" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5E6E6" stop-opacity="0"/>
      <stop offset="1" stop-color="#D5E6E6" stop-opacity="0.45"/>
    </linearGradient>

    <g id="icon">
      <!-- The red arrow rising from the tip: a pointed head with its
           right barb higher than its long left one, seen a little from the side,
           over a short shaft. -->
      <path d="M20.5,22 L25,30 L23,30 L23,36 L18,36 L18,33 L16,33
               L16,30.5 Z" fill="url(#arrowRed)"/>
      <!-- The peak, with concave sides flaring out to its foot. -->
      <path d="M21.6,33.8 C18.2,38.1 13.6,42.2 8.5,43.8 L33.5,43.8
               C29.2,42.2 25.1,38.1 21.6,33.8 Z" fill="url(#peakSilver)"/>
      <path d="M21.6,33.8 C18.2,38.1 13.6,42.2 8.5,43.8 L33.5,43.8
               C29.2,42.2 25.1,38.1 21.6,33.8 Z" fill="url(#peakFoot)"/>
      <!-- The blue outline along both sides. -->
      <path d="M8.5,43.8 C14.5,42.6 19,39 21.6,33.8
               C25.1,38.1 29.2,42.2 33.5,43.8" fill="none" stroke="#5262DE" stroke-width="0.9" stroke-linejoin="round"/>
      <!-- The lavender foot along the bottom. -->
      <rect x="8" y="44" width="26" height="1" fill="#8B8BD5"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <!-- The icon sits 1 px right and down when pressed. -->
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
