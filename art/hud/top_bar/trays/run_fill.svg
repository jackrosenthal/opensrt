<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 55" width="41" height="55">
  <!-- Run fill tray button: vector remake of the original Ski Resort Tycoon
       sprites Tray_RunAdd_Normal/_Rollover/_Depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The tile, shared by every tray button: a piece of the tray's
         strip, with a pale band along the top and a grey one along the
         bottom, and a coloured face behind the icon. -->
    <g id="tile">
      <rect x="0" y="12" width="41" height="3" fill="#000000"/>
      <rect x="0" y="15" width="41" height="3" fill="#F6EEF6"/>
      <rect x="0" y="18" width="41" height="30" fill="#FFFFFF"/>
      <rect x="0" y="48" width="41" height="3" fill="#C5C5C5"/>
      <rect x="0" y="51" width="41" height="3" fill="#000000"/>
    </g>
    <rect id="face" x="3" y="19" width="35" height="29"/>

    <!-- The run's top surface, lit from the upper left. -->
    <linearGradient id="rf-top" gradientUnits="userSpaceOnUse" x1="11" y1="30" x2="34" y2="40">
      <stop offset="0" stop-color="#FAFAF6"/>
      <stop offset="0.35" stop-color="#E2E4E0"/>
      <stop offset="1" stop-color="#8E908C"/>
    </linearGradient>
    <!-- The cut sides of the run, darkest under the middle. -->
    <linearGradient id="rf-side" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="34" y2="0">
      <stop offset="0" stop-color="#7C7C76"/>
      <stop offset="0.2" stop-color="#5C5C58"/>
      <stop offset="0.45" stop-color="#1C1C1C"/>
      <stop offset="0.75" stop-color="#3A3A38"/>
      <stop offset="1" stop-color="#6A6A62"/>
    </linearGradient>
    <linearGradient id="rf-bend" gradientUnits="userSpaceOnUse" x1="12" y1="0" x2="20" y2="0">
      <stop offset="0" stop-color="#A8A8A0"/>
      <stop offset="0.45" stop-color="#262626"/>
      <stop offset="1" stop-color="#585858"/>
    </linearGradient>
    <!-- The rounded mounds at each end of the run. -->
    <radialGradient id="rf-dome-a" gradientUnits="userSpaceOnUse" cx="29.4" cy="25.9" r="4" fx="28.6" fy="24.9">
      <stop offset="0" stop-color="#F6F6F2"/>
      <stop offset="0.6" stop-color="#C4C4C0"/>
      <stop offset="0.85" stop-color="#7C7C7A"/>
      <stop offset="1" stop-color="#3A3A3A"/>
    </radialGradient>
    <radialGradient id="rf-dome-b" gradientUnits="userSpaceOnUse" cx="12.6" cy="42.5" r="5" fx="11.4" fy="41.4">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E4E4E0"/>
      <stop offset="1" stop-color="#707070"/>
    </radialGradient>
    <!-- The arrow, bright on its left flank and dark on its right. -->
    <linearGradient id="rf-arrow" gradientUnits="userSpaceOnUse" x1="15" y1="0" x2="23" y2="0">
      <stop offset="0" stop-color="#EE5A5A"/>
      <stop offset="0.3" stop-color="#F63A3A"/>
      <stop offset="0.6" stop-color="#F41414"/>
      <stop offset="1" stop-color="#BC0808"/>
    </linearGradient>

    <g id="icon">
      <!-- The cut side under the lower half of the run. -->
      <path d="M8.2,42.5 L8.2,46.4 C9,48 11,48.6 13.5,48.6 C16.8,48.6 19,48 21.2,47 C25,45.4 29,43.6 32,42.2 C33.4,41.4 33.9,40.4 33.9,38.6 L33.9,37 Z" fill="url(#rf-side)"/>
      <!-- The cut side under the upper arm, seen through the notch. -->
      <path d="M23.2,29.4 C26,28.6 28.2,28.8 30.4,29.6 L29.6,30.4 C27.2,30.8 25.4,31.2 23.4,31.8 Z" fill="#363636"/>
      <!-- The cut side under the left bend. -->
      <path d="M12.2,31.8 L12.6,34.6 C14.2,35.8 17,35.8 19.4,36.4 L19.2,33.6 Z" fill="url(#rf-bend)"/>
      <!-- The S-shaped top surface of the run. -->
      <path d="M30,23.2 C27,23.4 24,25 21,26.3 C17,27.6 14.6,28.2 13.2,29 C11.8,29.8 11.7,31.8 12.6,32.6 C14.5,33 16.6,33 17.8,33.6 C19,34.4 19.4,36 18.6,37.2 C17.4,38.4 14,38.6 11.6,38.9 C9,39.4 7.8,41.4 8.3,43.2 C8.8,45.2 11,46 13.6,45.6 C16,45.2 17.6,43.4 20,42.2 C23,41.2 28,41 31,40.6 C33.2,40.2 33.8,38.6 33.8,37 C33.8,34.8 32.6,33 30,32 C27.6,31.2 25,31.4 23.4,31.2 L23.4,29.6 C25,28.8 27.4,28.6 30,29.6 C32,30 34,28.4 33.9,26.3 C33.8,24.2 32,23.2 30,23.2 Z" fill="url(#rf-top)"/>
      <!-- A shaded crease where the lower mound meets the middle sweep. -->
      <path d="M16.4,39.6 C18,40.4 18.8,41.6 19.2,43 L17.4,44.2 C17.2,42.4 16.8,41 15.6,39.8 Z" fill="#6A6A66" opacity="0.8"/>
      <!-- The mound at the top end of the run. -->
      <circle cx="29.8" cy="26.3" r="3.4" fill="url(#rf-dome-a)"/>
      <!-- The mound at the bottom end of the run. -->
      <ellipse cx="12.6" cy="42.4" rx="4.6" ry="3.5" fill="url(#rf-dome-b)"/>

      <!-- The arrow's shaft. -->
      <path d="M16.8,26 L21.6,26 L21.6,30.6 C20.4,31.6 18,31.8 16.8,31.2 Z" fill="url(#rf-arrow)"/>
      <!-- The arrow's head, a cone pointing up. -->
      <path d="M19.6,17.8 L23.4,25.4 C22.4,27.4 18.4,28.8 14.8,28.6 Z" fill="url(#rf-arrow)"/>
      <!-- A highlight down the arrow's lit flank. -->
      <path d="M19.4,19.2 L17.2,26.8 L18.4,26.6 Z" fill="#FF7070" opacity="0.6"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#tile"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#FFFF73"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#tile"/>
    <use href="#face" fill="#C5C5C5"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
