<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Stop button's picture: vector remake of the original Ski Resort
       Tycoon sprites stop_normal/_rollover/_depress, drawn over the round
       button frame on a radio tower's music tab.  A bright red square
       block, bevelled, shadowed in tan below.  The same in every
       state. -->
  <defs>
    <rect id="block" x="9.4" y="9.4" width="15.4" height="15.4" rx="1.6"/>
    <linearGradient id="face" x1="11" y1="11" x2="22" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A6A"/>
      <stop offset="0.5" stop-color="#FF2A24"/>
      <stop offset="1" stop-color="#FF0404"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <!-- a tan shadow down and to the right -->
  <use href="#block" transform="translate(0.9,1.1)" fill="#A08860" fill-opacity="0.8" filter="url(#soft)"/>
  <use href="#block" fill="#E00A08" stroke="#A01010" stroke-width="0.5"/>
  <!-- the raised face: a dark bevel round it, lit at its top left -->
  <rect x="11.2" y="11.2" width="11.8" height="11.8" rx="0.8" fill="url(#face)" stroke="#C80808" stroke-width="0.6"/>
  <path d="M10.4,22 V11.6 C10.4,10.9 10.9,10.4 11.6,10.4 H22" fill="none" stroke="#FF9C9C" stroke-width="0.7" stroke-linecap="round" filter="url(#soft)"/>
</svg>
