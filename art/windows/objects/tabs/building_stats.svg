<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Building stats tab's picture: vector remake of the original Ski
       Resort Tycoon sprites Tab_BuildingStats_Normal/_Depress, drawn over
       the window icon tab frame.  A log cabin in front of a bar chart of
       blue, green, red and yellow bars.  Shown as it is on the tab in
       front (normal) and dimmed on a tab behind (depress). -->
  <defs>
    <filter id="dim" x="0" y="0" width="45" height="34" filterUnits="userSpaceOnUse">
      <feColorMatrix type="matrix" values="0.6 0 0 0 0  0 0.6 0 0 0  0 0 0.6 0 0  0 0 0 1 0"/>
    </filter>
    <linearGradient id="leftWall" x1="11" y1="0" x2="24" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0A050"/>
      <stop offset="1" stop-color="#B87430"/>
    </linearGradient>
    <linearGradient id="rightWall" x1="24" y1="0" x2="35" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C88438"/>
      <stop offset="1" stop-color="#9C6024"/>
    </linearGradient>
    <linearGradient id="roof" x1="12" y1="6" x2="28" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#84746A"/>
      <stop offset="1" stop-color="#54443C"/>
    </linearGradient>
    <g id="window">
      <rect x="-1.2" y="-2" width="2.4" height="4" fill="#F0F0F0" stroke="#4A3A2A" stroke-width="0.35"/>
      <rect x="-0.6" y="-1.4" width="1.2" height="2.8" fill="#4A6080"/>
    </g>
    <g id="picture">
      <rect x="11" y="5.2" width="5.4" height="25.2" fill="#2020E0" stroke="#08087C" stroke-width="0.5"/>
      <rect x="11.6" y="5.8" width="1.89" height="24.0" fill="#8C8CFF" fill-opacity="0.7"/>
      <rect x="14.89" y="5.5" width="1.21" height="24.599999999999998" fill="#08087C" fill-opacity="0.6"/>
      <g transform="translate(5.7,3.1) scale(0.72)">
        <path d="M11,12.8 L25.2,19.8 V30.2 L11,23.2 Z" fill="url(#leftWall)" stroke="#5A3414" stroke-width="0.5" stroke-linejoin="round"/>
        <path d="M25.2,19.8 L35,14.4 V23.4 L25.2,30.2 Z" fill="url(#rightWall)" stroke="#5A3414" stroke-width="0.5" stroke-linejoin="round"/>
        <path d="M11,17.4 L25.2,24.4 M11,20.2 L25.2,27.2 M25.2,24.4 L35,18.6 M25.2,27.2 L35,21.2" fill="none" stroke="#7A4818" stroke-width="0.4" stroke-opacity="0.8"/>
        <path d="M16.4,17.6 L19.4,19.1 V26.2 L16.4,24.7 Z" fill="#C02424" stroke="#5A1010" stroke-width="0.4"/>
        <use href="#window" transform="matrix(1,0.5,0,1,13.4,18.4)"/>
        <use href="#window" transform="matrix(1,0.5,0,1,22.4,23.2)"/>
        <use href="#window" transform="matrix(1,-0.55,0,1,28.6,21.8)"/>
        <use href="#window" transform="matrix(1,-0.55,0,1,32.4,19.6)"/>
        <path d="M8.8,13 L18.6,3.8 L27.6,8.6 L25.6,20.2 Z" fill="url(#roof)" stroke="#3A2C24" stroke-width="0.5" stroke-linejoin="round"/>
        <path d="M25.6,20.2 L27.6,8.6 L36.4,14.2 L35.6,15.4 Z" fill="#4E4038" stroke="#3A2C24" stroke-width="0.5" stroke-linejoin="round"/>
        <path d="M11.4,12.4 L25.9,18.4 M14,9.9 L26.3,15.4 M16.4,7.5 L26.8,12.6 M27,12.4 L35,16 M27.4,10.4 L33.6,14.2" fill="none" stroke="#3E302A" stroke-width="0.4" stroke-opacity="0.7"/>
        <path d="M22.4,6.4 V3.2 L24,2.6 L25.8,3.4 V7.4 Z" fill="#B4946C" stroke="#4A3A2A" stroke-width="0.4" stroke-linejoin="round"/>
        <path d="M22.4,3.2 L24.1,4 L25.8,3.4" fill="none" stroke="#4A3A2A" stroke-width="0.3"/>
      </g>
      <rect x="17" y="24" width="5.4" height="6.4" fill="#18D018" stroke="#086C08" stroke-width="0.5"/>
      <rect x="17.6" y="24.6" width="1.89" height="5.2" fill="#9CFF9C" fill-opacity="0.7"/>
      <rect x="20.89" y="24.3" width="1.21" height="5.800000000000001" fill="#086C08" fill-opacity="0.6"/>
      <rect x="23.6" y="24" width="5.4" height="6.4" fill="#D01818" stroke="#700808" stroke-width="0.5"/>
      <rect x="24.200000000000003" y="24.6" width="1.89" height="5.2" fill="#FF8C8C" fill-opacity="0.7"/>
      <rect x="27.49" y="24.3" width="1.21" height="5.800000000000001" fill="#700808" fill-opacity="0.6"/>
      <rect x="30" y="25.6" width="3.8" height="4.8" fill="#F0E000" stroke="#807000" stroke-width="0.5"/>
      <rect x="30.6" y="26.200000000000003" width="1.33" height="3.5999999999999996" fill="#FFFFA0" fill-opacity="0.7"/>
      <rect x="32.74" y="25.900000000000002" width="0.76" height="4.2" fill="#807000" fill-opacity="0.6"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#picture"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#picture" filter="url(#dim)"/>
  </g>
</svg>
