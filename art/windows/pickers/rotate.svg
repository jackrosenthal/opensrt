<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Rotate button's picture: vector remake of the original Ski Resort
       Tycoon sprites SPU_Rotate_Rollover/_Depress (OBU_Rotate_* in the
       objects picker, the same art), drawn over the round button frame.
       A red arrow swinging round a flat ring, from a streaked tail at
       the top to its head at the bottom right: turn the model the
       picker shows.  The same in every state. -->
  <defs>
    <linearGradient id="red" x1="8" y1="9" x2="26" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A5A"/>
      <stop offset="0.45" stop-color="#EE1010"/>
      <stop offset="1" stop-color="#A40000"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <!-- The ring seen from above its rim, round from its tail to the
         head, and the head; the hole in the middle shows as a slit. -->
    <path id="arrow" d="M21,8 C14,7.4 6.8,9.4 6.6,15.6 C6.4,21.6 12,25 18.6,25 H22 V28 L28.6,21.6 L22,15.2 V18.8 H18.6 C14.4,18.9 12.2,18 12.3,16.9 C12.4,15.6 16,15.2 21,15.4 Z" stroke-linejoin="round"/>
    <clipPath id="arrowClip"><use href="#arrow"/></clipPath>
  </defs>
  <!-- a tan shadow down and to the right -->
  <use href="#arrow" transform="translate(0.9,1.1)" fill="#C89664" fill-opacity="0.8" filter="url(#soft)"/>
  <use href="#arrow" fill="url(#red)" stroke="#8C0000" stroke-width="0.6"/>
  <g clip-path="url(#arrowClip)">
    <!-- the inside of the ring, in shade above the slit -->
    <path d="M22,14.6 C15.4,14 11.2,15 11.4,17.4" fill="none" stroke="#7B0000" stroke-width="2.4" stroke-opacity="0.6" filter="url(#soft)"/>
    <!-- lit along the top of the rim -->
    <path d="M20.6,8.8 C14.6,8.4 8.6,10 7.6,14.6" fill="none" stroke="#FFB4B4" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.8" filter="url(#soft)"/>
  </g>
  <!-- the tail's streaks -->
  <path d="M22.6,8.4 V14.8 M24,8.8 V14.6 M25.2,9.4 V14.2" stroke="#C00000" stroke-width="0.8" stroke-linecap="round"/>
</svg>
