<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Build button's picture: vector remake of the original Ski Resort
       Tycoon sprites SPU_Build_Rollover/_Depress, drawn over the round
       button frame.  A claw hammer with a wooden handle crossed with a
       chisel with a green grip: build what the picker shows.  The same
       in every state. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="-1.6" x2="0" y2="1.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6B46A"/>
      <stop offset="0.5" stop-color="#B07830"/>
      <stop offset="1" stop-color="#6A4010"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="-2.3" x2="0" y2="2.3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CF67B"/>
      <stop offset="0.45" stop-color="#29C520"/>
      <stop offset="1" stop-color="#107310"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="-2.4" x2="0" y2="2.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#A4A4AC"/>
      <stop offset="1" stop-color="#4A4A52"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="-1.7" x2="0" y2="1.7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E6D5BD"/>
      <stop offset="1" stop-color="#9C7B52"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <!-- Each tool laid along the x axis, then turned into place. -->
    <g id="chisel" transform="translate(9.4,26.4) rotate(-45)">
      <rect x="0" y="-2.3" width="10" height="4.6" rx="2" fill="url(#grip)" stroke="#0A4A0A" stroke-width="0.5"/>
      <path d="M9.6,-1.5 H21.4 L23.2,-0.4 V0.4 L21.4,1.5 H9.6 Z" fill="url(#blade)" stroke="#6A4A20" stroke-width="0.5" stroke-linejoin="round"/>
    </g>
    <g id="hammer" transform="translate(26.6,25.6) rotate(-131)">
      <rect x="0" y="-1.6" width="17" height="3.2" rx="1.2" fill="url(#wood)" stroke="#4A2A08" stroke-width="0.5"/>
      <!-- the head, across the end of the handle: face one side, claw
           the other -->
      <g transform="translate(17,0) rotate(90)">
        <path d="M-7,-2.4 H3.6 C5.6,-2.4 6.6,-1.4 7.4,0.4 L6.4,0.6 C5.8,-0.2 5,-0.4 3.6,0.2 L3,2.4 H-4.6 L-5.2,1.6 H-7 Z" fill="url(#steel)" stroke="#29292E" stroke-width="0.5" stroke-linejoin="round"/>
      </g>
    </g>
  </defs>
  <!-- a tan shadow down and to the right -->
  <g transform="translate(0.9,1.1)" opacity="0.6" filter="url(#soft)">
    <use href="#chisel"/>
    <use href="#hammer"/>
  </g>
  <use href="#chisel"/>
  <use href="#hammer"/>
</svg>
