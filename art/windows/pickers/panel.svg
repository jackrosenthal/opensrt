<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300" width="250" height="300">
  <!-- Picker panel: vector remake of the original Ski Resort Tycoon
       sprites Structure_popup_Background and Lifts_popup_Background (the
       same art), the building and lift pickers' panel.  A black rimmed
       slab with rounded corners, sky blue at the top and foot and white
       across the middle, with three sunken white boxes for the previews
       (the right one squared off on its right) and the description box
       below them, two snowflakes pressed into its corner. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="4" x2="0" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0.03" stop-color="#94ACE6"/>
      <stop offset="0.12" stop-color="#A4B4E6"/>
      <stop offset="0.27" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E6EEFF"/>
      <stop offset="0.67" stop-color="#CDD5F6"/>
      <stop offset="0.84" stop-color="#ACBDEE"/>
      <stop offset="1" stop-color="#9CB4E6"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="241" y1="0" x2="246" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A5A6A" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A4A5A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="footShade" x1="0" y1="292" x2="0" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A5A84" stop-opacity="0"/>
      <stop offset="1" stop-color="#313952" stop-opacity="0.8"/>
    </linearGradient>
    <path id="inside" d="M15,4 H235 A11,11 0 0 1 246,15 V285 A11,11 0 0 1 235,296 H15 A11,11 0 0 1 4,285 V15 A11,11 0 0 1 15,4 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <!-- The boxes, on the lines of their black edges. -->
    <rect id="left" x="17.5" y="43.5" width="51" height="100" rx="7"/>
    <rect id="middle" x="78.5" y="43.5" width="93" height="100" rx="7"/>
    <path id="right" d="M189,43.5 H232 V143.5 H189 A7,7 0 0 1 182,136.5 V50.5 A7,7 0 0 1 189,43.5 Z"/>
    <rect id="text" x="16.5" y="189.5" width="151" height="100" rx="9"/>
    <g id="boxes">
      <use href="#left"/>
      <use href="#middle"/>
      <use href="#right"/>
      <use href="#text"/>
    </g>
    <clipPath id="boxClip">
      <use href="#left"/>
      <use href="#middle"/>
      <use href="#right"/>
      <use href="#text"/>
    </clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="flakeBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.05"/>
    </filter>
    <!-- A snowflake plate, radius 1: a hexagon, its six spokes and a
         pair of branches on each. -->
    <path id="arm" d="M0,0 V-1 M0,-0.5 L-0.3,-0.72 M0,-0.5 L0.3,-0.72"/>
    <g id="flake">
      <path d="M0,-1 L0.866,-0.5 L0.866,0.5 L0,1 L-0.866,0.5 L-0.866,-0.5 Z"/>
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
    </g>
  </defs>

  <!-- the rim and the slab -->
  <rect x="0.4" y="0.4" width="249.2" height="299.2" rx="15" fill="#000000"/>
  <use href="#inside" fill="url(#sky)"/>
  <g clip-path="url(#insideClip)">
    <!-- a pale line inside the rim at the top and left, and the shade
         down the right and along the foot -->
    <path d="M4.8,296 V15 A10.2,10.2 0 0 1 15,4.8 H246" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6"/>
    <rect x="241" y="0" width="5" height="300" fill="url(#rightShade)"/>
    <rect x="0" y="290" width="250" height="6" fill="url(#footShade)"/>
  </g>

  <!-- the boxes, sunk into the panel: shaded round their top and left
       outside, and along their bottom and right inside -->
  <use href="#boxes" transform="translate(-1.8,-1.6)" fill="none" stroke="#283040" stroke-opacity="0.7" stroke-width="3" filter="url(#soft)"/>
  <use href="#boxes" fill="#FFFFFF"/>
  <g clip-path="url(#boxClip)">
    <use href="#boxes" transform="translate(-2.6,-2.6)" fill="none" stroke="#9C9C9C" stroke-width="4" filter="url(#soft)"/>
  </g>

  <!-- two snowflakes in the description box's corner, pressed in -->
  <g fill="#ECECEC" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(111.5,275.5) scale(11)">
      <use href="#flake" transform="translate(-0.08,-0.08)" fill="none" stroke="#A8A8A8" stroke-width="0.14" filter="url(#flakeBlur)"/>
      <use href="#flake" stroke="#FFFFFF" stroke-width="0.1"/>
    </g>
    <g transform="translate(148.5,268.5) scale(14)">
      <use href="#flake" transform="translate(-0.07,-0.07)" fill="none" stroke="#A8A8A8" stroke-width="0.12" filter="url(#flakeBlur)"/>
      <use href="#flake" stroke="#FFFFFF" stroke-width="0.08"/>
    </g>
  </g>

  <use href="#boxes" fill="none" stroke="#000000" stroke-width="1.6"/>
</svg>
