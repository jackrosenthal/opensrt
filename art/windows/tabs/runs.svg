<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Runs tab's picture: vector remake of the original Ski Resort Tycoon
       sprites Tab_Runs_Normal/_Depress, drawn over the window icon tab
       frame.  A trail winding down between pine trees, past red gates (a
       run's window, and the attractions window's runs tab).  Shown as it
       is on the tab in front (normal) and dimmed on a tab behind
       (depress). -->
  <defs>
    <filter id="dim" x="0" y="0" width="45" height="34" filterUnits="userSpaceOnUse">
      <feColorMatrix type="matrix" values="0.6 0 0 0 0  0 0.6 0 0 0  0 0 0.6 0 0  0 0 0 1 0"/>
    </filter>
    <linearGradient id="snow" x1="10" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D4D8D8"/>
    </linearGradient>
    <g id="pine">
      <path d="M0,-6 L2.4,-2 H1.2 L3.4,1.6 H1.8 L4,5 H-4 L-1.8,1.6 H-3.4 L-1.2,-2 H-2.4 Z" fill="#1E8030" stroke="#0C4018" stroke-width="0.4" stroke-linejoin="round"/>
      <path d="M0,-5 L-1.8,-1.6 M0,-1.6 L-2.6,2 M0,2 L-3.2,4.8" fill="none" stroke="#5CC060" stroke-width="0.4"/>
      <rect x="-0.5" y="5" width="1" height="1.2" fill="#6A4020"/>
    </g>
    <g id="flag">
      <path d="M0,0 V4.6" stroke="#505050" stroke-width="0.5"/>
      <rect x="0.2" y="0" width="2.4" height="2.2" fill="#F01010" stroke="#800808" stroke-width="0.3"/>
    </g>
    <g id="picture">
      <!-- the trail winding down, its edges packed grey -->
      <path d="M12.6,4.6 C14,8.6 18.4,10.2 24,10.6 C31,11 36,12.2 35.6,15.4 C35.2,19.4 26.6,19.2 21.4,20.6 C16.6,21.8 13.2,24.4 12.8,29.6 L21.4,29.8 C21.8,26.8 24.2,25.4 28.2,24.2 C33.4,22.6 38.4,20.6 38.6,15.2 C38.8,9 31.6,7.4 25,6.8 C20.4,6.4 17.4,6 16.6,3.8 Z" fill="url(#snow)" stroke="#8C9090" stroke-width="0.7" stroke-linejoin="round"/>
      <path d="M14.6,5.2 C16.4,8.4 20,8.8 25,9.2 M35.2,18.6 C32,20.6 26,21 21.2,22.6 C17.6,23.8 15.8,26 15.4,29.4" fill="none" stroke="#B8BCBC" stroke-width="0.5"/>
      <!-- pines along it, and its gates -->
      <use href="#pine" transform="translate(18.4,9.6) scale(0.8)"/>
      <use href="#pine" transform="translate(22.6,7) scale(0.8)"/>
      <use href="#pine" transform="translate(14.2,15.8)"/>
      <use href="#pine" transform="translate(19.6,15.4)"/>
      <use href="#pine" transform="translate(30.6,23.6)"/>
      <use href="#pine" transform="translate(35.2,25.2)"/>
      <use href="#pine" transform="translate(26.8,27.4) scale(0.8)"/>
      <use href="#flag" transform="translate(12.6,6.4)"/>
      <use href="#flag" transform="translate(31.4,13.2)"/>
      <use href="#flag" transform="translate(16.6,22.2) scale(1.4)"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#picture"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#picture" filter="url(#dim)"/>
  </g>
</svg>
