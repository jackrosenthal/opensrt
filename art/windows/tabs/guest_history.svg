<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Guest history tab's picture: vector remake of the original Ski
       Resort Tycoon sprites Tab_GuestHistory_Normal/_Depress
       (Tab_GuestIndivid_Normal/_Depress in the guests window), drawn over
       the window icon tab frame.  A guest in a pink helmet and goggles
       thinking, a thought cloud with an exclamation mark rising behind
       her.  Shown as it is on the tab in front (normal) and dimmed on a
       tab behind (depress). -->
  <defs>
    <filter id="dim" x="0" y="0" width="45" height="34" filterUnits="userSpaceOnUse">
      <feColorMatrix type="matrix" values="0.6 0 0 0 0  0 0.6 0 0 0  0 0 0.6 0 0  0 0 0 1 0"/>
    </filter>
    <radialGradient id="skin" cx="-1" cy="15" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCC8A4"/>
      <stop offset="0.6" stop-color="#E8987A"/>
      <stop offset="1" stop-color="#B86448"/>
    </radialGradient>
    <radialGradient id="dome" cx="-3" cy="2" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="10.8" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFF90"/>
      <stop offset="1" stop-color="#9C9C00"/>
    </linearGradient>
    <g id="picture">
      <path d="M10.4,10.6 C8.4,9.6 8.8,6.2 11.4,6.4 C11.2,3.6 14.6,2.4 16.4,4.4 C18,2.2 21.6,2.6 22.2,5.2 C25,4.4 27,7.2 25.4,9.2 C27.4,10.6 26.6,14 24,13.8 C24.2,16.4 21,17.6 19.4,15.8 C18,18 14.4,17.6 14,15.2 C11.4,16 9.4,13.2 10.4,10.6 Z" fill="#F4F4F0" stroke="#6A6A60" stroke-width="0.6" stroke-linejoin="round"/>
      <path d="M11.4,11 C12.4,12 13.6,12.2 14.6,11.4 M20.4,12.4 C21.8,12.8 23,12.2 23.4,11" fill="none" stroke="#B4B4A8" stroke-width="0.5"/>
      <ellipse cx="15.2" cy="19.6" rx="1.8" ry="1.3" fill="#F4F4F0" stroke="#6A6A60" stroke-width="0.5"/>
      <ellipse cx="16.4" cy="22.6" rx="1.1" ry="0.8" fill="#F4F4F0" stroke="#6A6A60" stroke-width="0.5"/>
      <path d="M18.4,5.6 L17.6,11.2 L16.4,11 L16.6,5.4 Z" fill="#101010"/>
      <circle cx="16.8" cy="13.2" r="0.9" fill="#101010"/>
      <g transform="translate(27.4,9.6) scale(0.82)">
        <path d="M-9.8,11 C-11.4,15 -11.6,20 -9.6,24 L-6.6,22.4 C-7.8,19 -7.8,15 -7.2,11 Z M9.8,11 C11.4,15 11.6,20 9.6,24 L6.8,22.4 C8,19 8,15 7.4,11 Z" fill="#A87444" stroke="#5A3A1A" stroke-width="0.5"/>
        <path d="M-9.4,13 C-10,16 -10,19 -8.8,22 M9.4,13 C10,16 10,19 8.8,22" fill="none" stroke="#6A4420" stroke-width="0.5"/>
        <path d="M-8.4,10.6 C-8.6,17.4 -5.8,23.4 -2,25.2 C-0.7,25.7 0.8,25.7 2,25.2 C5.8,23.4 8.6,18 8.8,10.6 Z" fill="url(#skin)" stroke="#8A4C34" stroke-width="0.5"/>
        <path d="M-0.4,15.8 C-0.2,17.2 -1.4,18 -0.6,18.6 C0.2,19 1,18.8 1.6,18.4" fill="none" stroke="#A85A40" stroke-width="0.5" stroke-linecap="round"/>
        <path d="M-4.6,19.8 C-2.6,22.2 2.4,22.2 4.6,19.6 C2.6,20.6 -2.4,20.8 -4.6,19.8 Z" fill="#FFFFFF" stroke="#702818" stroke-width="0.6" stroke-linejoin="round"/>
        <path d="M-10,11 C-10.4,4.4 -6.6,0 -0.2,0 C6,0 10.4,4.4 10.2,11 Z" fill="#F060C8" stroke="#202040" stroke-width="0.5"/>
        <path d="M-10,11 C-10.4,4.4 -6.6,0 -0.2,0 C6,0 10.4,4.4 10.2,11 Z" fill="url(#dome)"/>
        <path d="M-8.2,4.4 C-4,2.4 4,2.4 8.4,4.4 M-9.6,7.6 C-4,5.6 4.6,5.6 9.8,7.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8"/>
        <rect x="-9.4" y="9.8" width="19" height="5.8" rx="2.6" fill="#101010"/>
        <g fill="url(#lens)">
          <ellipse cx="-3.8" cy="12.7" rx="3.3" ry="1.9"/>
          <ellipse cx="3.6" cy="12.7" rx="3.3" ry="1.9"/>
        </g>
        <path d="M-5.6,12 L-3.6,11.4 M1.8,12 L3.8,11.4" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round" stroke-opacity="0.9"/>
      </g>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#picture"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#picture" filter="url(#dim)"/>
  </g>
</svg>
