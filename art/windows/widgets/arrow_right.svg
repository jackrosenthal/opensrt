<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 28" width="37" height="28">
  <!-- Right arrow, the horizontal scroller's: vector remake of the
       original Ski Resort Tycoon sprites
       SPU_arrowR_Normal/_Rollover/_Depress.  One group per state; the
       game shows one with a stylesheet. -->
  <defs>
    <!-- The arrow: a triangle with a black rim, filled white, yellow
         when the pointer is over it and grey when pressed. -->
    <path id="arrow" d="M28.4,13 L9.4,5.6 L9.4,20.6 Z"/>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <!-- a soft dark edge round the rim -->
    <use id="halo" href="#arrow" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="3.6" stroke-linejoin="round" filter="url(#soft)"/>
    <use id="outline" href="#arrow" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  </defs>

  <g id="normal" class="state">
    <use href="#halo"/>
    <use href="#arrow" fill="#FFFFFF"/>
    <use href="#outline"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#halo"/>
    <use href="#arrow" fill="#FFF662"/>
    <use href="#outline"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#halo"/>
    <use href="#arrow" fill="#838383"/>
    <use href="#outline"/>
  </g>
</svg>
