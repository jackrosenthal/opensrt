<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 16" width="15" height="16">
  <!-- Blue scroll nub: vector remake of the original Ski Resort Tycoon
       sprite Scroll_Tab of the finances window.  A sky blue block with
       rounded corners, lit along its top and left and shaded along its
       right and foot. -->
  <defs>
    <rect id="block" x="0.4" y="0.4" width="14" height="15" rx="3"/>
    <clipPath id="blockClip"><use href="#block"/></clipPath>
  </defs>
  <use href="#block" fill="#4AACDE"/>
  <g clip-path="url(#blockClip)" fill="none">
    <use href="#block" transform="translate(1,1)" stroke="#94D5F6" stroke-width="1.2"/>
    <use href="#block" transform="translate(-1,-1)" stroke="#1052B4" stroke-width="1.2"/>
  </g>
</svg>
