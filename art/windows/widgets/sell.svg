<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Sell button's picture: vector remake of the original Ski Resort
       Tycoon sprites sell_normal/_rollover/_depress, drawn over the round
       button frame.  A gold dollar sign behind a rolled deed tied with a
       red ribbon.  The same in every state. -->
  <defs>
    <linearGradient id="gold" x1="9" y1="7" x2="26" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE040"/>
      <stop offset="0.5" stop-color="#FFF200"/>
      <stop offset="1" stop-color="#C8A800"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="-3" x2="0" y2="3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F6EEDC"/>
      <stop offset="1" stop-color="#B49C78"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <!-- the S of the dollar sign -->
    <path id="s" d="M24,11.6 C22.4,9.4 19.8,8.6 17,8.8 C12.6,9.2 10.4,11.8 10.8,14.8 C11.2,18 14.4,18.8 17.4,19.6 C20.6,20.4 22.4,21.4 22.2,23.8 C22,26.4 19,27.6 16.2,27.4 C13.6,27.2 11.6,26 10.4,24.2" fill="none" stroke-width="3.6" stroke-linecap="round"/>
  </defs>
  <!-- the dollar sign, with a dark edge -->
  <g transform="translate(0.8,0.8)">
    <use href="#s" stroke="#5A4800" stroke-opacity="0.6" filter="url(#soft)"/>
    <rect x="15.8" y="5.4" width="2.4" height="26.2" rx="1.2" fill="#5A4800" fill-opacity="0.6" filter="url(#soft)"/>
  </g>
  <use href="#s" stroke="#806A00"/>
  <path d="M17,6.6 V30.4" stroke="#806A00" stroke-width="2.4" stroke-linecap="round"/>
  <use href="#s" stroke="url(#gold)" stroke-width="2.6"/>
  <path d="M17,6.6 V30.4" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- the deed, rolled up, its end showing at the lower left -->
  <g transform="translate(8.4,26.2) rotate(-38)">
    <rect x="0" y="-3" width="23.4" height="6" rx="3" fill="url(#roll)" stroke="#8C7A5A" stroke-width="0.5"/>
    <ellipse cx="0.6" cy="0" rx="1.8" ry="3" fill="#B4A07C" stroke="#7A6448" stroke-width="0.5"/>
    <ellipse cx="0.6" cy="0" rx="0.8" ry="1.4" fill="none" stroke="#7A6448" stroke-width="0.4"/>
    <!-- the ribbon round its middle, its ends hanging -->
    <rect x="10.4" y="-3.1" width="2.2" height="6.2" fill="#D02828"/>
    <path d="M11.4,-3 L8.6,-6.4 L10.2,-6.6 L12,-3.4 L14.2,-6.2 L15.4,-5.4 L12.6,-2.8 Z" fill="#C02020" stroke="#801010" stroke-width="0.3"/>
  </g>
</svg>
