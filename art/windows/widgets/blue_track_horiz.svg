<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 157 22" width="157" height="22">
  <!-- Blue horizontal scroll track: vector remake of the original Ski
       Resort Tycoon sprite Scroll_Bar, the blue scroller's track in the
       finances window.  A teal groove sunk between sky blue rails. -->
  <rect x="0" y="0" width="157" height="1" fill="#9CD5F6"/>
  <rect x="0" y="1" width="157" height="1" fill="#4AB4E6"/>
  <rect x="0" y="2" width="157" height="1" fill="#185A52"/>
  <rect x="0" y="3" width="157" height="16" fill="#418B83"/>
  <rect x="0" y="19" width="157" height="1" fill="#62DECD"/>
  <rect x="0" y="20" width="157" height="1" fill="#4AB4E6"/>
  <rect x="0" y="21" width="157" height="1" fill="#2073CD"/>
</svg>
