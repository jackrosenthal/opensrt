<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 91 37" width="91" height="37">
  <!-- OK button: vector remake of the original Ski Resort Tycoon
       sprites OK_Normal, OK_Rollover, and OK_Depress of the credits
       screen (Bob's message box has the same art).  A black rimmed
       pill, white shading to grey at its foot, yellow under the pointer
       and grey, shaded under its rim, when pressed, with its label in
       black over a soft shadow.  One group per state; the game shows
       one with a stylesheet. -->
  <defs>
    <linearGradient id="white" x1="0" y1="3.5" x2="0" y2="33.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EAF0"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.74" stop-color="#FFFFFF"/>
      <stop offset="0.86" stop-color="#DCE0E4"/>
      <stop offset="1" stop-color="#BEC2CA"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="3.5" x2="0" y2="33.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAEA9A"/>
      <stop offset="0.3" stop-color="#FFF673"/>
      <stop offset="0.74" stop-color="#FFF673"/>
      <stop offset="0.86" stop-color="#DEDA70"/>
      <stop offset="1" stop-color="#C2C072"/>
    </linearGradient>
    <path id="face" d="M18.5,3.5 H72.5 A15,15 0 0 1 87.5,18.5 V18.5 A15,15 0 0 1 72.5,33.5 H18.5 A15,15 0 0 1 3.5,18.5 V18.5 A15,15 0 0 1 18.5,3.5 Z"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.26"/>
    </filter>
    <path id="label" d="M39.03 10C34.5 10 31 13.33 31 17.64C31 21.91 34.54 25.26 39.01 25.26C43.43 25.26 46.85 21.93 46.85 17.64C46.85 13.39 43.37 10 39.03 10ZM38.99 12.63C41.81 12.63 44.01 14.83 44.01 17.66C44.01 20.51 41.87 22.63 38.99 22.63C36.1 22.63 33.84 20.43 33.84 17.64C33.84 14.79 36.06 12.63 38.99 12.63ZM49.07 25H51.89V18.52L56.6 25H60L54.28 17.5L60 10.26H56.6L51.89 16.62V10.26H49.07Z"/>
  </defs>

  <g id="normal" class="state">
    <path d="M18.5,-0.4 H72.5 A18.9,18.9 0 0 1 91.4,18.5 V18.5 A18.9,18.9 0 0 1 72.5,37.4 H18.5 A18.9,18.9 0 0 1 -0.4,18.5 V18.5 A18.9,18.9 0 0 1 18.5,-0.4 Z" fill="#000000"/>
    <use href="#face" fill="url(#white)"/>
  </g>
  <g id="rollover" class="state" display="none">
    <path d="M18.5,-0.4 H72.5 A18.9,18.9 0 0 1 91.4,18.5 V18.5 A18.9,18.9 0 0 1 72.5,37.4 H18.5 A18.9,18.9 0 0 1 -0.4,18.5 V18.5 A18.9,18.9 0 0 1 18.5,-0.4 Z" fill="#000000"/>
    <use href="#face" fill="url(#yellow)"/>
  </g>
  <g id="depress" class="state" display="none">
    <path d="M18.5,-0.4 H72.5 A18.9,18.9 0 0 1 91.4,18.5 V18.5 A18.9,18.9 0 0 1 72.5,37.4 H18.5 A18.9,18.9 0 0 1 -0.4,18.5 V18.5 A18.9,18.9 0 0 1 18.5,-0.4 Z" fill="#000000"/>
    <use href="#face" fill="#BCC2C6"/>
    <g clip-path="url(#faceClip)">
      <use href="#face" transform="translate(-2.5,-3)" fill="none" stroke="#5A6068" stroke-width="5" filter="url(#soft)"/>
    </g>
  </g>
  <!-- the label, the same in every state -->
  <use href="#label" transform="translate(3,3.5)" fill="#4A4A50" fill-opacity="0.65" filter="url(#soft)"/>
  <use href="#label" fill="#000000"/>
</svg>
