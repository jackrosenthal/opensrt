<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 228" width="650" height="228">
  <!-- Assets panel: vector remake of the original Ski Resort Tycoon
       sprite assets_graph_background, the finances window's assets graph.  A
       wide window list panel (windows/widgets/list_panel.svg) with a grey plate for the
       highest assets under its caption, a sunken white box for the
       graph, and "Last 50 Days" under it, lettered in URW Gothic Demi
       outlines (the original's ITC Avant Garde style). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="223" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#DEDEFF"/>
      <stop offset="1" stop-color="#9CB0E6"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="642" y1="0" x2="646" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A4A5A" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A4A5A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="footShade" x1="0" y1="217" x2="0" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A5A84" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A5A84" stop-opacity="0.9"/>
    </linearGradient>
    <!-- a grey shade inside the foot of a box -->
    <linearGradient id="boxFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDBDBD" stop-opacity="0"/>
      <stop offset="1" stop-color="#BDBDBD"/>
    </linearGradient>
    <path id="inside" d="M4,0 H646 V210 A14,14 0 0 1 632,224 H18 A14,14 0 0 1 4,210 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- the rim, open along the top -->
  <path d="M0.8,0 H649.2 V210 A16.6,16.6 0 0 1 632.6,226.6 H17.4 A16.6,16.6 0 0 1 0.8,210 Z" fill="#000000"/>
  <use href="#inside" fill="url(#sky)"/>
  <g clip-path="url(#insideClip)">
    <!-- a pale band down the inside of the left rim, the bevels, and the
         shade along the foot -->
    <rect x="5" y="0" width="2" height="228" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="4" y="0" width="1" height="228" fill="#6A6A7B"/>
    <rect x="642" y="0" width="4" height="228" fill="url(#rightShade)"/>
    <rect x="0" y="217" width="650" height="7" fill="url(#footShade)"/>
  </g>
  <g fill="#BDB4BD">
    <rect x="17" y="13" width="91" height="18"/>
  </g>
  <defs>
    <rect id="box" x="117" y="14.5" width="510" height="180" rx="9"/>
    <clipPath id="boxClip"><use href="#box"/></clipPath>
  </defs>
  <use href="#box" transform="translate(-1.6,-1.2)" fill="none" stroke="#283040" stroke-opacity="0.8" stroke-width="3" filter="url(#soft)"/>
  <use href="#box" fill="#FFFFFF"/>
  <rect x="117" y="183" width="510" height="12" fill="url(#boxFoot)" clip-path="url(#boxClip)"/>
  <use href="#box" fill="none" stroke="#000000" stroke-width="1.6"/>
  <!-- the captions -->
