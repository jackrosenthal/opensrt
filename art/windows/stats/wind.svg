<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 62" width="62" height="62">
  <!-- Wind dial: vector remake of the original Ski Resort Tycoon sprites
       Wind_N, Wind_NE, Wind_E and the rest, drawn between the weather
       panel's gold compass letters.  A white dial in a gold ring, its
       dark needle (an arrowhead and a forked tail on a gold hub) pointing
       the wind's way.  One group per heading, n to nw clockwise; the
       game shows one with a stylesheet. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6DC7A"/>
      <stop offset="0.5" stop-color="#B4A441"/>
      <stop offset="1" stop-color="#736A31"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <!-- The needle, pointing north. -->
    <path id="needleShape" d="M31,6.4 L35.4,16 L32.8,15 V28 L33.2,31 L32.8,44.6 C35.6,46 37,48.6 36.6,55 H34.6 C34.4,52.4 33.2,51 31,51 C28.8,51 27.6,52.4 27.4,55 H25.4 C25,48.6 26.4,46 29.2,44.6 L28.8,31 L29.2,28 V15 L26.6,16 Z" stroke-linejoin="round"/>
    <g id="needle">
      <use href="#needleShape" transform="translate(0.8,1)" fill="#3A3A50" fill-opacity="0.35" filter="url(#soft)"/>
      <use href="#needleShape" fill="#4E4E4E" stroke="#1A1A20" stroke-width="0.7"/>
      <path d="M30,15.6 V29 M30,33 V44.4" stroke="#7A7A7A" stroke-width="0.7"/>
      <circle cx="31" cy="31" r="1.4" fill="#B4A441" stroke="#5A5020" stroke-width="0.3"/>
    </g>
  </defs>

  <!-- the dial in its ring, shaded inside along the top and left -->
  <circle cx="31" cy="31" r="28.8" fill="#FFFFFF"/>
  <circle cx="30.4" cy="30.2" r="27.4" fill="none" stroke="#9C9CA8" stroke-width="1.2" filter="url(#soft)"/>
  <circle cx="31" cy="31" r="29.4" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <circle cx="31" cy="31" r="27.9" fill="none" stroke="#3A3418" stroke-width="0.6"/>
  <circle cx="31" cy="31" r="30.7" fill="none" stroke="#5A5020" stroke-width="0.4"/>

  <g id="n" class="state">
    <use href="#needle"/>
  </g>
  <g id="ne" class="state" display="none">
    <use href="#needle" transform="rotate(45,31,31)"/>
  </g>
  <g id="e" class="state" display="none">
    <use href="#needle" transform="rotate(90,31,31)"/>
  </g>
  <g id="se" class="state" display="none">
    <use href="#needle" transform="rotate(135,31,31)"/>
  </g>
  <g id="s" class="state" display="none">
    <use href="#needle" transform="rotate(180,31,31)"/>
  </g>
  <g id="sw" class="state" display="none">
    <use href="#needle" transform="rotate(225,31,31)"/>
  </g>
  <g id="w" class="state" display="none">
    <use href="#needle" transform="rotate(270,31,31)"/>
  </g>
  <g id="nw" class="state" display="none">
    <use href="#needle" transform="rotate(315,31,31)"/>
  </g>
</svg>
