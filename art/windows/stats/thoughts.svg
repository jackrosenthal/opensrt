<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Show thoughts button's picture: vector remake of the original Ski
       Resort Tycoon sprites show_thoughts_normal/_rollover/_depress,
       drawn over the round button frame.  A guest in a pink helmet and
       yellow goggles, a thought cloud with an exclamation mark rising
       behind.  The same in every state. -->
  <defs>
    <radialGradient id="helmet" cx="21" cy="13" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD2FF"/>
      <stop offset="0.5" stop-color="#FF70F0"/>
      <stop offset="1" stop-color="#C02AB4"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6B494"/>
      <stop offset="1" stop-color="#E69A7A"/>
    </linearGradient>
  </defs>
  <!-- the thought cloud -->
  <path d="M9,21 C6.6,20 7,16.6 9,16.2 C7.6,13 10,10.6 12,11.4 C12,7.6 16,6.4 17.4,8.4 C19,6.2 22.6,7.2 22.4,10.4 C23.6,12 22.6,14.4 21,14.4 L16,22.6 C14,23.6 10.6,23.4 9,21 Z" fill="#FFFFFF" stroke="#8B8B7A" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M14.4,10.6 H16.6 L15.9,15.6 H15.1 Z" fill="#000000"/>
  <circle cx="15.5" cy="17.4" r="0.9" fill="#000000"/>
  <!-- the guest: hair, face, goggles and helmet -->
  <path d="M15.4,21.6 C14.6,26 16,29.4 18.6,30 H26.4 C29,29.4 30,26 29,21.6 Z" fill="#9C6A3A"/>
  <path d="M17,21 C16.6,26.4 18.4,29.8 22.2,29.8 C26,29.8 27.8,26.4 27.4,21 Z" fill="url(#skin)"/>
  <path d="M19.4,26.6 Q22.2,28 25,26.6" fill="none" stroke="#B45A4A" stroke-width="0.6" stroke-linecap="round"/>
  <rect x="16.4" y="19" width="12" height="3.6" rx="1.2" fill="#3A4A1A"/>
  <ellipse cx="19.6" cy="20.8" rx="2.2" ry="1.4" fill="#E6E64A"/>
  <ellipse cx="25.2" cy="20.8" rx="2.2" ry="1.4" fill="#E6E64A"/>
  <path d="M15.8,19.4 C15.8,14.4 18.6,11.8 22.4,11.8 C26.2,11.8 29,14.4 29,19.4 Z" fill="url(#helmet)" stroke="#8A1A7A" stroke-width="0.5" stroke-linejoin="round"/>
</svg>
