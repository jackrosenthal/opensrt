<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 91" width="650" height="91">
  <!-- Finances title tray: vector remake of the original Ski Resort
       Tycoon sprite Finances_tray_backgrnd, the top of the finances
       window.  The window title tray (windows/widgets/title_tray.svg) made as wide as the
       window: a black rimmed slab with rounded top corners, sky blue
       shading to white, two embossed snowflakes, and the rule the tabs
       stand on along its foot. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="4" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94ACE6"/>
      <stop offset="0.2" stop-color="#94ACE6"/>
      <stop offset="0.55" stop-color="#C5CDF6"/>
      <stop offset="1" stop-color="#F6F6FF"/>
    </linearGradient>
    <!-- shading down the inside of the right rim -->
    <linearGradient id="rightShade" x1="642" y1="0" x2="646" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A4A5A" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A4A5A" stop-opacity="0.9"/>
    </linearGradient>
    <path id="inside" d="M4,86 V18 A14,14 0 0 1 18,4 H632 A14,14 0 0 1 646,18 V86 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- A snowflake: six spokes, each with two pairs of side branches. -->
    <path id="arm" d="M0,0 V-11 M0,-6.6 L-3.8,-8.8 M0,-6.6 L3.8,-8.8 M0,-3.4 L-2.6,-4.9 M0,-3.4 L2.6,-4.9"/>
    <g id="flake" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
    </g>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <!-- frosted between the arms, softly shadowed, grey edged -->
    <g id="embossed">
      <circle r="10.6" fill="#B8C0DC" fill-opacity="0.5" filter="url(#drop)"/>
      <use href="#flake" transform="translate(0.8,1)" stroke="#5A6280" stroke-opacity="0.45" stroke-width="2.8" filter="url(#drop)"/>
      <use href="#flake" stroke="#A8ACC0" stroke-width="1.9" filter="url(#edge)"/>
      <use href="#flake" stroke="#FFFFFF" stroke-width="0.95"/>
    </g>
  </defs>

  <!-- the rim, open along the foot -->
  <path d="M0.8,91 V17 A16.2,16.2 0 0 1 17,0.8 H632.6 A16.2,16.2 0 0 1 649.2,17 V91 Z" fill="#000000"/>
  <use href="#inside" fill="url(#sky)"/>
  <g clip-path="url(#insideClip)">
    <!-- a pale lip along the top, and the rims' bevels -->
    <rect x="4" y="4.8" width="642" height="1.6" fill="#D2DCFA" filter="url(#soft)"/>
    <rect x="4" y="0" width="1" height="91" fill="#6A6A7B"/>
    <rect x="642" y="0" width="4" height="91" fill="url(#rightShade)"/>
    <use href="#embossed" transform="translate(597.4,66.4) scale(1.15)"/>
    <use href="#embossed" transform="translate(626.2,60.6) scale(0.92)"/>
  </g>
  <!-- the rule along the foot -->
  <rect x="4" y="86" width="642" height="1" fill="#DEDEDE"/>
  <rect x="4" y="87" width="642" height="1" fill="#181818"/>
  <rect x="4" y="88" width="642" height="1" fill="#5A5A5A"/>
  <rect x="4" y="89" width="642" height="2" fill="#FFFFFF"/>
</svg>
