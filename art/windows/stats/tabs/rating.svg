<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Rating tab's picture: vector remake of the original Ski Resort
       Tycoon sprites Tab_Ratings_Normal and Tab_Rating_Depress, drawn
       over the icon tab frame.  A gold star over a red line climbing a
       graph whose axes are dotted red.  Dimmed on the tabs behind
       (depress). -->
  <defs>
    <filter id="dim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.62 0 0 0 0  0 0.62 0 0 0  0 0 0.62 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <radialGradient id="gold" cx="21" cy="13" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFB0"/>
      <stop offset="0.45" stop-color="#FFFF60"/>
      <stop offset="1" stop-color="#D2C030"/>
    </radialGradient>
    <g id="pic">
      <!-- the axes, dotted red -->
      <path d="M12.4,6 V28.4 H35.4" fill="none" stroke="#4A3A20" stroke-width="0.9"/>
      <path d="M12.4,7.4 V27 M14.4,28.4 H35" fill="none" stroke="#FF2020" stroke-width="1.4" stroke-dasharray="1.4,1.9"/>
      <!-- the line, climbing to an arrowhead -->
      <path d="M13.6,24 L18.4,9.4 L23.6,22.4 L31.6,10" fill="none" stroke="#7A0808" stroke-width="2.6" stroke-linejoin="round" transform="translate(0.6,0.6)"/>
      <path d="M13.6,24 L18.4,9.4 L23.6,22.4 L31.6,10" fill="none" stroke="#FF2A1A" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M29,8.6 L34.4,5.6 L33.6,11.8 Z" fill="#FF2A1A" stroke="#7A0808" stroke-width="0.5" stroke-linejoin="round"/>
      <!-- the star -->
      <g transform="translate(24,17.6) scale(1.12) translate(-24,-16)">
        <path d="M24,7.2 L26.6,13.4 L33.4,14 L28.2,18.4 L29.8,25 L24,21.4 L18.2,25 L19.8,18.4 L14.6,14 L21.4,13.4 Z" transform="translate(0.9,1)" fill="#3A3010" fill-opacity="0.7" filter="url(#drop)"/>
        <path d="M24,7.2 L26.6,13.4 L33.4,14 L28.2,18.4 L29.8,25 L24,21.4 L18.2,25 L19.8,18.4 L14.6,14 L21.4,13.4 Z" fill="url(#gold)" stroke="#8B7A31" stroke-width="0.6" stroke-linejoin="round"/>
      </g>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#pic"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#pic" filter="url(#dim)"/>
  </g>
</svg>
