<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Statistics overview tab's picture: vector remake of the original
       Ski Resort Tycoon sprites Tab_StatOver_Normal/_Depress, the
       finances window's first tab, drawn over the icon tab frame.  A red
       and a cyan line zigzagging across a graph to arrowheads, its axes
       dotted red.  Dimmed on the tabs behind (depress). -->
  <defs>
    <filter id="dim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.62 0 0 0 0  0 0.62 0 0 0  0 0 0.62 0 0  0 0 0 1 0"/>
    </filter>
    <path id="red" d="M14,21 L18.2,9.4 L24,26 L31.4,9.4"/>
    <path id="cyan" d="M13.4,16.2 L16.6,20.6 L23,12.6 L29,21.2 L32.6,17"/>
    <g id="pic">
      <!-- the axes, dotted red -->
      <path d="M11.8,6 V28.4 H34.6" fill="none" stroke="#4A3A20" stroke-width="0.9"/>
      <path d="M11.8,7.4 V27 M13.8,28.4 H34.4" fill="none" stroke="#FF2020" stroke-width="1.4" stroke-dasharray="1.4,1.9"/>
      <!-- the red line, shadowed, to its arrowhead -->
      <use href="#red" transform="translate(0.7,0.7)" fill="none" stroke="#5A0808" stroke-width="2.6" stroke-linejoin="round"/>
      <use href="#red" fill="none" stroke="#FF2418" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M28.8,8.6 L33.4,5.6 L33.4,11.4 Z" fill="#FF2418" stroke="#5A0808" stroke-width="0.5" stroke-linejoin="round"/>
      <!-- the cyan line, over it, to its arrowhead -->
      <use href="#cyan" transform="translate(0.6,0.8)" fill="none" stroke="#103A4A" stroke-width="2.6" stroke-linejoin="round"/>
      <use href="#cyan" fill="none" stroke="#2AE6F6" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M31,14.6 L35,15.6 L33.4,19.4 Z" fill="#2AE6F6" stroke="#103A4A" stroke-width="0.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#pic"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#pic" filter="url(#dim)"/>
  </g>
</svg>
