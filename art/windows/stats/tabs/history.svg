<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- History tab's picture: vector remake of the original Ski Resort
       Tycoon sprites Tab_History_Normal/_Depress, the resort window's
       message history, drawn over the icon tab frame.  A wall calendar
       with its rings, a blue band, and a grid of days.  Dimmed on the
       tabs behind (depress). -->
  <defs>
    <filter id="dim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.62 0 0 0 0  0 0.62 0 0 0  0 0 0.62 0 0  0 0 0 1 0"/>
    </filter>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EEF6"/>
      <stop offset="1" stop-color="#A4ACB4"/>
    </linearGradient>
    <g id="calendar">
      <!-- the page, edged brown, its corner curling up -->
      <path d="M9.4,7.6 H36 V25 L33.4,29.6 H9.4 Z" fill="#FFFFFF" stroke="#7A5A3A" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M36,25 L33.4,29.6 L32.6,25.8 Z" fill="#C8A064" stroke="#5A3A20" stroke-width="0.4" stroke-linejoin="round"/>
      <rect x="10.4" y="11.4" width="25" height="2.6" fill="#1A3AD6"/>
      <rect x="10.4" y="11.4" width="25" height="0.8" fill="#8CA0FF"/>
      <rect x="10.4" y="15.6" width="25" height="13.6" fill="#5A6268"/>
      <path d="M12.4,16.4 h3.8 v2.6 h-3.8 Z M17.1,16.4 h3.8 v2.6 h-3.8 Z M21.8,16.4 h3.8 v2.6 h-3.8 Z M26.5,16.4 h3.8 v2.6 h-3.8 Z M31.2,16.4 h3.8 v2.6 h-3.8 Z M12.4,19.8 h3.8 v2.6 h-3.8 Z M17.1,19.8 h3.8 v2.6 h-3.8 Z M21.8,19.8 h3.8 v2.6 h-3.8 Z M26.5,19.8 h3.8 v2.6 h-3.8 Z M31.2,19.8 h3.8 v2.6 h-3.8 Z M12.4,23.2 h3.8 v2.6 h-3.8 Z M17.1,23.2 h3.8 v2.6 h-3.8 Z M21.8,23.2 h3.8 v2.6 h-3.8 Z M26.5,23.2 h3.8 v2.6 h-3.8 Z M31.2,23.2 h3.8 v2.6 h-3.8 Z M12.4,26.6 h3.8 v2.6 h-3.8 Z M17.1,26.6 h3.8 v2.6 h-3.8 Z M21.8,26.6 h3.8 v2.6 h-3.8 Z M26.5,26.6 h3.8 v2.6 h-3.8 Z M31.2,26.6 h3.8 v2.6 h-3.8 Z" fill="url(#cell)"/>
      <!-- the rings along its top -->
      <path d="M12.0,7.0 v1.6 M14.6,7.0 v1.6 M17.2,7.0 v1.6 M19.8,7.0 v1.6 M22.4,7.0 v1.6 M25.0,7.0 v1.6 M27.6,7.0 v1.6 M30.2,7.0 v1.6 M32.8,7.0 v1.6 M35.4,7.0 v1.6" stroke="#5A5A5A" stroke-width="1.2"/>
    </g>
    <g id="pic">
      <use href="#calendar"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#pic"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#pic" filter="url(#dim)"/>
  </g>
</svg>
