<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Admissions tab's picture: vector remake of the original Ski Resort
       Tycoon sprites Tab_Admissions_Normal/_Depress, drawn over the icon
       tab frame.  A blue lift ticket lettered "LIFT" over a snowy peak,
       on its wire, with a purple ticket behind it.  Dimmed on the tabs
       behind (depress). -->
  <defs>
    <filter id="dim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.62 0 0 0 0  0 0.62 0 0 0  0 0 0.62 0 0  0 0 0 1 0"/>
    </filter>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CDCFF"/>
      <stop offset="0.6" stop-color="#50B4F0"/>
      <stop offset="1" stop-color="#2A7AD0"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D2A0FF"/>
      <stop offset="1" stop-color="#7A2AE6"/>
    </linearGradient>
    <clipPath id="card"><rect x="16" y="8" width="17.4" height="18.4" rx="0.8"/></clipPath>
    <g id="pic">
      <!-- the ticket behind -->
      <g transform="rotate(-4,24.7,17.2)">
        <rect x="13.6" y="11" width="17.4" height="18.4" rx="0.8" fill="url(#purple)" stroke="#4A1A8A" stroke-width="0.5"/>
        <!-- the ticket -->
        <rect x="16" y="8" width="17.4" height="18.4" rx="0.8" fill="url(#blue)"/>
        <g clip-path="url(#card)">
          <!-- a snowy peak under the lettering -->
          <path d="M16,26.6 L22.4,18.6 L25.2,21.4 L28.4,17.8 L33.6,23.4 V26.6 Z" fill="#F6F6FA"/>
          <path d="M22.4,18.6 L23.6,22.6 L21.4,26.6 M28.4,17.8 L28,22 L30.4,26.6" fill="none" stroke="#9CA0AC" stroke-width="0.8"/>
          <rect x="16" y="25.2" width="17.4" height="1.4" fill="#7A2AE6"/>
        </g>
        <rect x="16" y="8" width="17.4" height="18.4" rx="0.8" fill="none" stroke="#1A4A9A" stroke-width="0.6"/>
        <!-- LIFT -->
        <path d="M18,10.4 V16.8 H20.4 M21.8,10.4 V16.8 M23.6,16.8 V10.4 H26 M23.6,13.4 H25.6 M26.8,10.4 H30.8 M28.8,10.4 V16.8" fill="none" stroke="#101018" stroke-width="1.3" stroke-linecap="square"/>
      </g>
      <!-- its wire -->
      <path d="M11.4,6.6 C13.4,6.8 15.2,7.6 17.2,9.8" fill="none" stroke="#303030" stroke-width="1.1" stroke-linecap="round"/>
      <circle cx="11.6" cy="6.6" r="0.8" fill="#C8A064"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#pic"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#pic" filter="url(#dim)"/>
  </g>
</svg>
