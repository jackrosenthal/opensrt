<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Resort overview tab's picture: vector remake of the original Ski
       Resort Tycoon sprites Tab_resortstat_normal/_depress, drawn over
       the icon tab frame.  A magnifying glass over a snow roofed log
       lodge between two shrubs.  Dimmed on the tabs behind (depress). -->
  <defs>
    <filter id="dim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.62 0 0 0 0  0 0.62 0 0 0  0 0 0.62 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <linearGradient id="logs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8641E"/>
      <stop offset="1" stop-color="#8A3A10"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0C8"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCDCE6"/>
    </linearGradient>
    <radialGradient id="lens" cx="18" cy="14" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F6DEC0"/>
      <stop offset="1" stop-color="#E6C08A"/>
    </radialGradient>
    <clipPath id="lensClip"><circle cx="20" cy="17.5" r="6.6"/></clipPath>
    <g id="pic">
      <!-- shrubs either side -->
      <path d="M8.4,25.8 C8,22.4 10,20.2 12.6,20.6 C14.6,21 15,24 14.2,25.8 Z" fill="#2E9A2E" stroke="#1A5A1A" stroke-width="0.4"/>
      <path d="M31.8,25.8 C31.6,22.8 33.4,21.4 35.4,21.8 C37.2,22.2 37.4,24.6 36.8,25.8 Z" fill="#2E9A2E" stroke="#1A5A1A" stroke-width="0.4"/>
      <!-- the lodge: its gable, the snowy roof, and the long log wall -->
      <path d="M11,26 V15 L17,8.6 L23,15 L33.6,13 V26 Z" fill="url(#logs)" stroke="#5A260A" stroke-width="0.5" stroke-linejoin="round"/>
      <g stroke="#E6A050" stroke-width="0.7">
        <path d="M27.6,17 H33.4 M27.6,19.6 H33.4 M27.6,22.2 H33.4 M27.6,24.8 H33.4"/>
      </g>
      <path d="M10.2,15.8 L16.6,6.4 Q17.4,5.2 18.4,6.2 L23.8,12.4 L33.6,10.8 L35,13.6 L23.4,16 L17,10 L12.2,16.6 Z" fill="url(#snow)" stroke="#9C9CA8" stroke-width="0.4" stroke-linejoin="round"/>
      <!-- the glass: its lens, magnifying the lodge, rim and handle -->
      <circle cx="20" cy="17.5" r="6.6" fill="url(#lens)"/>
      <g clip-path="url(#lensClip)">
        <path d="M12,22 L20,12 L28,20" fill="none" stroke="#C88A64" stroke-width="2" filter="url(#soft)"/>
        <rect x="13" y="20.2" width="5" height="1.6" fill="#FFE020"/>
        <circle cx="25" cy="13.4" r="2" fill="#6AF06A" filter="url(#soft)"/>
      </g>
      <path d="M25.4,22.4 L33.4,30.6" stroke="#101010" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M27.6,25.4 L32.6,30.4" stroke="#C0C0C8" stroke-width="0.8" stroke-linecap="round"/>
      <circle cx="20" cy="17.5" r="7" fill="none" stroke="#202020" stroke-width="1.6"/>
      <path d="M15.4,13.6 A6,6 0 0 1 20.4,11.6" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#pic"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#pic" filter="url(#dim)"/>
  </g>
</svg>
