<!-- "Too long" cursor (lift too long / not allowed): a vector remake of the original Ski Resort Tycoon TO_LONG sprite.  Hotspot at center. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="ring">
      <path fill-rule="evenodd" d="M15.5 0a15.5 15.5 0 1 0 0.001 0zM15.5 3a12.5 12.5 0 1 1 -0.001 0z"/>
    </clipPath>
    <clipPath id="inner">
      <circle cx="15.5" cy="15.5" r="13"/>
    </clipPath>
    <linearGradient id="spec" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="28" y2="28">
      <stop offset="0" stop-color="#ffbdbd"/>
      <stop offset="0.16" stop-color="#ffbdbd"/>
      <stop offset="0.36" stop-color="#ff0000" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#ff0000" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#ffbdbd"/>
      <stop offset="1" stop-color="#ffbdbd"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="13.75" y1="13.75" x2="16.75" y2="16.75">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.12" stop-color="#ff0000"/>
      <stop offset="0.26" stop-color="#ffbdbd"/>
      <stop offset="0.45" stop-color="#ff4a4a"/>
      <stop offset="0.6" stop-color="#ff0000"/>
      <stop offset="0.78" stop-color="#e60000"/>
      <stop offset="1" stop-color="#a4001a"/>
    </linearGradient>
    <clipPath id="bar-clip">
      <circle cx="15.5" cy="15.5" r="13.5"/>
    </clipPath>
  </defs>
  <!-- ghosted hourglass behind the sign -->
  <g clip-path="url(#inner)" fill="#ff0000" fill-opacity="0.035">
    <path d="M17.5 4.2C19.6 5.6 19.4 9.6 16.5 13.2C14.6 15.6 11.2 16.8 9.2 16.1C6.3 15.1 5.6 12 7.6 8.8C9.8 5.3 15 2.6 17.5 4.2Z"/>
    <path d="M20.6 16.6C22.4 18.4 22.1 22.6 19.9 25.4C17.9 27.9 14 28.6 11.6 27C9.4 25.5 9.6 22.2 11.9 19.6C14.4 16.7 18.6 14.8 20.6 16.6Z"/>
  </g>
  <!-- ring with tube shading -->
  <g clip-path="url(#ring)" fill="none">
    <circle cx="15.5" cy="15.5" r="14" stroke="#ff0000" stroke-width="3.2"/>
    <circle cx="16.6" cy="16.6" r="14" stroke="#b80010" stroke-width="1.3"/>
    <circle cx="14.6" cy="14.6" r="13.9" stroke="url(#spec)" stroke-width="1.6"/>
  </g>
  <!-- slash -->
  <g clip-path="url(#bar-clip)">
    <path d="M27.5 0L33.5 0L0 33.5L0 27.5Z" fill="url(#bar)"/>
  </g>
</svg>
