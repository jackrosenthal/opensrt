<!-- Chainsaw (tree-clearing) cursor: vector remake of the original Ski Resort Tycoon sprite. Hotspot 19,0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 19" width="20" height="19">
  <defs>
    <linearGradient id="bar" x1="11" y1="4" x2="17" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a6a6a"/>
      <stop offset="0.6" stop-color="#626262"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="10" x2="0" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd500"/>
      <stop offset="0.55" stop-color="#ffcd00"/>
      <stop offset="0.75" stop-color="#ffc500"/>
      <stop offset="1" stop-color="#e69c00"/>
    </linearGradient>
    <linearGradient id="top" x1="2" y1="7" x2="6" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe600"/>
      <stop offset="0.45" stop-color="#fff618"/>
      <stop offset="1" stop-color="#fff65a"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="8" x2="0" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6ac00"/>
      <stop offset="0.45" stop-color="#d59400"/>
      <stop offset="1" stop-color="#c57300"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="10" x2="0" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff65a"/>
      <stop offset="0.5" stop-color="#fff631"/>
      <stop offset="1" stop-color="#ffbd10"/>
    </linearGradient>
    <linearGradient id="handle" x1="3" y1="3" x2="8" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff65a"/>
      <stop offset="0.35" stop-color="#fff600"/>
      <stop offset="1" stop-color="#f6c000"/>
    </linearGradient>
    <clipPath id="barClip">
      <path d="M10,7 L16,1 L18.6,1 L20,2.4 L20,5.6 L13.4,12.2 Z"/>
    </clipPath>
  </defs>

  <!-- chain bar -->
  <path d="M10,7 L16,1 L18.6,1 L20,2.4 L20,5.6 L13.4,12.2 Z" fill="url(#bar)"/>
  <g clip-path="url(#barClip)">
    <path d="M14.5,3 V10" stroke="#949494" stroke-width="1"/>
    <path d="M16.5,1.5 V7" stroke="#a8a8a8" stroke-width="1"/>
    <path d="M19.6,4.4 L13.2,10.8" stroke="#414141" stroke-width="1.2"/>
  </g>
  <path d="M10.3,6.9 L15.6,1.5 M16.8,1.4 L17.6,1.4 M19.5,2.2 V4.6" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round"/>

  <!-- handle -->
  <path d="M2,8.5 L2,6 C2,4.6 4,3.1 6.6,2.9 C8.2,2.8 9,3.6 9,5 L9.4,7.6 L7,7.6 L6.8,6.4 C6.4,5.9 5.6,6 5.2,6.6 L4.8,8.5 Z" fill="url(#handle)"/>
  <path d="M4.3,8.5 L4.4,6.6 C4.8,5.6 6.6,5 7.8,5.5" fill="none" stroke="#dea400" stroke-width="0.9" stroke-linecap="round"/>

  <!-- body -->
  <path d="M0,9.2 L2,8 L4.8,8 L6.2,7.6 L6.5,6.9 L11.8,6.9 L13,7.8 L13,15.3 L11.2,17.4 L10,19 L4,19 L1.8,17.8 L0,17 Z" fill="url(#front)"/>
  <path d="M11.2,8 L13,7.8 L13,15.3 L11.2,17.4 L10,19 L8.2,19 L8.2,11.2 L9.2,9.8 Z" fill="url(#side)"/>
  <path d="M0,9.2 L2,8 L4.8,8 L6.2,7.6 L6.5,6.9 L11.8,6.9 L11.2,8 L9.2,9.8 L8.4,11.2 L8.2,12.6 L5.6,12.4 L4,11.4 L0,10.6 Z" fill="url(#top)"/>
  <path d="M6,10.5 L8.3,10.8 L8.2,19 L6.6,19 L6,17.5 Z" fill="url(#edge)"/>
  <path d="M8.2,11.2 L9.2,9.8 L11.2,8 L13,7.8" fill="none" stroke="#e6ac00" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- vents -->
  <rect x="10.9" y="9.8" width="1" height="2.3" rx="0.45" fill="#6a4100"/>
  <rect x="8.9" y="11.8" width="1" height="2.4" rx="0.45" fill="#784a00"/>
</svg>
