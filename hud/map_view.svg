<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 39" width="35" height="39">
  <!-- Map view button: a folded map on the disc shared by the bar
       buttons. The original's sprites (Mapview_*) showed a magnifying
       glass. One group per state; the game shows one with a stylesheet. -->
  <defs>
    <!-- The disc, shared by every bar button. -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <radialGradient id="faceNormal" cx="0.5" cy="0.5" r="0.5" fx="0.36" fy="0.34">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.82" stop-color="#FFFFFF"/>
      <stop offset="0.93" stop-color="#E4E4E6"/>
      <stop offset="1" stop-color="#B8B8BC"/>
    </radialGradient>
    <radialGradient id="faceRollover" cx="0.5" cy="0.5" r="0.5" fx="0.36" fy="0.34">
      <stop offset="0" stop-color="#FFFFB8"/>
      <stop offset="0.3" stop-color="#FFFF86"/>
      <stop offset="0.8" stop-color="#FFFF7E"/>
      <stop offset="0.92" stop-color="#E6E070"/>
      <stop offset="1" stop-color="#9C9A58"/>
    </radialGradient>
    <clipPath id="faceClip"><circle cx="18.3" cy="19" r="14"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <circle cx="18.3" cy="19" r="14" fill="#C6C6C6"/>
      <g clip-path="url(#faceClip)">
        <circle cx="19.8" cy="20.6" r="16.2" fill="none" stroke="#1E1E1E" stroke-width="4.4" filter="url(#inset)"/>
      </g>
    </g>
    <linearGradient id="ring" x1="7" y1="6" x2="29" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A7A7A"/>
      <stop offset="0.5" stop-color="#4A4A4A"/>
      <stop offset="1" stop-color="#3A3A40"/>
    </linearGradient>
    <g id="disc">
      <!-- shadow on the bar, down and to the right -->
      <circle cx="18.9" cy="20" r="15.6" fill="#28305A" fill-opacity="0.32" filter="url(#soft)"/>
      <!-- pale halo round the rim -->
      <circle cx="18.3" cy="19" r="15.4" fill="none" stroke="#B4B4B8" stroke-width="1" stroke-opacity="0.8"/>
    </g>
    <circle id="rim" cx="18.3" cy="19" r="14.6" fill="none" stroke="url(#ring)" stroke-width="1.1"/>
    <circle id="face" cx="18.3" cy="19" r="14"/>

    <!-- The map: three panels folded in a zigzag. The map is drawn
         flat once (x 9.4..27.4, y 0..13.6) and sheared onto each panel so it
         follows the folds. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E9CF0"/>
      <stop offset="1" stop-color="#AFD2FF"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="1" x2="0" y2="13.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF0FA"/>
    </linearGradient>
    <linearGradient id="forest" x1="9.4" y1="0" x2="27.4" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A8A46"/>
      <stop offset="0.5" stop-color="#2E7A3C"/>
      <stop offset="1" stop-color="#1E5A32"/>
    </linearGradient>
    <!-- A trail map: a snowy mountain, forested below the treeline, with
         the runs and the lift line cut through the trees. -->
    <g id="mapFlat">
      <rect x="9.4" y="0" width="18" height="13.6" fill="url(#sky)"/>
      <!-- the mountain and its shaded right flank -->
      <path d="M9.4,5.2 L11.8,3.4 L13.6,3.8 L17.4,0.8 L20.8,3 L23.4,2.2 L27.4,4.8 V13.6 H9.4 Z" fill="url(#snow)"/>
      <path d="M17.4,0.8 L20.8,3 L23.4,2.2 L27.4,4.8 V9.6 C24.4,8.6 21.4,6.6 19.6,3.6 Z" fill="#BCCDEC"/>
      <!-- forest below a ragged treeline -->
      <path d="M9.4,7.4 C10.2,6.8 10.8,7.2 11.6,6.6 C12.4,6 13.2,6.8 14.2,6.2 C15.2,5.6 15.8,6.2 16.8,5.6
               C17.8,5.1 18.6,5.9 19.6,5.4 C20.6,4.9 21.4,5.6 22.4,5.1 C23.4,4.6 24.2,5.3 25.2,4.9
               C26,4.6 26.8,5 27.4,4.8 V13.6 H9.4 Z" fill="url(#forest)"/>
      <!-- runs cut through the trees, splitting and joining on the way
           down: a run off the left shoulder; one under the summit that
           splits, its right branch joined by a run from the right of the
           summit; a long run sweeping in from the right; and a narrow
           expert run down the steep flank that winds out along a trail to
           join it -->
      <g fill="none" stroke="#F4F8FF" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11.6,6.7 C13.4,7.8 13.2,9 11.6,9.8 C10.2,10.6 10.6,12.2 11.8,13.6" stroke-width="0.9"/>
        <path d="M16.8,5.8 C17,7.2 15.6,7.8 15.2,9" stroke-width="1.05"/>
        <path d="M15.2,9 C14.4,10.4 14.6,12.2 13.8,13.6" stroke-width="0.85"/>
        <path d="M15.2,9 C16.4,10 17.6,11 17.4,12 C17.3,12.6 17.2,13.1 17.2,13.6" stroke-width="0.9"/>
        <path d="M19.8,5.9 C20.2,7.6 18.8,8.6 19,9.8 C19.1,10.8 18.2,11.4 17.5,11.9" stroke-width="0.8"/>
        <path d="M23.4,5.4 C23.2,7 21.4,7.8 21.2,9.6 C21,11 22,12.4 21.6,13.6" stroke="#E4EBF8" stroke-width="1.05"/>
        <path d="M26.2,5.5 C26.8,6.8 25.8,7.8 26.4,9.2" stroke="#DCE6F8" stroke-width="0.6"/>
        <path d="M26.4,9.2 C25.6,10.4 23.6,10.4 21.5,11.4" stroke="#DCE6F8" stroke-width="0.5"/>
      </g>
      <!-- the lift: a cable with its towers -->
      <path d="M19.8,13.6 L22.4,5.4" fill="none" stroke="#3A3A48" stroke-width="0.32"/>
      <g fill="#3A3A48">
        <circle cx="20.5" cy="11.4" r="0.24"/><circle cx="21.2" cy="9.2" r="0.24"/><circle cx="21.9" cy="7" r="0.24"/>
      </g>
    </g>
    <clipPath id="strip0"><rect x="9.4" y="0" width="6" height="13.6"/></clipPath>
    <clipPath id="strip1"><rect x="15.4" y="0" width="6" height="13.6"/></clipPath>
    <clipPath id="strip2"><rect x="21.4" y="0" width="6" height="13.6"/></clipPath>
    <g id="map">
      <!-- shadow on the face -->
      <polygon points="9.4,12.2 15.4,13.7 21.4,12.2 27.4,13.7 27.4,27.3 21.4,25.8 15.4,27.3 9.4,25.8" transform="translate(0.9,1.3)" fill="#28305A" fill-opacity="0.35" filter="url(#soft)"/>
      <g transform="matrix(1,0.25,0,1,0,9.85)">
        <g clip-path="url(#strip0)"><use href="#mapFlat"/></g>
        <rect x="9.4" y="0" width="6" height="13.6" fill="#FFFFFF" fill-opacity="0.18"/>
      </g>
      <g transform="matrix(1,-0.25,0,1,0,17.55)">
        <g clip-path="url(#strip1)"><use href="#mapFlat"/></g>
        <rect x="15.4" y="0" width="6" height="13.6" fill="#1A2440" fill-opacity="0.14"/>
      </g>
      <g transform="matrix(1,0.25,0,1,0,6.85)">
        <g clip-path="url(#strip2)"><use href="#mapFlat"/></g>
        <rect x="21.4" y="0" width="6" height="13.6" fill="#FFFFFF" fill-opacity="0.08"/>
      </g>
      <!-- folds and edge -->
      <path d="M15.4,13.7 V27.3 M21.4,12.2 V25.8" fill="none" stroke="#6A7894" stroke-width="0.55"/>
      <polygon points="9.4,12.2 15.4,13.7 21.4,12.2 27.4,13.7 27.4,27.3 21.4,25.8 15.4,27.3 9.4,25.8" fill="none" stroke="#3E4A62" stroke-width="0.9" stroke-linejoin="round"/>
    </g>
  </defs>

  <g id="normal">
    <use href="#disc"/>
    <use href="#face" fill="url(#faceNormal)"/>
    <use href="#rim"/>
    <use href="#map"/>
  </g>
  <g id="rollover" display="none">
    <use href="#disc"/>
    <use href="#face" fill="url(#faceRollover)"/>
    <use href="#rim"/>
    <use href="#map"/>
  </g>
  <g id="depress" display="none">
    <use href="#disc"/>
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#map" transform="translate(1,1)"/>
  </g>
</svg>
