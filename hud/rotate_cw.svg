<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 39" width="37" height="39">
  <!-- Rotate clockwise button: vector remake of the original Ski Resort Tycoon
       sprites RotR_normal/_rollover/_depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The disc, shared by every bar button. -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <radialGradient id="faceNormal" cx="0.5" cy="0.5" r="0.5" fx="0.36" fy="0.34">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.82" stop-color="#FFFFFF"/>
      <stop offset="0.93" stop-color="#E4E4E6"/>
      <stop offset="1" stop-color="#B8B8BC"/>
    </radialGradient>
    <radialGradient id="faceRollover" cx="0.5" cy="0.5" r="0.5" fx="0.36" fy="0.34">
      <stop offset="0" stop-color="#FFFFB8"/>
      <stop offset="0.3" stop-color="#FFFF86"/>
      <stop offset="0.8" stop-color="#FFFF7E"/>
      <stop offset="0.92" stop-color="#E6E070"/>
      <stop offset="1" stop-color="#9C9A58"/>
    </radialGradient>
    <clipPath id="faceClip"><circle cx="18.3" cy="19.4" r="14"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <circle cx="18.3" cy="19.4" r="14" fill="#C6C6C6"/>
      <g clip-path="url(#faceClip)">
        <circle cx="19.8" cy="21" r="16.2" fill="none" stroke="#1E1E1E" stroke-width="4.4" filter="url(#inset)"/>
      </g>
    </g>
    <linearGradient id="ring" x1="7" y1="6.4" x2="29" y2="32.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A7A7A"/>
      <stop offset="0.5" stop-color="#4A4A4A"/>
      <stop offset="1" stop-color="#3A3A40"/>
    </linearGradient>
    <g id="disc">
      <!-- shadow on the bar, down and to the right -->
      <circle cx="18.9" cy="20.4" r="15.6" fill="#28305A" fill-opacity="0.32" filter="url(#soft)"/>
      <!-- pale halo round the rim -->
      <circle cx="18.3" cy="19.4" r="15.4" fill="none" stroke="#B4B4B8" stroke-width="1" stroke-opacity="0.8"/>
    </g>
    <circle id="rim" cx="18.3" cy="19.4" r="14.6" fill="none" stroke="url(#ring)" stroke-width="1.1"/>
    <circle id="face" cx="18.3" cy="19.4" r="14"/>

    <!-- The arrow: a thick red ribbon seen from above, curling round in a
         loop and coming back over its own start as the head.  A copy of the
         top face shifted down makes the side walls; the face is shaded by a
         soft bevel (light upper left) that follows every curve, with a glossy
         streak along the outside of the curl. -->
    <path id="loop" d="M 22.4,21 L 22.4,17.2 C 22.4,16.3 21.6,15.8 20.7,15.8 L 15.8,15.8 C 14.31,15.8 13.1,16.74 13.1,17.9 C 13.1,19.06 14.31,20 15.8,20 L 20.3,20 L 20.3,16.6 L 28.6,22.9 L 21.2,28.4 L 20.3,28.4 L 20.3,25.6 L 15.8,25.6 C 12.04,25.6 9,22.11 9,17.8 C 9,13.49 12.04,10 15.8,10 L 20.7,10 C 23.6,10 25.8,11.6 25.8,14 L 25.8,21 Z"/>
    <clipPath id="loopClip"><use href="#loop"/></clipPath>
    <!-- The head, drawn again over the tail where the loop's far side
         turns down behind it; it runs on past its back edge so the bevel
         makes no edge there, and is cut at the back edge. -->
    <path id="head" d="M 17,20 L 20.3,20 L 20.3,16.6 L 28.6,22.9 L 21.2,28.4 L 20.3,28.4 L 20.3,25.6 L 17,25.6 Z"/>
    <clipPath id="headClip"><rect x="20.3" y="10" width="12" height="22"/></clipPath>
    <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.7" result="blur"/>
      <feOffset in="blur" dx="0.8" dy="0.8" result="down"/>
      <feOffset in="blur" dx="-0.8" dy="-0.8" result="up"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="litA"/>
      <feComposite in="SourceAlpha" in2="up" operator="out" result="darkA"/>
      <feFlood flood-color="#FF9A84" flood-opacity="0.6"/>
      <feComposite in2="litA" operator="in" result="lit"/>
      <feFlood flood-color="#700404" flood-opacity="0.5"/>
      <feComposite in2="darkA" operator="in" result="dark"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="lit"/></feMerge>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.5"/></filter>
    <linearGradient id="ribbon" x1="10" y1="12" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4038"/>
      <stop offset="0.35" stop-color="#FA2219"/>
      <stop offset="0.65" stop-color="#D81410"/>
      <stop offset="1" stop-color="#9A0A08"/>
    </linearGradient>
    <linearGradient id="turnAway" x1="20.7" y1="0" x2="25.8" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A0606" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A0606" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="headShadow" x1="20.3" y1="0" x2="19.2" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A0806" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3A0806" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="15.8" x2="0" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A0C0A"/>
      <stop offset="0.06" stop-color="#4E2414"/>
      <stop offset="0.12" stop-color="#A8885C"/>
      <stop offset="0.2" stop-color="#7A2A1C"/>
      <stop offset="0.6" stop-color="#8E3022"/>
      <stop offset="0.72" stop-color="#683828"/>
      <stop offset="1" stop-color="#7A6044"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="10" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FFD0C8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF9C94" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topHl" x1="12" y1="0" x2="26" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC0B4" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFB0A0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF8A7A" stop-opacity="0"/>
    </linearGradient>
    <g id="arrow">
      <use href="#loop" fill="url(#wall)" transform="translate(0.25,2.1)"/>
      <use href="#loop" fill="url(#ribbon)" filter="url(#bevel)"/>
      <!-- the far side of the loop darkens as it turns away behind the head -->
      <g clip-path="url(#loopClip)">
        <rect x="20.7" y="9" width="5.4" height="12.4" fill="url(#turnAway)"/>
        <path d="M 20.7,10.6 C 23.3,10.6 25.2,12 25.2,14" fill="none" stroke="#FFA890" stroke-width="0.7" stroke-opacity="0.6" stroke-linecap="round" filter="url(#soften)"/>
      </g>
      <!-- the head's shadow in the hole beside it -->
      <rect x="19.2" y="16.4" width="1.2" height="3.7" fill="url(#headShadow)"/>
      <g clip-path="url(#headClip)">
        <use href="#head" fill="url(#ribbon)" filter="url(#bevel)"/>
      </g>
      <g clip-path="url(#loopClip)">
        <path d="M 19.5,11 L 15.8,11 C 12.6,11 10,14.04 10,17.8 C 10,21.56 12.6,24.6 16.8,24.6" fill="none" stroke="url(#sheen)" stroke-width="1.3" stroke-linecap="round" filter="url(#soften)"/>
        <path d="M 14,18.5 C 14,19.66 14.31,20.9 15.8,20.9 L 19.5,20.9" fill="none" stroke="url(#topHl)" stroke-width="1.4" stroke-linecap="round" filter="url(#soften)"/>
        <path d="M 20.6,17.15 L 28.1,22.9" fill="none" stroke="#F8A878" stroke-width="0.7" stroke-opacity="0.8" stroke-linecap="round" filter="url(#soften)"/>
      </g>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#disc"/>
    <use href="#face" fill="url(#faceNormal)"/>
    <use href="#rim"/>
    <use href="#arrow"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#disc"/>
    <use href="#face" fill="url(#faceRollover)"/>
    <use href="#rim"/>
    <use href="#arrow"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#disc"/>
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#arrow" transform="translate(1,1)"/>
  </g>
</svg>
