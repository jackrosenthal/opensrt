<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 39" width="38" height="39">
  <!-- Zoom out button: vector remake of the original Ski Resort Tycoon
       sprites zoomout_normal/_rollover/_depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The disc, shared by every bar button. -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <radialGradient id="faceNormal" cx="0.5" cy="0.5" r="0.5" fx="0.36" fy="0.34">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.82" stop-color="#FFFFFF"/>
      <stop offset="0.93" stop-color="#E4E4E6"/>
      <stop offset="1" stop-color="#B8B8BC"/>
    </radialGradient>
    <radialGradient id="faceRollover" cx="0.5" cy="0.5" r="0.5" fx="0.36" fy="0.34">
      <stop offset="0" stop-color="#FFFFB8"/>
      <stop offset="0.3" stop-color="#FFFF86"/>
      <stop offset="0.8" stop-color="#FFFF7E"/>
      <stop offset="0.92" stop-color="#E6E070"/>
      <stop offset="1" stop-color="#9C9A58"/>
    </radialGradient>
    <clipPath id="faceClip"><circle cx="19.3" cy="19" r="14"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <circle cx="19.3" cy="19" r="14" fill="#C6C6C6"/>
      <g clip-path="url(#faceClip)">
        <circle cx="20.8" cy="20.6" r="16.2" fill="none" stroke="#1E1E1E" stroke-width="4.4" filter="url(#inset)"/>
      </g>
    </g>
    <linearGradient id="ring" x1="8" y1="6" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A7A7A"/>
      <stop offset="0.5" stop-color="#4A4A4A"/>
      <stop offset="1" stop-color="#3A3A40"/>
    </linearGradient>
    <g id="disc">
      <!-- shadow on the bar, down and to the right -->
      <circle cx="19.9" cy="20" r="15.6" fill="#28305A" fill-opacity="0.32" filter="url(#soft)"/>
      <!-- pale halo round the rim -->
      <circle cx="19.3" cy="19" r="15.4" fill="none" stroke="#B4B4B8" stroke-width="1" stroke-opacity="0.8"/>
    </g>
    <circle id="rim" cx="19.3" cy="19" r="14.6" fill="none" stroke="url(#ring)" stroke-width="1.1"/>
    <circle id="face" cx="19.3" cy="19" r="14"/>

    <!-- The minus: a blue bar beveled like the zoom in button's plus: lit
         along the top-left edge, shading to the bottom right, and a dark
         underside showing its depth. -->
    <path id="bar" d="M10,16 H28 V21.2 H10 Z"/>
    <clipPath id="barClip"><use href="#bar"/></clipPath>
    <linearGradient id="barFace" x1="0" y1="16" x2="0" y2="21.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C9EFC"/>
      <stop offset="0.5" stop-color="#5E7CE4"/>
      <stop offset="1" stop-color="#4A5EB4"/>
    </linearGradient>
    <linearGradient id="barShade" x1="10" y1="0" x2="28" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#000020" stop-opacity="0"/>
      <stop offset="1" stop-color="#000020" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <g id="minus">
      <!-- underside: dark brown with a dark blue lip -->
      <use href="#bar" transform="translate(0.5,1.9)" fill="#332A20"/>
      <use href="#bar" transform="translate(0.3,1.1)" fill="#232B56"/>
      <use href="#bar" fill="url(#barFace)"/>
      <g clip-path="url(#barClip)">
        <use href="#bar" fill="url(#barShade)"/>
        <path fill-rule="evenodd" fill="#E2EEFF" fill-opacity="0.65" filter="url(#bevel)"
              d="M0,0 H38 V39 H0 Z M10.8,16.8 H28.8 V22 H10.8 Z"/>
        <path fill-rule="evenodd" fill="#101C58" fill-opacity="0.38" filter="url(#bevel)"
              d="M0,0 H38 V39 H0 Z M9.3,15.3 H27.3 V20.5 H9.3 Z"/>
      </g>
    </g>
  </defs>

  <g id="normal">
    <use href="#disc"/>
    <use href="#face" fill="url(#faceNormal)"/>
    <use href="#rim"/>
    <use href="#minus"/>
  </g>
  <g id="rollover" display="none">
    <use href="#disc"/>
    <use href="#face" fill="url(#faceRollover)"/>
    <use href="#rim"/>
    <use href="#minus"/>
  </g>
  <g id="depress" display="none">
    <use href="#disc"/>
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#minus" transform="translate(1,1)"/>
  </g>
</svg>
