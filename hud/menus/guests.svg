<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 45 57" width="45" height="57">
  <!-- Guest Stats menu log: vector remake of the original Ski Resort
       Tycoon sprites LogGuests_Normal/_Rollover/_Depress.  It opens no
       tray, so it has no open state.  One group per state; the game
       shows one with a stylesheet. -->
  <defs>
    <!-- The log, shared by every top bar and menu log: a black rimmed
         disc whose face is shaded inside its rim. -->
    <circle id="face" cx="23" cy="33" r="18"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- Lit: a shadow along the lower-right inside of the rim. -->
    <g id="faceNormal">
      <use href="#face" fill="#FFFFFF"/>
      <g clip-path="url(#faceClip)">
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#8A8A8E" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="faceRollover">
      <use href="#face" fill="#FFFF73"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25" cy="35" r="19.4" fill="none" stroke="#FFFFD8" stroke-width="3" filter="url(#inset)"/>
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#9C9C66" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <use href="#face" fill="#C5C5C5"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25.4" cy="35.4" r="20.4" fill="none" stroke="#3C3C3C" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="rim">
      <circle cx="23" cy="33" r="18" fill="none" stroke="#5A5A5E" stroke-width="0.9" stroke-opacity="0.7"/>
      <circle cx="23" cy="33" r="19.55" fill="none" stroke="#000000" stroke-width="3"/>
    </g>

    <!-- The stem the log hangs from the one above by, reaching up into
         its rim (the drawing starts 2 px above the sprite). -->
    <rect id="stem" x="21" y="-2" width="4" height="16" fill="#000000"/>
    <!-- A smiling guest's face in a blue helmet with yellow goggles. -->
    <linearGradient id="helmetFill" x1="15" y1="21" x2="30" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8C8CEE"/>
      <stop offset="0.45" stop-color="#5A52E6"/>
      <stop offset="1" stop-color="#2A2A90"/>
    </linearGradient>
    <linearGradient id="skinFill" x1="15" y1="34" x2="29" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6A47B"/>
      <stop offset="0.6" stop-color="#D58B6A"/>
      <stop offset="1" stop-color="#9C6A4A"/>
    </linearGradient>
    <radialGradient id="lensFill" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFD0"/>
      <stop offset="0.5" stop-color="#F6EE4A"/>
      <stop offset="1" stop-color="#8B8330"/>
    </radialGradient>
    <g id="icon">
      <!-- the ears -->
      <ellipse cx="15.3" cy="35.6" rx="1.6" ry="1.9" fill="#CD8362"/>
      <ellipse cx="30" cy="36" rx="1.7" ry="2.2" fill="#B47B5A"/>
      <!-- the face, narrowing to the chin -->
      <path fill="url(#skinFill)" d="M14.8,33.5 L30.8,33.5 C30.6,38 29.5,41.5 27.4,43.6 C26,45.2 24.6,46 22.8,46 C21,46 19.8,45.2 18.8,44 C16.8,41.8 15.2,38 14.8,33.5 Z"/>
      <!-- a shadow down the right cheek -->
      <path fill="#8B5A41" fill-opacity="0.45" d="M30.8,33.5 C30.6,38 29.5,41.5 27.4,43.6 C26,45.2 24.6,46 22.8,46 C25,45 26.6,42.8 27.6,40 C28.5,37.6 28.8,35.5 28.8,33.5 Z"/>
      <!-- the nose -->
      <path fill="#7B5239" d="M20.2,37.8 C20.6,36.6 22.6,36.6 23.2,37.8 C22.6,38.6 20.8,38.6 20.2,37.8 Z"/>
      <path fill="#FFC5A8" fill-opacity="0.8" d="M19.8,36.6 C20.3,35.6 21.6,35.4 22.4,35.8 C21.6,36.2 20.6,36.4 19.8,36.6 Z"/>
      <!-- the grin: a dark mouth showing white teeth -->
      <path fill="#3A2214" d="M18.4,39.4 C20.4,40 23.4,40 25.6,39.2 C25.2,41 23.8,41.8 22,41.8 C20.2,41.8 18.8,41 18.4,39.4 Z"/>
      <path fill="#EEF6F6" d="M19.8,40 C21,40.4 22.8,40.4 24.2,40 C23.8,40.8 23,41.1 22,41.1 C21,41.1 20.2,40.8 19.8,40 Z"/>
      <!-- the lower lip and the chin's dimple -->
      <path fill="none" stroke="#9C6A52" stroke-width="0.6" stroke-linecap="round" d="M20.6,42.6 C21.6,43 22.8,43 23.8,42.5"/>
      <!-- the helmet -->
      <path fill="url(#helmetFill)" d="M12.8,34 C11.8,25 16.2,20.2 21.6,20.2 C27.4,20.2 32.2,24.4 32.2,34.4 C30,32 16,31.6 12.8,34 Z"/>
      <!-- the helmet's ridges -->
      <path fill="none" stroke="#3A32B8" stroke-width="0.9" stroke-opacity="0.8" d="M13.8,25.6 C17,25 25,24.8 30.6,25.8 M12.6,29.4 C17,28.6 26,28.6 31.8,29.6"/>
      <!-- a highlight on the helmet's upper left -->
      <path fill="#D0D0F8" fill-opacity="0.85" d="M15.6,24.4 C16.4,22.6 18.6,21.8 21,22.2 C23,22.6 23.4,23.6 22.6,24 C20.4,23.4 17.6,23.6 15.6,24.4 Z"/>
      <path fill="#A4A4EE" fill-opacity="0.7" d="M16,27.4 C19,26.4 23,26.4 25.6,27 C23,27.6 19,27.6 16,27.4 Z"/>
      <!-- the goggles' black strap and frame -->
      <path fill="#14100C" d="M13.4,31.2 C16,30.4 18,30.4 21.6,30.6 C25,30.4 28,30.4 31.4,31.4 L31.2,33.6 C29,34 27.8,34.2 27.4,34.8 C26.4,35.6 24.4,35.6 22.8,35.2 L22.2,36 L20.8,36 L20.2,35.2 C19,35.6 17.2,35.6 16.2,34.8 C15.6,34.2 14.6,33.8 13.6,33.6 Z"/>
      <!-- the yellow lenses -->
      <path fill="url(#lensFill)" d="M16.4,31.4 C18,31 20.2,31 21.2,31.4 L21,34 C19.8,34.9 17.6,34.8 16.8,34 Z"/>
      <path fill="url(#lensFill)" d="M21.8,31.4 C23.2,31 25.6,31 27,31.4 L26.8,34 C26,34.8 23.8,34.9 22,34 Z"/>
      <!-- glints on the lenses -->
      <path fill="#FFFFFF" d="M19.1,31.4 L20.2,31.4 L19.2,34.2 L18.1,34.2 Z M23.3,31.4 L24.4,31.4 L23.4,34.3 L22.3,34.3 Z"/>
    </g>
  </defs>

  <use href="#stem"/>
  <g id="normal" class="state">
    <use href="#faceNormal"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#faceRollover"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
