<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 45 57" width="45" height="57">
  <!-- Trees menu log: vector remake of the original Ski Resort Tycoon
       sprites LogTrees_Normal/_Rollover/_Depress, and LogTrees_Special
       (state open: drawn over the log while its tray is open). One
       group per state; the game shows one with a stylesheet. -->
  <defs>
    <!-- The log, shared by every top bar and menu log: a black rimmed
         disc whose face is shaded inside its rim. -->
    <circle id="face" cx="23" cy="33" r="18"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- Lit: a shadow along the lower-right inside of the rim. -->
    <g id="faceNormal">
      <use href="#face" fill="#FFFFFF"/>
      <g clip-path="url(#faceClip)">
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#8A8A8E" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="faceRollover">
      <use href="#face" fill="#FFFF73"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25" cy="35" r="19.4" fill="none" stroke="#FFFFD8" stroke-width="3" filter="url(#inset)"/>
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#9C9C66" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <use href="#face" fill="#C5C5C5"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25.4" cy="35.4" r="20.4" fill="none" stroke="#3C3C3C" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="rim">
      <circle cx="23" cy="33" r="18" fill="none" stroke="#5A5A5E" stroke-width="0.9" stroke-opacity="0.7"/>
      <circle cx="23" cy="33" r="19.55" fill="none" stroke="#000000" stroke-width="3"/>
    </g>

    <!-- The stem the log hangs from the one above by, reaching up into
         its rim (the drawing starts 2 px above the sprite). -->
    <rect id="stem" x="21" y="-2" width="4" height="16" fill="#000000"/>
    <!-- Open: pressed in, and joined on its right to its tray's strip. -->
    <clipPath id="stripInside"><rect x="23" y="15" width="22" height="36"/></clipPath>
    <g id="openLook">
      <circle cx="23" cy="33" r="21" fill="#000000"/>
      <rect x="23" y="12" width="22" height="42" fill="#000000"/>
      <g clip-path="url(#stripInside)">
        <rect x="23" y="15" width="22" height="36" fill="#FFFFFF"/>
        <rect x="23" y="15" width="22" height="3" fill="#F6EEF6"/>
        <rect x="23" y="48" width="22" height="3" fill="#C5C5C5"/>
      </g>
      <use href="#faceDepress"/>
      <circle cx="23" cy="33" r="18" fill="none" stroke="#5A5A5E" stroke-width="0.9" stroke-opacity="0.7"/>
    </g>
    <!-- The icon: two green pine trees, a small one behind on the left
         and a tall one in front on the right.  Lit from the upper left. -->
    <linearGradient id="needles" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#189450"/>
      <stop offset="0.5" stop-color="#0E6838"/>
      <stop offset="1" stop-color="#05361C"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A3A31"/>
      <stop offset="1" stop-color="#3A2424"/>
    </linearGradient>
    <g id="icon">
      <!-- The small tree's trunk, just showing under its boughs. -->
      <rect x="15.6" y="38" width="1.6" height="1.4" fill="#413929"/>
      <!-- The small tree: four tiers of boughs. -->
      <path d="M16.3,19.4 L17.8,21.8 L18.5,24.2 L18.1,23.7 L19.2,26.5 L19.9,28.8 L19.2,28.3 L20.3,31.2 L21.1,33.6 L20.1,33.1 L21.4,36.1 L22.3,38.6 L16.4,38.4 L9.5,38.6 L10.5,36.1 L11.8,33.1 L10.7,33.6 L11.5,31.2 L12.8,28.3 L11.9,28.8 L12.9,26.5 L14.2,23.7 L13.7,24.2 L14.6,21.8 Z" fill="url(#needles)" stroke="#7B8B5A" stroke-width="0.5" stroke-opacity="0.5" stroke-linejoin="round"/>
      <!-- Shade under each of its tiers. -->
      <g fill="none" stroke="#002412" stroke-width="0.8" stroke-linecap="round">
        <path d="M15,24.6 L17.2,24.4 M13.8,28.9 L15.4,29.6 L18,28.8 M12.6,33.8 L14.6,34.4 L17.8,33.6 M11.2,38 L13.6,37.4"/>
        <path d="M16.6,25.6 L17.4,27 M17.2,30.4 L18.2,32 M15.8,35 L17.6,36.8" stroke-width="0.7"/>
      </g>
      <!-- Sunlit needles on its left side. -->
      <g fill="none" stroke="#25B862" stroke-width="0.7" stroke-linecap="round">
        <path d="M15.7,21.8 L15,23.4 M14.8,25.8 L13.8,27.8 M16.2,26.4 L15.8,27.6 M13.8,30.6 L12.4,32.8 M15.4,30.4 L14.8,32 M12.8,35.2 L11,37.6 M14.6,35.4 L13.8,37"/>
      </g>
      <!-- The tall tree's trunk. -->
      <rect x="23.6" y="42.8" width="2" height="3" fill="url(#bark)"/>
      <!-- The tall tree: five tiers of boughs. -->
      <path d="M25.2,17.4 L27,20.2 L28,23 L27.4,22.5 L28.8,25.4 L29.8,27.8 L28.9,27.3 L30.3,30.2 L31.4,32.6 L30.2,32.1 L31.7,35.2 L32.8,37.8 L31.3,37.3 L32.9,40.6 L34.2,43.4 L31,43.9 L27.4,43.4 L25.2,43.9 L22.8,43.4 L19.4,43.9 L16.3,43.4 L17.7,40.6 L19.4,37.3 L18,37.8 L19.1,35.2 L20.6,32.1 L19.4,32.6 L20.3,30.2 L21.5,27.3 L20.6,27.8 L21.6,25.4 L23,22.5 L22.4,23 L23.4,20.2 Z" fill="url(#needles)" stroke="#7B8B5A" stroke-width="0.5" stroke-opacity="0.5" stroke-linejoin="round"/>
      <!-- Shade under each of its tiers, deepest on the right. -->
      <g fill="none" stroke="#002412" stroke-width="0.8" stroke-linecap="round">
        <path d="M23.8,23.3 L25.4,23.8 L27,23.2 M22.6,27.8 L24.6,28.6 L27.4,28.4 L28.6,27.8 M21.4,32.4 L23.6,33.2 L27,32.8 L29.6,32.4 M20,37.8 L22.4,38.6 L26.4,38.2 L31.2,37.8 M18.4,43.2 L21.4,42.6"/>
        <path d="M26.8,24.6 L28.2,26.8 M27.6,29.6 L29.2,31.8 M28.4,34.4 L30.4,37 M26.6,40 L28.4,42.6 M29.2,39.6 L31.6,42.6" stroke-width="0.9"/>
      </g>
      <!-- Sunlit needles on its left and middle. -->
      <g fill="none" stroke="#25B862" stroke-width="0.7" stroke-linecap="round">
        <path d="M24.6,20.4 L24,22.2 M23.8,24.6 L22.8,26.6 M25.6,24.8 L25,26.8 M22.8,29.6 L21.6,31.6 M24.8,29.8 L24.2,31.8 M26.4,30 L26.2,31.4 M21.4,34.6 L19.8,37 M23.4,34.6 L22.6,36.8 M25.4,34.4 L25,36.4 M20.4,40 L18.6,42.4 M22.6,39.8 L21.8,42 M24.8,39.6 L24.4,41.6"/>
      </g>
      <!-- A few bright needle tips catching the light. -->
      <g fill="#39FF94">
        <circle cx="25.4" cy="25.4" r="0.45"/>
        <circle cx="24.6" cy="30.4" r="0.45"/>
        <circle cx="22.6" cy="35.6" r="0.45"/>
        <circle cx="22.4" cy="40.6" r="0.45"/>
        <circle cx="14.4" cy="31.2" r="0.4"/>
      </g>
    </g>
  </defs>

  <use href="#stem"/>
  <g id="normal" class="state">
    <use href="#faceNormal"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#faceRollover"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
  <g id="open" class="state" display="none">
    <use href="#openLook"/>
    <use href="#icon"/>
  </g>
</svg>
