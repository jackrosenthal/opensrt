<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 57 55" width="57" height="55">
  <!-- Short tray piece: vector remake of the original Ski Resort Tycoon
       sprite LogButton_A.  What a menu log stretches into as its tray
       starts to open: the log's place, with a short strip with a
       rounded end to its right. -->
  <defs>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- The tray's strip: a black edge round a white inside, with a pale
         band along the top and a grey one along the bottom, which follow
         the inside round the rounded end, as on the end cap. -->
    <path id="inside" d="M23,15 H36 A18,18 0 0 1 36,51 H23 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <clipPath id="belowPale"><use href="#inside" transform="translate(0,3)"/></clipPath>
    <!-- the grey band fades out as it goes up round the end, and
         darkens toward its lower right -->
    <linearGradient id="grey" x1="0" y1="26" x2="0" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C5C5C5" stop-opacity="0"/>
      <stop offset="1" stop-color="#C5C5C5"/>
    </linearGradient>
    <linearGradient id="endShade" x1="39" y1="0" x2="53" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A8A8E" stop-opacity="0"/>
      <stop offset="1" stop-color="#8A8A8E" stop-opacity="0.8"/>
    </linearGradient>
    <!-- the darkening fades out as it goes up round the end -->
    <mask id="endFade" maskUnits="userSpaceOnUse" x="36" y="15" width="21" height="36">
      <rect x="36" y="15" width="21" height="36" fill="url(#fadeUp)"/>
    </mask>
    <linearGradient id="fadeUp" x1="0" y1="30" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- The log's place, covered by the log while its tray is open. -->
  <circle cx="23" cy="33" r="21" fill="#000000"/>
  <path d="M23,12 H36 A21,21 0 0 1 36,54 H23 Z" fill="#000000"/>
  <g clip-path="url(#insideClip)">
    <rect x="23" y="15" width="34" height="36" fill="#F6EEF6"/>
    <g clip-path="url(#belowPale)">
      <rect x="23" y="15" width="100" height="36" fill="#FFFFFF"/>
      <rect x="23" y="15" width="34" height="36" fill="url(#grey)"/>
      <rect x="36" y="15" width="21" height="36" fill="url(#endShade)" mask="url(#endFade)"/>
      <use href="#inside" transform="translate(-2,-3)" fill="#FFFFFF"/>
    </g>
  </g>
  <circle cx="23" cy="33" r="18" fill="#C5C5C5"/>
  <clipPath id="face"><circle cx="23" cy="33" r="18"/></clipPath>
  <g clip-path="url(#face)">
    <circle cx="25.4" cy="35.4" r="20.4" fill="none" stroke="#3C3C3C" stroke-width="5" filter="url(#inset)"/>
  </g>
</svg>
