<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 55" width="21" height="55">
  <!-- Tray end cap: vector remake of the original Ski Resort Tycoon
       sprite LogButton_D.  The rounded end of an open tray, after its
       last button.  Every menu and tray file has the same one.  It is
       3 px wider than the sprite, so its end is a half circle exactly
       as tall as the logs, starting where the last button ends. -->
  <defs>
    <!-- The tray's strip: a black edge round a white inside, with a pale
         band along the top and a grey one along the bottom.  The bands
         follow the inside round the rounded end, so they carry on from
         the buttons' tiles. -->
    <path id="inside" d="M-40,15 H0 A18,18 0 0 1 0,51 H-40 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <!-- the inside less its pale band and its grey band -->
    <clipPath id="belowPale"><use href="#inside" transform="translate(0,3)"/></clipPath>
    <!-- the grey band fades out as it goes up round the end, and
         darkens toward its lower right -->
    <linearGradient id="grey" x1="0" y1="26" x2="0" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C5C5C5" stop-opacity="0"/>
      <stop offset="1" stop-color="#C5C5C5"/>
    </linearGradient>
    <linearGradient id="endShade" x1="3" y1="0" x2="17" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A8A8E" stop-opacity="0"/>
      <stop offset="1" stop-color="#8A8A8E" stop-opacity="0.8"/>
    </linearGradient>
    <!-- the darkening fades out as it goes up round the end -->
    <mask id="endFade" maskUnits="userSpaceOnUse" x="0" y="15" width="21" height="36">
      <rect x="0" y="15" width="21" height="36" fill="url(#fadeUp)"/>
    </mask>
    <linearGradient id="fadeUp" x1="0" y1="30" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <path d="M-40,12 H0 A21,21 0 0 1 0,54 H-40 Z" fill="#000000"/>
  <g clip-path="url(#insideClip)">
    <rect x="-40" y="15" width="61" height="36" fill="#F6EEF6"/>
    <g clip-path="url(#belowPale)">
      <rect x="-40" y="15" width="100" height="36" fill="#FFFFFF"/>
      <rect x="-40" y="15" width="61" height="36" fill="url(#grey)"/>
      <rect x="0" y="15" width="21" height="36" fill="url(#endShade)" mask="url(#endFade)"/>
      <use href="#inside" transform="translate(-2,-3)" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
