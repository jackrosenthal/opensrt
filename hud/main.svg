<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 55" width="45" height="55">
  <!-- Main menu button: vector remake of the original Ski Resort Tycoon
       sprites LogSave_normal/_rollover/_Depress. One group per state;
       the game shows one with a stylesheet. -->
  <defs>
    <!-- The log, shared by every top bar and menu log: a black rimmed
         disc whose face is shaded inside its rim. -->
    <circle id="face" cx="23" cy="33" r="18"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="inset" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- Lit: a shadow along the lower-right inside of the rim. -->
    <g id="faceNormal">
      <use href="#face" fill="#FFFFFF"/>
      <g clip-path="url(#faceClip)">
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#8A8A8E" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="faceRollover">
      <use href="#face" fill="#FFFF73"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25" cy="35" r="19.4" fill="none" stroke="#FFFFD8" stroke-width="3" filter="url(#inset)"/>
        <circle cx="20.4" cy="30.6" r="20.6" fill="none" stroke="#9C9C66" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <!-- Pressed in: a shadow along the upper-left inside of the rim. -->
    <g id="faceDepress">
      <use href="#face" fill="#C5C5C5"/>
      <g clip-path="url(#faceClip)">
        <circle cx="25.4" cy="35.4" r="20.4" fill="none" stroke="#3C3C3C" stroke-width="5" filter="url(#inset)"/>
      </g>
    </g>
    <g id="rim">
      <circle cx="23" cy="33" r="18" fill="none" stroke="#5A5A5E" stroke-width="0.9" stroke-opacity="0.7"/>
      <circle cx="23" cy="33" r="19.55" fill="none" stroke="#000000" stroke-width="3"/>
    </g>

    <!-- The floppy disk: a red diskette, lit from the upper left, with
         a gray metal shutter at the top and a striped white label below. -->
    <linearGradient id="diskFill" x1="13" y1="23" x2="33" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6414A"/>
      <stop offset="1" stop-color="#F61820"/>
    </linearGradient>
    <linearGradient id="shutterFill" x1="20" y1="23" x2="27" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4E4E4"/>
      <stop offset="0.5" stop-color="#ACACAC"/>
      <stop offset="1" stop-color="#A4A4A4"/>
    </linearGradient>
    <g id="icon">
      <!-- the disk's body, its upper-left corner clipped -->
      <path d="M14.4,23 L33,23 L33,43 L13,43 L13,24.4 Z" fill="url(#diskFill)"/>
      <!-- a highlight down the left edge and along the top -->
      <path d="M13.5,42.5 L13.5,24.6 L14.6,23.5 L32.5,23.5" fill="none" stroke="#FFA4A8" stroke-width="1"/>
      <!-- the shadowed right and bottom edges -->
      <path d="M32.5,23.6 L32.5,42.5 L13.4,42.5" fill="none" stroke="#A40000" stroke-width="1"/>
      <rect x="14" y="42" width="18" height="1" fill="#C51818"/>
      <!-- the recess left of the shutter -->
      <rect x="16" y="24" width="4" height="6" fill="#EE0810"/>
      <rect x="16" y="24" width="1" height="6" fill="#B00404"/>
      <rect x="17" y="29" width="3" height="1" fill="#FF8282"/>
      <!-- the metal shutter and the window cut through it -->
      <rect x="20" y="23" width="9" height="7" fill="url(#shutterFill)"/>
      <path d="M28.5,23.5 L28.5,29.5 L20,29.5" fill="none" stroke="#D2D2D2" stroke-width="1"/>
      <rect x="25" y="24" width="3" height="5" fill="#F63E41"/>
      <rect x="25" y="24" width="1" height="5" fill="#EE0810"/>
      <!-- the label, ruled with red lines, in a recess shadowed on the left -->
      <rect x="16" y="33.5" width="1" height="8.5" fill="#B80000"/>
      <rect x="17" y="33" width="13" height="9" rx="0.8" fill="#FFFFFF"/>
      <path d="M17,35.5 L30,35.5 M17,37.5 L30,37.5 M17,39.5 L30,39.5" stroke="#F64A52" stroke-width="1"/>
      <rect x="17" y="41" width="13" height="1" fill="#E63939"/>
      <!-- the two write-protect holes at the bottom corners -->
      <rect x="14" y="40" width="2" height="1" fill="#600000"/>
      <rect x="30" y="40" width="2" height="1" fill="#520000"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#faceNormal"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#faceRollover"/>
    <use href="#rim"/>
    <use href="#icon"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#faceDepress"/>
    <use href="#rim"/>
    <use href="#icon" transform="translate(1,1)"/>
  </g>
</svg>
