<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Weather tab's picture: vector remake of the original Ski Resort
       Tycoon sprites Tab_Weather_Normal and Tab_Weather_Depress, drawn
       over the icon tab frame.  A billowing storm cloud with a yellow
       lightning bolt and blue rain falling from it.  Dimmed on the tabs
       behind (depress). -->
  <defs>
    <filter id="dim" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.62 0 0 0 0  0 0.62 0 0 0  0 0 0.62 0 0  0 0 0 1 0"/>
    </filter>
    <radialGradient id="puff" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C8D4DA"/>
      <stop offset="1" stop-color="#6A7A80"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFF60"/>
      <stop offset="1" stop-color="#C8B400"/>
    </linearGradient>
    <g id="pic">
      <!-- rain -->
      <path d="M12.6,20.6 l-0.4,1.4 M15.4,21.4 l-0.4,1.4 M11,25 l-0.4,1.4 M14,24.6 l-0.4,1.4 M13.4,27.6 l-0.4,1.4 M24.8,22.4 l-0.4,1.4 M28.6,21 l-0.4,1.4 M30.6,21.2 l-0.4,1.4 M26.6,24.4 l-0.4,1.4 M29.4,25 l-0.4,1.4 M25.8,27.6 l-0.4,1.4 M31,24.4 l-0.4,1.4" stroke="#1A6AE6" stroke-width="1" stroke-linecap="round"/>
      <!-- the bolt -->
      <path d="M18.6,20.4 H22.6 L20.6,23.6 H23 L17.4,30.6 L19,25.6 H16.4 Z" fill="url(#bolt)" stroke="#6A5A00" stroke-width="0.5" stroke-linejoin="round"/>
      <!-- the cloud: a dark underside and puffs heaped over it -->
      <path d="M10,17 Q10,21 14,21.2 H31 Q34.6,21 34.4,17 Z" fill="#4A5860"/>
      <g fill="url(#puff)" stroke="#3A4A50" stroke-width="0.4">
        <circle cx="13" cy="16" r="4"/>
        <circle cx="31" cy="15.6" r="3.6"/>
        <circle cx="16.6" cy="11.6" r="3.8"/>
        <circle cx="27.4" cy="10.4" r="4"/>
        <circle cx="21.6" cy="9.4" r="3.6"/>
        <circle cx="19" cy="17.4" r="3.8"/>
        <circle cx="25.6" cy="16.6" r="4.2"/>
        <circle cx="22" cy="13.6" r="3.4"/>
      </g>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#pic"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#pic" filter="url(#dim)"/>
  </g>
</svg>
