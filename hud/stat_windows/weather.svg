<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 234" width="270" height="234">
  <!-- Weather panel: vector remake of the original Ski Resort Tycoon
       sprite Weather_bkrnd, the resort window's weather report.  The
       window list panel (list_panel.svg) with grey label strips and
       yellow value plates for the forecast, temperature, barometer,
       humidity and avalanche danger, the gold letters of the wind
       compass (whose dial, wind.svg, is drawn between them), and a
       sunken white box for the snow depth graph with its scale.  The
       black lettering is in URW Gothic Demi outlines (the original's ITC
       Avant Garde style); the gold letters are hand drawn. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#DEDEFF"/>
      <stop offset="1" stop-color="#9CB0E6"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="261" y1="0" x2="265" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A4A5A" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A4A5A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="footShade" x1="0" y1="222" x2="0" y2="229" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A5A84" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A5A84" stop-opacity="0.9"/>
    </linearGradient>
    <!-- a grey shade inside the foot of a box -->
    <linearGradient id="boxFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDBDBD" stop-opacity="0"/>
      <stop offset="1" stop-color="#BDBDBD"/>
    </linearGradient>
    <path id="inside" d="M4,0 H265 V215 A14,14 0 0 1 251,229 H18 A14,14 0 0 1 4,215 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <!-- gold, lit from the upper left -->
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF08B"/>
      <stop offset="0.5" stop-color="#D5B452"/>
      <stop offset="1" stop-color="#9C7B31"/>
    </linearGradient>
    <path id="letterN" d="M0.4,0.6 H3.4 L7,7.6 V2.4 L5.8,1.2 V0.6 H9.6 V1.2 L8.4,2.4 V11.6 H7.4 L2.6,2.6 V9.6 L3.8,10.8 V11.4 H0 V10.8 L1.2,9.6 V2 Z"/>
    <path id="letterW" d="M0,0.6 H4.6 V1.2 L3.6,2 L5.2,7 L6.6,3 L6.2,1.6 L5.6,1.2 V0.6 H9.4 V1.2 L8.6,2 L10,6.6 L11.6,2.2 L10.6,1.2 V0.6 H14 V1.2 L13.2,2 L9.8,11 H8.8 L7.2,6 L5.2,11 H4.2 L1,2 L0,1.2 Z"/>
    <path id="letterE" d="M0.2,0.6 H8.6 V3.6 H7.8 L6.8,2 H3.6 V5.4 H5.6 L6.4,4.4 H7 V7.8 H6.4 L5.6,6.8 H3.6 V10.2 H7 L8.2,8.4 H9 V11.6 H0.2 V11 L1.4,10 V2.2 L0.2,1.2 Z"/>
    <path id="letterS" d="M7.4,0.4 V3.6 H6.8 C6.4,2.2 5.6,1.6 4.4,1.6 C3.2,1.6 2.6,2.2 2.6,3 C2.6,4.2 4,4.6 5.4,5.2 C7,5.9 8,6.8 8,8.4 C8,10.4 6.4,11.8 4.2,11.8 C3,11.8 2,11.4 1.4,11 L0.8,11.8 H0.2 V8.2 H0.8 C1.2,9.8 2.4,10.6 3.8,10.6 C5,10.6 5.8,10 5.8,9 C5.8,7.8 4.4,7.3 3,6.7 C1.4,6 0.4,5.1 0.4,3.6 C0.4,1.6 1.9,0.4 3.9,0.4 C4.9,0.4 5.8,0.7 6.4,1.1 L6.8,0.4 Z"/>
  </defs>

  <!-- the rim, open along the top -->
  <path d="M0.8,0 H268.2 V215 A16.6,16.6 0 0 1 251.6,231.6 H17.4 A16.6,16.6 0 0 1 0.8,215 Z" fill="#000000"/>
  <use href="#inside" fill="url(#sky)"/>
  <g clip-path="url(#insideClip)">
    <!-- a pale band down the inside of the left rim, the bevels, and the
         shade along the foot -->
    <rect x="5" y="0" width="2" height="234" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="4" y="0" width="1" height="234" fill="#6A6A7B"/>
    <rect x="261" y="0" width="4" height="234" fill="url(#rightShade)"/>
    <rect x="0" y="222" width="270" height="7" fill="url(#footShade)"/>
  </g>
  <g fill="#BDB4BD">
    <rect x="18" y="6" width="170" height="18"/>
    <rect x="18" y="32" width="94" height="18"/>
    <rect x="18" y="52" width="94" height="18"/>
    <rect x="18" y="72" width="94" height="18"/>
    <rect x="18" y="112" width="170" height="18"/>
  </g>
  <g fill="#FFF69C">
    <rect x="115" y="32" width="39" height="18"/>
    <rect x="115" y="52" width="39" height="18"/>
    <rect x="115" y="72" width="39" height="18"/>
    <rect x="192" y="112" width="60" height="18"/>
  </g>
  <!-- the compass points -->
  <g transform="translate(206.6,12.8)">
    <use href="#letterN" transform="translate(0.7,0.7)" fill="#3A2E10"/>
    <use href="#letterN" fill="url(#brass)" stroke="#5A4618" stroke-width="0.3"/>
  </g>
  <g transform="translate(163,52.8)">
    <use href="#letterW" transform="translate(0.7,0.7)" fill="#3A2E10"/>
    <use href="#letterW" fill="url(#brass)" stroke="#5A4618" stroke-width="0.3"/>
  </g>
  <g transform="translate(246,52.8)">
    <use href="#letterE" transform="translate(0.7,0.7)" fill="#3A2E10"/>
    <use href="#letterE" fill="url(#brass)" stroke="#5A4618" stroke-width="0.3"/>
  </g>
  <g transform="translate(207,92.8)">
    <use href="#letterS" transform="translate(0.7,0.7)" fill="#3A2E10"/>
    <use href="#letterS" fill="url(#brass)" stroke="#5A4618" stroke-width="0.3"/>
  </g>
  <!-- the snow depth graph -->
  <defs>
    <rect id="box" x="36.5" y="149" width="214" height="65.5" rx="8"/>
    <clipPath id="boxClip"><use href="#box"/></clipPath>
  </defs>
  <use href="#box" transform="translate(-1.6,-1.2)" fill="none" stroke="#283040" stroke-opacity="0.8" stroke-width="3" filter="url(#soft)"/>
  <use href="#box" fill="#FFFFFF"/>
  <rect x="36.5" y="203" width="214" height="12" fill="url(#boxFoot)" clip-path="url(#boxClip)"/>
  <use href="#box" fill="none" stroke="#000000" stroke-width="1.6"/>
