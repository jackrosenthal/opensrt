<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Show actions button's picture: vector remake of the original Ski
       Resort Tycoon sprites show_actions_normal/_rollover/_depress, drawn
       over the round button frame.  A guest walking to the right in a
       blue cap, a red jacket with a yellow scarf, and jeans.  The same
       in every state. -->
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A6A"/>
      <stop offset="1" stop-color="#B4101A"/>
    </linearGradient>
    <linearGradient id="jeans" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7AB4F6"/>
      <stop offset="1" stop-color="#1A4A9C"/>
    </linearGradient>
  </defs>
  <!-- legs, mid stride, and shoes -->
  <path d="M15.4,18 L13,26.6 H15 L17.6,20.4 L20.2,26.6 H22.2 L20.6,18 Z" fill="url(#jeans)" stroke="#0A2A5A" stroke-width="0.4" stroke-linejoin="round"/>
  <path d="M10.6,26.4 H15.2 V27.8 H10.4 Z M19.8,26.4 H23.6 L24,27.8 H19.8 Z" fill="#3A3A4A"/>
  <!-- the jacket, its arms swinging, and the hands -->
  <path d="M14.4,12.2 H21.4 L23.6,18.2 L22.2,18.6 L21,15.8 L21.2,18.6 H15 L15.2,15.8 L13.2,18.6 L11.8,17.8 Z" fill="url(#jacket)" stroke="#5A0A10" stroke-width="0.4" stroke-linejoin="round"/>
  <circle cx="12.4" cy="18.8" r="1" fill="#5A6AD6"/>
  <circle cx="23.2" cy="19.2" r="1" fill="#5A6AD6"/>
  <!-- the scarf, its end flying back -->
  <path d="M15,11.2 H20.8 L21.2,12.6 H15 Z M20.4,11.6 L25.2,13 L24.6,15.6 L21.6,13.4 Z" fill="#E6D23A" stroke="#8A7A10" stroke-width="0.3" stroke-linejoin="round"/>
  <!-- the head and the cap -->
  <ellipse cx="17.6" cy="9.2" rx="2" ry="2.2" fill="#F6B49C"/>
  <path d="M15.4,8.4 C15.4,5.4 19.8,5.2 19.8,8.2 Z" fill="#6A70D2" stroke="#2A2A6A" stroke-width="0.3"/>
</svg>
