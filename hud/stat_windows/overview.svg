<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 234" width="270" height="234">
  <!-- Resort overview panel: vector remake of the original Ski Resort
       Tycoon sprite Resort_Overview_bkrnd, the resort window's first tab.
       The window list panel (list_panel.svg) with a grey strip for the
       ticker along its top, a sunken white box for the entrance's
       picture, and a grey plate for the lift ticket price beside the
       spinner. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#DEDEFF"/>
      <stop offset="1" stop-color="#9CB0E6"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="261" y1="0" x2="265" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A4A5A" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A4A5A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="footShade" x1="0" y1="222" x2="0" y2="229" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A5A84" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A5A84" stop-opacity="0.9"/>
    </linearGradient>
    <!-- a grey shade inside the foot of a box -->
    <linearGradient id="boxFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDBDBD" stop-opacity="0"/>
      <stop offset="1" stop-color="#BDBDBD"/>
    </linearGradient>
    <path id="inside" d="M4,0 H265 V215 A14,14 0 0 1 251,229 H18 A14,14 0 0 1 4,215 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- the rim, open along the top -->
  <path d="M0.8,0 H268.2 V215 A16.6,16.6 0 0 1 251.6,231.6 H17.4 A16.6,16.6 0 0 1 0.8,215 Z" fill="#000000"/>
  <use href="#inside" fill="url(#sky)"/>
  <g clip-path="url(#insideClip)">
    <!-- a pale band down the inside of the left rim, the bevels, and the
         shade along the foot -->
    <rect x="5" y="0" width="2" height="234" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="4" y="0" width="1" height="234" fill="#6A6A7B"/>
    <rect x="261" y="0" width="4" height="234" fill="url(#rightShade)"/>
    <rect x="0" y="222" width="270" height="7" fill="url(#footShade)"/>
  </g>
  <g fill="#BDB4BD">
    <rect x="33" y="9" width="152" height="17"/>
  </g>
  <!-- the entrance's picture -->
  <defs>
    <rect id="box" x="32.5" y="44" width="151" height="150.5" rx="9"/>
    <clipPath id="boxClip"><use href="#box"/></clipPath>
  </defs>
  <use href="#box" transform="translate(-1.6,-1.2)" fill="none" stroke="#283040" stroke-opacity="0.8" stroke-width="3" filter="url(#soft)"/>
  <use href="#box" fill="#FFFFFF"/>
  <rect x="32.5" y="183" width="151" height="12" fill="url(#boxFoot)" clip-path="url(#boxClip)"/>
  <use href="#box" fill="none" stroke="#000000" stroke-width="1.6"/>
  <!-- the price plate -->
  <rect x="195" y="180" width="39" height="29" fill="#9C9C9C"/>
</svg>
