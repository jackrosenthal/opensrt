      <stop offset="0" stop-color="#FF5A62"/>
      <stop offset="1" stop-color="#D51018"/>
    </linearGradient>
    <linearGradient id="green" x1="20" y1="13" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CF68B"/>
      <stop offset="0.5" stop-color="#4AB452"/>
      <stop offset="1" stop-color="#2A8B31"/>
    </linearGradient>
