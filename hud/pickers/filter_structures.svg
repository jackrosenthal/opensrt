<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 29" width="32" height="29">
  <!-- Mini-map structures filter's picture: vector remake of the
       original Ski Resort Tycoon sprites filter_structure_*, drawn over
       the filter button frame.  A log cabin seen from above a corner:
       a grey-brown shingled roof over honey log walls with a red door
       and blue windows.  The same in every state. -->
  <!-- the walls: the left one in shade, the right one lit -->
  <path d="M9.6,15.6 L16.6,19.2 V23.4 L9.6,19.8 Z" fill="#C88A4A"/>
  <path d="M16.6,19.2 L25,14.6 V18.8 L16.6,23.4 Z" fill="#E6B47B"/>
  <path d="M9.6,17.6 L16.6,21.2 M16.6,21.2 L25,16.6" stroke="#9C6A31" stroke-width="0.5" fill="none"/>
  <!-- door and windows -->
  <path d="M12,17.4 L13.8,18.3 V21.8 L12,20.9 Z" fill="#C52020"/>
  <path d="M10.2,17.1 L11.2,17.6 V19.2 L10.2,18.7 Z M14.6,19.5 L15.8,20.1 V21.7 L14.6,21.1 Z" fill="#4A6A9C"/>
  <path d="M18.4,19.8 L19.8,19 V20.8 L18.4,21.6 Z M22.2,17.6 L23.6,16.8 V18.6 L22.2,19.4 Z" fill="#62738B"/>
  <!-- the roof, a chimney on its ridge -->
  <path d="M8.6,15.4 L14,9.6 L17.4,11.2 L26,14.4 L16.6,19.6 Z" fill="#73625A" stroke="#4A3A31" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M14,9.6 L17.4,11.2 L26,14.4 L22.6,12.6 Z" fill="#8B7B73"/>
  <path d="M11,13 L18.8,17 M12.8,11.2 L21,15.4 M14.6,10.4 L23.2,14.4" stroke="#5A4A41" stroke-width="0.5" fill="none"/>
  <rect x="18.6" y="8.6" width="2" height="3.2" fill="#9C6A31"/>
</svg>
