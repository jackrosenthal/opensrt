<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 229" width="250" height="229">
  <!-- Objects and paths picker panel: vector remake of the original Ski
       Resort Tycoon sprite Objects_popup_Background.  The building
       picker's panel (background.svg) cut short under its three preview
       boxes, without the description box. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="4" x2="0" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0.04" stop-color="#94ACE6"/>
      <stop offset="0.16" stop-color="#A4B4E6"/>
      <stop offset="0.36" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#E6EEFF"/>
      <stop offset="0.8" stop-color="#BDCDF6"/>
      <stop offset="1" stop-color="#9CB4E6"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="241" y1="0" x2="246" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A5A6A" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A4A5A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="footShade" x1="0" y1="221" x2="0" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A5A84" stop-opacity="0"/>
      <stop offset="1" stop-color="#313952" stop-opacity="0.8"/>
    </linearGradient>
    <path id="inside" d="M15,4 H235 A11,11 0 0 1 246,15 V214 A11,11 0 0 1 235,225 H15 A11,11 0 0 1 4,214 V15 A11,11 0 0 1 15,4 Z"/>
    <clipPath id="insideClip"><use href="#inside"/></clipPath>
    <!-- The boxes, on the lines of their black edges. -->
    <rect id="left" x="17.5" y="43.5" width="51" height="100" rx="7"/>
    <rect id="middle" x="78.5" y="43.5" width="93" height="100" rx="7"/>
    <path id="right" d="M189,43.5 H232 V143.5 H189 A7,7 0 0 1 182,136.5 V50.5 A7,7 0 0 1 189,43.5 Z"/>
    <g id="boxes">
      <use href="#left"/>
      <use href="#middle"/>
      <use href="#right"/>
    </g>
    <clipPath id="boxClip">
      <use href="#left"/>
      <use href="#middle"/>
      <use href="#right"/>
    </clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- the rim and the slab -->
  <rect x="0.4" y="0.4" width="249.2" height="228.2" rx="15" fill="#000000"/>
  <use href="#inside" fill="url(#sky)"/>
  <g clip-path="url(#insideClip)">
    <!-- a pale line inside the rim at the top and left, and the shade
         down the right and along the foot -->
    <path d="M4.8,225 V15 A10.2,10.2 0 0 1 15,4.8 H246" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6"/>
    <rect x="241" y="0" width="5" height="229" fill="url(#rightShade)"/>
    <rect x="0" y="219" width="250" height="6" fill="url(#footShade)"/>
  </g>

  <!-- the boxes, sunk into the panel: shaded round their top and left
       outside, and along their bottom and right inside -->
  <use href="#boxes" transform="translate(-1.8,-1.6)" fill="none" stroke="#283040" stroke-opacity="0.7" stroke-width="3" filter="url(#soft)"/>
  <use href="#boxes" fill="#FFFFFF"/>
  <g clip-path="url(#boxClip)">
    <use href="#boxes" transform="translate(-2.6,-2.6)" fill="none" stroke="#9C9C9C" stroke-width="4" filter="url(#soft)"/>
  </g>

  <use href="#boxes" fill="none" stroke="#000000" stroke-width="1.6"/>
</svg>
