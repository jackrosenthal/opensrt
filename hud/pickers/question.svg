<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 93" width="88" height="93">
  <!-- Locked item's question mark: vector remake of the original Ski
       Resort Tycoon sprites Question_maark, QuestionLeft and
       QuestionRight (QuestionMark, QuestionMarkLeft and QuestionMarkRight
       in the lift picker, the same art), drawn over a picker's preview
       boxes for what is not yet available.  A fat yellow question mark
       rimmed in orange.  The middle box shows it whole (`whole`); the
       side boxes, 44 wide, show its right half (`left`) and its left
       half (`right`).  One group per state; the game shows one with a
       stylesheet. -->
  <defs>
    <path id="hook" d="M27,31 C27,19 35,15.5 43,15.5 C52,15.5 59,20 59,29 C59,38 50,40.5 46.5,44 C43.5,47 42,50 42,56"/>
    <linearGradient id="yellow" x1="25" y1="12" x2="60" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFF5A"/>
      <stop offset="0.45" stop-color="#F6F600"/>
      <stop offset="1" stop-color="#DEBD00"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <g id="mark">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <use href="#hook" stroke="#E66A00" stroke-width="16"/>
        <use href="#hook" stroke="url(#yellow)" stroke-width="10.5"/>
        <!-- lit along its top -->
        <use href="#hook" transform="translate(-1.2,-1.6)" stroke="#FFFF9C" stroke-width="3" stroke-opacity="0.8" filter="url(#soft)"/>
      </g>
      <circle cx="42" cy="75" r="8.6" fill="#E66A00"/>
      <circle cx="42" cy="75" r="5.6" fill="url(#yellow)"/>
      <circle cx="40.6" cy="73.4" r="2.2" fill="#FFFF9C" fill-opacity="0.8" filter="url(#soft)"/>
    </g>
    <clipPath id="half"><rect x="0" y="0" width="44" height="93"/></clipPath>
  </defs>

  <g id="whole" class="state">
    <use href="#mark"/>
  </g>
  <g id="left" class="state" display="none" clip-path="url(#half)">
    <use href="#mark" transform="translate(-44,0)"/>
  </g>
  <g id="right" class="state" display="none" clip-path="url(#half)">
    <use href="#mark"/>
  </g>
</svg>
