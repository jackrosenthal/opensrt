<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Rename box's Cancel button picture: vector remake of the original
       Ski Resort Tycoon sprites CancelX_normal/_rollover and
       cancelX_depress, drawn over the round button frame.  A thick red
       cross, its strokes flaring at the ends, standing out from the
       button on a tan shadow.  The same in every state. -->
  <defs>
    <!-- The cross, each stroke flared at its ends. -->
    <path id="cross" transform="translate(17.8,18) scale(0.86) translate(-17.8,-18)" d="M8.4,6.6 L12,8.4 L18,15 L24,8.4 L27.6,6.6 L28.8,10 L21,18 L28.4,25.8 L26.6,29.4 L23.6,28 L18,21.2 L11.4,28 L8.6,29.4 L6.8,25.8 L15,18 L7.2,10 Z" stroke-linejoin="round"/>
    <linearGradient id="red" x1="8" y1="7" x2="26" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4A4A"/>
      <stop offset="0.45" stop-color="#F60000"/>
      <stop offset="1" stop-color="#B40000"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <!-- a tan shadow down and to the right -->
  <use href="#cross" transform="translate(0.9,1.2)" fill="#C89664" fill-opacity="0.85" filter="url(#soft)"/>
  <use href="#cross" fill="url(#red)" stroke="#8C0000" stroke-width="0.5"/>
</svg>
