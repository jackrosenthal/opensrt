    <g id="disc-icon" transform="translate(0,3.200000000000003)">
      <circle cx="26.3" cy="24.4" r="23.4" fill="url(#disc)" stroke="#000000" stroke-width="4"/>
    <!-- a red cross, brushed -->
    <g fill="none" stroke-linecap="round">
      <path d="M17.2,14 C20.4,19.6 25.4,26.8 34.8,34.6 M35.4,14.6 C29.6,18.6 22.8,26 16.2,36.2" transform="translate(0.8,1)" stroke="#000000" stroke-opacity="0.25" stroke-width="4" filter="url(#soft)"/>
      <path d="M17.2,14 C20.4,19.6 25.4,26.8 34.8,34.6 M35.4,14.6 C29.6,18.6 22.8,26 16.2,36.2" stroke="#E61020" stroke-width="3.6"/>
      <path d="M16.8,13.4 C20,19 25,26.2 34.4,34 M35,14 C29.2,18 22.4,25.4 15.8,35.6" stroke="#FF8B94" stroke-width="1" stroke-opacity="0.8"/>
    </g>
    </g>
  </defs>

  <use href="#disc-icon"/>
  <g id="normal" class="state">
    <use href="#bar" fill="#FFFFFF" fill-opacity="0.85"/>
    <g clip-path="url(#barClip)">
      <use href="#bar" transform="translate(-3,-3)" fill="none" stroke="#9C9CA4" stroke-opacity="0.8" stroke-width="4" filter="url(#soft)"/>
    </g>
    <use href="#bar" fill="none" stroke="#000000" stroke-width="4.4"/>
    <use href="#words" transform="translate(3,3.6)" fill="#3A3A4A" fill-opacity="0.75" filter="url(#shadow)"/>
    <use href="#words" fill="#000000"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#bar" fill="#FFF673" fill-opacity="0.9"/>
    <g clip-path="url(#barClip)">
      <use href="#bar" transform="translate(-3,-3)" fill="none" stroke="#948B41" stroke-opacity="0.8" stroke-width="4" filter="url(#soft)"/>
    </g>
    <use href="#bar" fill="none" stroke="#000000" stroke-width="4.4"/>
    <use href="#words" transform="translate(3,3.6)" fill="#3A3A4A" fill-opacity="0.75" filter="url(#shadow)"/>
    <use href="#words" fill="#000000"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#bar" fill="#B4B4C5"/>
    <g clip-path="url(#barClip)">
      <use href="#bar" transform="translate(3,3)" fill="none" stroke="#3A3A42" stroke-opacity="0.8" stroke-width="4" filter="url(#soft)"/>
    </g>
    <use href="#bar" fill="none" stroke="#000000" stroke-width="4.4"/>
    <g transform="translate(1,1)">
      <use href="#words" transform="translate(3,3.6)" fill="#3A3A4A" fill-opacity="0.75" filter="url(#shadow)"/>
      <use href="#words" fill="#000000"/>
    </g>
  </g>
</svg>
