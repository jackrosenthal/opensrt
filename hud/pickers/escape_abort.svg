<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 55" width="396" height="55">
  <!-- Escape menu's Abort game button: vector remake of the original Ski
       Resort Tycoon sprites exit_abort_normal/_rollover/_depress.  A
       black ringed disc with a red brushed cross on it, and beside it a long black
       rimmed bar with rounded ends, white (letting a little of the
       scene through), yellow when the pointer is over it, and pressed in
       grey, lettered Abort game at its right end in black over a soft
       shadow.  The original's sprites carry the scene behind them; here
       the scene stays the menu's background.  One group per state; the
       game shows one with a stylesheet. -->
  <defs>
    <radialGradient id="disc" cx="22" cy="21.6" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F2F2F8"/>
      <stop offset="1" stop-color="#A4A4AC"/>
    </radialGradient>
    <linearGradient id="red" x1="16" y1="10" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A62"/>
      <stop offset="1" stop-color="#D51018"/>
    </linearGradient>
    <linearGradient id="green" x1="20" y1="13" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CF68B"/>
      <stop offset="0.5" stop-color="#4AB452"/>
      <stop offset="1" stop-color="#2A8B31"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <path id="bar" d="M83.7,8.2 H371.90000000000003 A19.3,19.3 0 0 1 371.90000000000003,46.8 H83.7 A19.3,19.3 0 0 1 83.7,8.2 Z"/>
    <clipPath id="barClip"><use href="#bar"/></clipPath>
