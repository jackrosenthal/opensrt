<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Security tab's picture: vector remake of the original Ski Resort
       Tycoon sprites Tab_Security_Normal/_Depress, drawn over the window
       icon tab frame.  A security guard in a blue police cap with a gold
       badge and dark glasses, grinning.  Shown as it is on the tab in
       front (normal) and dimmed on a tab behind (depress). -->
  <defs>
    <filter id="dim" x="0" y="0" width="45" height="34" filterUnits="userSpaceOnUse">
      <feColorMatrix type="matrix" values="0.6 0 0 0 0  0 0.6 0 0 0  0 0 0.6 0 0  0 0 0 1 0"/>
    </filter>
    <radialGradient id="skin" cx="-1" cy="15" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCC8A4"/>
      <stop offset="0.6" stop-color="#E8987A"/>
      <stop offset="1" stop-color="#B86448"/>
    </radialGradient>
    <radialGradient id="dome" cx="-3" cy="2" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="10.8" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFF90"/>
      <stop offset="1" stop-color="#9C9C00"/>
    </linearGradient>
    <g id="picture">
      <g transform="translate(22.6,4.6) scale(0.98)">
        <path d="M-8.4,10.6 C-8.6,17.4 -5.8,23.4 -2,25.2 C-0.7,25.7 0.8,25.7 2,25.2 C5.8,23.4 8.6,18 8.8,10.6 Z" fill="url(#skin)" stroke="#8A4C34" stroke-width="0.5"/>
        <path d="M-0.4,15.8 C-0.2,17.2 -1.4,18 -0.6,18.6 C0.2,19 1,18.8 1.6,18.4" fill="none" stroke="#A85A40" stroke-width="0.5" stroke-linecap="round"/>
        <path d="M-4.6,19.8 C-2.6,22.2 2.4,22.2 4.6,19.6 C2.6,20.6 -2.4,20.8 -4.6,19.8 Z" fill="#FFFFFF" stroke="#702818" stroke-width="0.6" stroke-linejoin="round"/>
        <path d="M-10.6,3.6 C-6,0 6,0 10.6,3.6 L8.4,8.8 H-8.4 Z" fill="#2A3CB0" stroke="#101850" stroke-width="0.5"/>
        <path d="M-10.6,3.6 C-6,0 6,0 10.6,3.6 L8.4,8.8 H-8.4 Z" fill="url(#dome)"/>
        <rect x="-8.4" y="8.4" width="16.8" height="2.2" fill="#101010"/>
        <path d="M-8.4,9.5 H8.4" stroke="#F0D020" stroke-width="0.5"/>
        <path d="M-8.6,10.6 C-4,12.6 4,12.6 8.6,10.6 C4,11.2 -4,11.2 -8.6,10.6 Z" fill="#000000" stroke="#000000" stroke-width="0.6"/>
        <path d="M0,2.6 L1.6,3.6 L1.2,5.8 L0,6.6 L-1.2,5.8 L-1.6,3.6 Z" fill="#F0D020" stroke="#806800" stroke-width="0.3"/>
        <g fill="#101010">
          <ellipse cx="-3.5" cy="14" rx="3" ry="1.9"/>
          <ellipse cx="3.7" cy="14" rx="3" ry="1.9"/>
        </g>
        <path d="M-6.6,13 H6.8" stroke="#101010" stroke-width="0.8"/>
        <path d="M-5,13.4 L-3.6,13 M2.2,13.4 L3.6,13" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.8"/>
      </g>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#picture"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#picture" filter="url(#dim)"/>
  </g>
</svg>
