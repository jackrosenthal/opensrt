<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 23" width="56" height="23">
  <!-- Open button: vector remake of the original Ski Resort Tycoon sprites
       Bldg_Open_normal/_rollover/_depress.  A green slab, bevelled, with
       "OPEN" in black capitals: lit along the top and left at rest,
       darker and sunk in under the pointer, bright when pressed.  One
       group per state; the game shows one with a stylesheet. -->
  <defs>
    <!-- the slab takes its color from the state's fill -->
    <rect id="slab" x="2" y="2" width="52" height="20"/>
    <path id="lit" d="M2,2 H54 L52.6,3.6 H3.6 V20.4 L2,22 Z"/>
    <path id="shade" d="M54,2 V22 H2 L3.6,20.4 H52.6 V3.6 Z"/>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <path id="word" d="M15.5,6.7 A4,4.35 0 1 1 15.49,6.7 Z M21.9,15.6 V6.9 H24.4 A2.3,2.3 0 0 1 24.4,11.5 H21.9 M33.2,6.9 H28.7 V15.3 H33.2 M28.7,11.1 H32.4 M35.7,15.6 V6.9 L41.7,15.3 V6.6" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="round"/>
    <!-- the pale edge round the top and left -->
    <path id="edge" d="M1,22 V1 H55" fill="none" stroke="#BDBDBD" stroke-width="1.2"/>
  </defs>

  <g id="normal" class="state">
    <use href="#slab" fill="#007B00"/>
    <g filter="url(#soft)">
      <use href="#lit" fill="#FFFFFF" fill-opacity="0.4"/>
      <use href="#shade" fill="#000000" fill-opacity="0.4"/>
    </g>
    <use href="#edge"/>
    <use href="#word"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#slab" fill="#006A00"/>
    <g filter="url(#soft)">
      <use href="#lit" fill="#000000" fill-opacity="0.5"/>
      <use href="#shade" fill="#FFFFFF" fill-opacity="0.3"/>
    </g>
    <use href="#edge"/>
    <use href="#word"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#slab" fill="#00FF00"/>
    <g filter="url(#soft)">
      <use href="#lit" fill="#FFFFFF" fill-opacity="0.4"/>
      <use href="#shade" fill="#000000" fill-opacity="0.4"/>
    </g>
    <use href="#edge"/>
    <use href="#word"/>
  </g>
</svg>
