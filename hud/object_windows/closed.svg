<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 23" width="56" height="23">
  <!-- Closed button: vector remake of the original Ski Resort Tycoon sprites
       Bldg_close_normal/_rollover/_depress.  A red slab, bevelled, with
       "CLOSED" in black capitals: lit along the top and left at rest,
       darker and sunk in under the pointer, bright when pressed.  One
       group per state; the game shows one with a stylesheet. -->
  <defs>
    <!-- the slab takes its color from the state's fill -->
    <rect id="slab" x="2" y="2" width="52" height="20"/>
    <path id="lit" d="M2,2 H54 L52.6,3.6 H3.6 V20.4 L2,22 Z"/>
    <path id="shade" d="M54,2 V22 H2 L3.6,20.4 H52.6 V3.6 Z"/>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <path id="word" d="M12.3,8.3 A4.2,4.4 0 1 0 12.3,13.7 M14.7,6.6 V15.3 H18 M22.7,6.7 A4,4.35 0 1 1 22.69,6.7 Z M32.9,8.2 C32.3,7.3 31.5,6.9 30.7,6.9 C29.4,6.9 28.6,7.7 28.6,8.8 C28.6,11.4 33.2,10.5 33.2,13.3 C33.2,14.6 32.2,15.3 30.8,15.3 C29.8,15.3 28.9,14.8 28.3,13.9 M40.1,6.9 H35.7 V15.3 H40.1 M35.7,11.1 H39.4 M42.6,6.9 H44.2 A4.1,4.2 0 0 1 44.2,15.3 H42.6 Z" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="round"/>
    <!-- the pale edge round the top and left -->
    <path id="edge" d="M1,22 V1 H55" fill="none" stroke="#BDBDBD" stroke-width="1.2"/>
  </defs>

  <g id="normal" class="state">
    <use href="#slab" fill="#940000"/>
    <g filter="url(#soft)">
      <use href="#lit" fill="#FFFFFF" fill-opacity="0.4"/>
      <use href="#shade" fill="#000000" fill-opacity="0.4"/>
    </g>
    <use href="#edge"/>
    <use href="#word"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#slab" fill="#7B0000"/>
    <g filter="url(#soft)">
      <use href="#lit" fill="#000000" fill-opacity="0.5"/>
      <use href="#shade" fill="#FFFFFF" fill-opacity="0.3"/>
    </g>
    <use href="#edge"/>
    <use href="#word"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#slab" fill="#FF0000"/>
    <g filter="url(#soft)">
      <use href="#lit" fill="#FFFFFF" fill-opacity="0.4"/>
      <use href="#shade" fill="#000000" fill-opacity="0.4"/>
    </g>
    <use href="#edge"/>
    <use href="#word"/>
  </g>
</svg>
