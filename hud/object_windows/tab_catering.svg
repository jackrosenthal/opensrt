<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Catering tab's picture: vector remake of the original Ski Resort
       Tycoon sprites Tab_Catering_Normal/_Depress, drawn over the window
       icon tab frame.  A chef in a tall white hat, with a curled
       moustache and a goatee.  Shown as it is on the tab in front
       (normal) and dimmed on a tab behind (depress). -->
  <defs>
    <filter id="dim" x="0" y="0" width="45" height="34" filterUnits="userSpaceOnUse">
      <feColorMatrix type="matrix" values="0.6 0 0 0 0  0 0.6 0 0 0  0 0 0.6 0 0  0 0 0 1 0"/>
    </filter>
    <radialGradient id="skin" cx="-1" cy="15" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCC8A4"/>
      <stop offset="0.6" stop-color="#E8987A"/>
      <stop offset="1" stop-color="#B86448"/>
    </radialGradient>
    <radialGradient id="dome" cx="-3" cy="2" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="10.8" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFF90"/>
      <stop offset="1" stop-color="#9C9C00"/>
    </linearGradient>
    <g id="picture">
      <g transform="translate(22,5) scale(0.98)">
        <path d="M-8.4,10.6 L-8.2,16.6 L-7,15.4 L-7,10.6 Z M8.8,10.6 L8.6,16.6 L7.4,15.4 L7.4,10.6 Z" fill="#4A2A14"/>
        <path d="M-8.4,10.6 C-8.6,17.4 -5.8,23.4 -2,25.2 C-0.7,25.7 0.8,25.7 2,25.2 C5.8,23.4 8.6,18 8.8,10.6 Z" fill="url(#skin)" stroke="#8A4C34" stroke-width="0.5"/>
        <path d="M-0.4,15.8 C-0.2,17.2 -1.4,18 -0.6,18.6 C0.2,19 1,18.8 1.6,18.4" fill="none" stroke="#A85A40" stroke-width="0.5" stroke-linecap="round"/>
        <path d="M-3.4,20.6 C-1.4,21.6 1.6,21.6 3.6,20.4" fill="none" stroke="#702818" stroke-width="0.7" stroke-linecap="round"/>
        <path d="M-6.2,19 C-5.6,20.6 -4,20.4 -2.6,19.6 C-1.4,19 -0.4,19 0.1,19.6 C0.6,19 1.6,19 2.8,19.6 C4.2,20.4 5.8,20.6 6.4,19 C5.8,21.6 3,21.6 0.1,20.8 C-2.8,21.6 -5.6,21.6 -6.2,19 Z" fill="#2A1A10" stroke="#100804" stroke-width="0.3"/>
        <path d="M-1.6,22.6 H1.8 L1.2,26.6 L0.1,27.6 L-1,26.6 Z" fill="#605858" stroke="#2A2424" stroke-width="0.3"/>
        <path d="M-7,10 V5.6 C-10.6,5.6 -10.8,0.6 -7,0.8 C-6,-1.6 -2,-1.8 0,0 C2,-1.8 6,-1.6 7,0.8 C10.8,0.6 10.6,5.6 7,5.6 V10 Z" fill="#F2F2F2" stroke="#707070" stroke-width="0.5"/>
        <path d="M-7,5.6 H7 M-3.6,0.8 C-4,2.4 -4,4 -3.6,5.6 M3.6,0.8 C4,2.4 4,4 3.6,5.6" fill="none" stroke="#A8A8A8" stroke-width="0.5"/>
        <rect x="-7" y="5.6" width="14" height="4.4" fill="#000000" fill-opacity="0.12"/>
        <g fill="#3A2010">
          <ellipse cx="-3.4" cy="13.8" rx="1.3" ry="0.9"/>
          <ellipse cx="3.6" cy="13.8" rx="1.3" ry="0.9"/>
        </g>
        <path d="M-5.2,11.9 H-1.8 M2,11.9 H5.4" stroke="#3A2010" stroke-width="0.8" stroke-linecap="round"/>
      </g>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#picture"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#picture" filter="url(#dim)"/>
  </g>
</svg>
