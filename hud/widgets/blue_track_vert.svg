  <rect x="3" y="0" width="16" height="134" fill="#418B83"/>
  <rect x="19" y="0" width="1" height="134" fill="#62DECD"/>
  <rect x="20" y="0" width="1" height="134" fill="#4AB4E6"/>
  <rect x="21" y="0" width="1" height="134" fill="#2073CD"/>
