<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 34" width="45" height="34">
  <!-- Window icon tab: the frame shared by the original Ski Resort
       Tycoon's picture tabs (Tab_GuestOverview_Normal/_Depress,
       Tab_Cash_Normal/_Depress and the rest), without their pictures.
       Each tab's picture is its own drawing laid out on this 45x34 grid
       and drawn over this frame (Svg frame), with the same state shown.
       A black rimmed arch standing on the rule along the title tray's
       foot: white for the tab in front (normal), whose foot opens into
       the panel below, grey for the tabs behind (depress). -->
  <defs>
    <path id="arch" d="M1.6,31 V16 A14.4,14.4 0 0 1 16,1.6 H27.6 A14.4,14.4 0 0 1 42,16 V31"/>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <!-- the rule along the title tray's foot -->
    <g id="rule">
      <rect x="0" y="30" width="45" height="1" fill="#ACACAC"/>
      <rect x="0" y="31" width="45" height="1" fill="#000000"/>
      <rect x="0" y="32" width="45" height="1" fill="#8B8B94"/>
      <rect x="0" y="33" width="45" height="1" fill="#FFFFFF"/>
    </g>
  </defs>

  <g id="normal" class="state">
    <use href="#rule"/>
    <use href="#arch" fill="#FFFFFF"/>
    <rect x="2.4" y="29" width="39" height="5" fill="#FFFFFF"/>
    <!-- a grey bevel inside the left of the rim -->
    <path d="M3,31 V16 A13,13 0 0 1 16,3" fill="none" stroke="#B4B4B4" stroke-width="0.8" filter="url(#soft)"/>
    <use href="#arch" fill="none" stroke="#000000" stroke-width="1.8"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#arch" fill="#9C9C9C"/>
    <use href="#rule"/>
    <path d="M3,30 V16 A13,13 0 0 1 16,3" fill="none" stroke="#525252" stroke-width="0.8" filter="url(#soft)"/>
    <use href="#arch" fill="none" stroke="#000000" stroke-width="1.8"/>
  </g>
</svg>
