<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- Scroll up arrow of a front-end screen's list: vector remake of the
       original Ski Resort Tycoon sprites
       Scroll_Up_Normal/_Rollover/_Depress.  One group per state; the
       game shows one with a stylesheet. -->
  <defs>
    <!-- The arrow: a triangle with a black rim, filled white, grey
         when the pointer is over it and black when pressed, with a grey
         band inside along its back edge. -->
    <path id="arrow" d="M11.2,6.6 L4.4,19 L17.8,19 Z"/>
    <clipPath id="inside"><use href="#arrow"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <!-- a soft dark edge round the rim -->
    <use id="halo" href="#arrow" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="3.6" stroke-linejoin="round" filter="url(#soft)"/>
    <g id="back" clip-path="url(#inside)">
      <line x1="4.4" y1="19" x2="17.8" y2="19" stroke-width="4.6"/>
    </g>
    <use id="outline" href="#arrow" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  </defs>

  <g id="normal" class="state">
    <use href="#halo"/>
    <use href="#arrow" fill="#FFFFFF"/>
    <use href="#back" stroke="#8B8B8B"/>
    <use href="#outline"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#halo"/>
    <use href="#arrow" fill="#838383"/>
    <use href="#back" stroke="#8B8B8B"/>
    <use href="#outline"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#halo"/>
    <use href="#arrow" fill="#000000"/>
    <use href="#back" stroke="#000000"/>
    <use href="#outline"/>
  </g>
</svg>
