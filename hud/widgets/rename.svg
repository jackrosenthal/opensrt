<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Rename button's picture: vector remake of the original Ski Resort
       Tycoon sprites rename_normal/_rollover/_depress, drawn over the
       round button frame.  An unrolled scroll, written on, with a blue
       quill pen resting on it.  The same in every state. -->
  <defs>
    <linearGradient id="paper" x1="8" y1="10" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F2EA"/>
      <stop offset="0.6" stop-color="#E2DED0"/>
      <stop offset="1" stop-color="#B8B4A6"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="-2.6" x2="0" y2="2.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E6E2D6"/>
      <stop offset="1" stop-color="#8C887C"/>
    </linearGradient>
    <linearGradient id="feather" x1="20" y1="18" x2="28.5" y2="7.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A5ED0"/>
      <stop offset="0.5" stop-color="#7C90F0"/>
      <stop offset="1" stop-color="#B8C4FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <!-- shadow on the button -->
  <path d="M7,12 L22.6,8.6 L28.6,23 L11.6,28.4 Z" fill="#000000" fill-opacity="0.18" filter="url(#soft)" transform="translate(0.8,1)"/>
  <!-- the sheet, with lines of writing -->
  <path d="M7.4,11.6 L22.4,8.4 L26.6,22 L11.2,26.4 Z" fill="url(#paper)" stroke="#8C887C" stroke-width="0.5" stroke-linejoin="round"/>
  <g stroke="#8C8C88" stroke-width="0.8" stroke-linecap="round">
    <path d="M10.6,13.6 L15,12.6 M16.4,12.3 L19.4,11.6"/>
    <path d="M11.4,16.4 L14.6,15.6 M15.8,15.4 L20.2,14.4"/>
    <path d="M12.2,19.2 L17.2,18"/>
    <path d="M13,22 L15.8,21.4 M17,21 L19.6,20.4"/>
  </g>
  <!-- the roll along the top, curled at its left end -->
  <g transform="translate(7.4,11.6) rotate(-12)">
    <rect x="0" y="-2.2" width="15.4" height="4.4" rx="2.2" fill="url(#roll)" stroke="#8C887C" stroke-width="0.5"/>
    <circle cx="0.6" cy="0" r="2.6" fill="#F0EEE6" stroke="#8C887C" stroke-width="0.5"/>
    <path d="M0.6,0 m-0.9,0 a0.9,0.9 0 1 1 1.8,0 a1.6,1.6 0 1 1 -3.2,0" fill="none" stroke="#8C887C" stroke-width="0.5"/>
  </g>
  <!-- the roll along the bottom -->
  <g transform="translate(10.6,26.6) rotate(-16)">
    <rect x="0" y="-2.6" width="18.4" height="5.2" rx="2.6" fill="url(#roll)" stroke="#7A766A" stroke-width="0.5"/>
    <ellipse cx="17" cy="0" rx="1.4" ry="2.6" fill="#D6D2C4" stroke="#7A766A" stroke-width="0.5"/>
  </g>
  <!-- the quill, its nib on the sheet -->
  <path d="M19.4,18.6 C21,14.6 24.4,10.2 28.6,7 C27.4,11.4 24,15.6 20.4,19 Z" fill="url(#feather)" stroke="#3A4AA8" stroke-width="0.4" stroke-linejoin="round"/>
  <path d="M19.4,18.6 L28.2,7.4" stroke="#E8ECFF" stroke-width="0.4" stroke-opacity="0.8"/>
  <path d="M19.4,18.6 L18.4,20.4 L20.2,19.2 Z" fill="#202030"/>
</svg>
