<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 25" width="26" height="25">
  <!-- Close button: vector remake of the original Ski Resort Tycoon
       sprites SPU_Close_Normal/_Rollover/_Depress, the same in every
       window that has one.  A brushed cross: red, yellow when the
       pointer is over it, grey when pressed.  One group per state; the
       game shows one with a stylesheet. -->
  <defs>
    <!-- The two strokes, each bending a little as a brush would. -->
    <path id="down" d="M5,3.6 C6.6,7.4 8.4,10.4 10.8,13 C13,15.4 15.2,17.4 17.8,18.8"/>
    <path id="up" d="M18.4,3.6 C15.4,6.4 12.2,9.2 10,12 C7.8,14.8 5.6,16.8 2.6,18.4"/>
    <g id="cross" fill="none" stroke-linecap="round">
      <use href="#down"/>
      <use href="#up"/>
    </g>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.3"/>
    </filter>
    <!-- shadow on the window, down and to the right -->
    <use id="shadow" href="#cross" transform="translate(2.6,2.8)" stroke="#000000" stroke-opacity="0.34" stroke-width="3.2" filter="url(#soft)"/>
  </defs>

  <g id="normal" class="state">
    <use href="#shadow"/>
    <use href="#cross" transform="translate(0.4,0.6)" stroke="#942929" stroke-width="3"/>
    <use href="#cross" stroke="#DE0000" stroke-width="2.6"/>
    <use href="#cross" transform="translate(-0.6,-0.6)" stroke="#FF8B8B" stroke-width="1.1" filter="url(#edge)"/>
  </g>
  <g id="rollover" class="state" display="none">
    <use href="#shadow"/>
    <use href="#cross" transform="translate(0.4,0.6)" stroke="#949429" stroke-width="3"/>
    <use href="#cross" stroke="#DEDE00" stroke-width="2.6"/>
    <use href="#cross" transform="translate(-0.6,-0.6)" stroke="#FFFF8B" stroke-width="1.1" filter="url(#edge)"/>
  </g>
  <g id="depress" class="state" display="none">
    <use href="#shadow"/>
    <use href="#cross" transform="translate(0.4,0.6)" stroke="#525252" stroke-width="3"/>
    <use href="#cross" stroke="#7B7B7B" stroke-width="2.6"/>
    <use href="#cross" transform="translate(-0.6,-0.6)" stroke="#ACACAC" stroke-width="1.1" filter="url(#edge)"/>
  </g>
</svg>
