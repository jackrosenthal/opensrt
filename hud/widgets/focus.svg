<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 36" width="35" height="36">
  <!-- Focus button's picture: vector remake of the original Ski Resort
       Tycoon sprites focus_normal/_rollover/_depress (fire_* in the guest
       window, the same art), drawn over the round button frame.  Four
       red arrows pointing in at a red dot: the view centers on what the
       window shows.  The same in every state. -->
  <defs>
    <!-- One arrow, pointing down at the center from above. -->
    <path id="arrow" d="M16,6.6 H19 V10 H20.9 L17.5,14.4 L14.1,10 H16 Z"/>
    <g id="arrows">
      <use href="#arrow"/>
      <use href="#arrow" transform="rotate(90,17.5,17.4)"/>
      <use href="#arrow" transform="rotate(180,17.5,17.4)"/>
      <use href="#arrow" transform="rotate(270,17.5,17.4)"/>
      <circle cx="17.5" cy="17.4" r="2.7"/>
    </g>
    <linearGradient id="red" x1="12" y1="10" x2="23" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4050"/>
      <stop offset="0.45" stop-color="#E00018"/>
      <stop offset="1" stop-color="#9A0010"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <!-- a tan shadow down and to the right -->
  <use href="#arrows" transform="translate(0.9,1.1)" fill="#C89664" fill-opacity="0.8" filter="url(#soft)"/>
  <use href="#arrows" fill="url(#red)" stroke="#8C0010" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- lit along the top -->
  <use href="#arrows" fill="none" stroke="#FFB4B4" stroke-width="0.6" stroke-opacity="0.6" transform="translate(-0.3,-0.4)" filter="url(#soft)"/>
</svg>
