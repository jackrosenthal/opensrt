<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 57" width="404" height="57">
  <!-- Main menu button: vector remake of the frame shared by the
       original Ski Resort Tycoon sprites main_instant_*,
       main_challenges_*, main_load_*, main_settings_*, main_map_*, and
       main_credits_*.  A black ring round a white disc for the picture,
       then a black rimmed pill for the label: white shading to grey at
       its foot, yellow under the pointer, and grey, shaded under its
       rim, when pressed.  The pictures and labels are drawings of their
       own over it.  Laid out on the Challenges button; each drawing
       over it moves it by its viewBox to where its own sprite has it.
       One group per state; the game shows one with a stylesheet. -->
  <defs>
    <linearGradient id="white" x1="0" y1="10.5" x2="0" y2="45.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EAF0"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.74" stop-color="#FFFFFF"/>
      <stop offset="0.86" stop-color="#DCE0E4"/>
      <stop offset="1" stop-color="#BEC2CA"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="10.5" x2="0" y2="45.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAEA9A"/>
      <stop offset="0.3" stop-color="#FFF673"/>
      <stop offset="0.74" stop-color="#FFF673"/>
      <stop offset="0.86" stop-color="#DEDA70"/>
      <stop offset="1" stop-color="#C2C072"/>
    </linearGradient>
    <path id="face" d="M84.5,10.5 H377.5 A17.5,17.5 0 0 1 395,28 V28 A17.5,17.5 0 0 1 377.5,45.5 H84.5 A17.5,17.5 0 0 1 67,28 V28 A17.5,17.5 0 0 1 84.5,10.5 Z"/>
    <clipPath id="faceClip"><use href="#face"/></clipPath>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.46"/>
    </filter>
    <radialGradient id="disc" cx="26" cy="24" r="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F6F6FA"/>
      <stop offset="0.85" stop-color="#D2D4DE"/>
      <stop offset="1" stop-color="#A4A8B6"/>
    </radialGradient>
  </defs>

  <!-- the ring round the picture, the same in every state -->
  <circle cx="30" cy="28.5" r="23.6" fill="url(#disc)" stroke="#000000" stroke-width="5.6"/>

  <g id="normal" class="state">
    <path d="M84.5,6.1 H377.5 A21.9,21.9 0 0 1 399.4,28 V28 A21.9,21.9 0 0 1 377.5,49.9 H84.5 A21.9,21.9 0 0 1 62.6,28 V28 A21.9,21.9 0 0 1 84.5,6.1 Z" fill="#000000"/>
    <use href="#face" fill="url(#white)"/>
  </g>
  <g id="rollover" class="state" display="none">
    <path d="M84.5,6.1 H377.5 A21.9,21.9 0 0 1 399.4,28 V28 A21.9,21.9 0 0 1 377.5,49.9 H84.5 A21.9,21.9 0 0 1 62.6,28 V28 A21.9,21.9 0 0 1 84.5,6.1 Z" fill="#000000"/>
    <use href="#face" fill="url(#yellow)"/>
  </g>
  <g id="depress" class="state" display="none">
    <path d="M84.5,6.1 H377.5 A21.9,21.9 0 0 1 399.4,28 V28 A21.9,21.9 0 0 1 377.5,49.9 H84.5 A21.9,21.9 0 0 1 62.6,28 V28 A21.9,21.9 0 0 1 84.5,6.1 Z" fill="#000000"/>
    <use href="#face" fill="#BCC2C6"/>
    <g clip-path="url(#faceClip)">
      <use href="#face" transform="translate(-2.5,-3)" fill="none" stroke="#5A6068" stroke-width="5" filter="url(#soft)"/>
    </g>
  </g>
</svg>
