  <!-- The Save Game screen's panels and lettering: vector remake of
       what is painted into the original Ski Resort Tycoon background
       background of save_game over the mountain scene.  The game draws
       the scene (scene.svg) first, and this over
       the title tab (title.svg).  The panels are white frosting with a
       black rim, shaded inside their right and bottom edges.  The game
       types the name into the small panel and lists the saves in the
       big one. -->
